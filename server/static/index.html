<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识蒸馏站 · 把收藏夹变成学习进度表</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page" id="page">
    <!-- 侧边栏：logo / 一级导航 + 收藏夹二级导航 / 用户信息 -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15"><polygon points="12,4.5 19.5,16.5 4.5,16.5" fill="none" stroke="#f6fbf3" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="4.5" r="1.9" fill="#f6fbf3"/><circle cx="19.5" cy="16.5" r="1.9" fill="#f6fbf3"/><circle cx="4.5" cy="16.5" r="1.9" fill="#f6fbf3"/></svg>
          </span>
          知识蒸馏站
          <button class="sidebar-toggle" id="sidebar-toggle" title="收起侧边栏" aria-label="收起侧边栏">
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><polyline points="13,6 7,12 13,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <nav class="nav-list">
          <a class="nav-item" href="#" id="nav-home">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 11 L12 4.5 L20 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5 V19.5 H18 V10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            首页
          </a>

          <div class="nav-group open" id="fav-group">
            <button class="nav-item nav-parent current" id="fav-parent">
              <span class="left">
                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><polygon points="12,5 19,16 5,16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
                我的收藏
              </span>
              <svg class="chevron" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><polyline points="7,10 12,15 17,10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="nav-sub" id="fav-sub">
              <!-- 收藏夹列表动态渲染 -->
              <div class="nav-sub-loading" id="fav-sub-loading">加载中……</div>
            </div>
          </div>

          <a class="nav-item" href="#" id="nav-history">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="12,7.5 12,12 15,13.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            学习记录
          </a>
        </nav>

        <div class="user-block" id="user-block">
          <span class="nav-avatar" id="user-avatar">·</span>
          <div class="user-meta">
            <b id="user-name">未登录</b>
            <small id="user-sub">点击登录知乎账号</small>
          </div>
        </div>
      </div>
    </aside>

    <!-- 内容区 -->
    <main class="content">
      <div class="toolbar">
        <div class="toolbar-left">
          <button class="sidebar-toggle" id="sidebar-expand" title="展开侧边栏" aria-label="展开侧边栏">
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><polyline points="11,6 17,12 11,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2 id="favlist-title">我的收藏 <span class="count" id="count-badge"></span></h2>
        </div>
        <div class="toolbar-right">
          <span class="loaded-badge" id="loaded-badge" hidden></span>
          <select id="sort-select" class="select" aria-label="排序方式">
            <option value="favtime">收藏时间（新→旧）</option>
            <option value="combined">综合分数（高→低）</option>
            <option value="approval">认可度（高→低）</option>
            <option value="richness">信息量（高→低）</option>
            <option value="credibility">准确性（高→低）</option>
          </select>
          <button class="btn-ghost" id="refresh-btn">刷新</button>
        </div>
      </div>

      <div class="cards" id="cards"></div>

      <div class="state-box" id="state-loading" hidden>
        <div class="spinner"></div>
        <p id="loading-text">正在读取收藏夹……</p>
      </div>
      <div class="state-box" id="state-error" hidden>
        <span class="state-icon">⚠️</span>
        <p id="error-text"></p>
        <button class="btn-primary" id="retry-btn">重试</button>
      </div>
      <div class="state-box" id="state-empty" hidden>
        <span class="state-icon">🗒️</span>
        <p id="empty-text">这个收藏夹还是空的。</p>
      </div>
      <div class="state-box" id="state-login" hidden>
        <span class="state-icon">🔗</span>
        <p id="login-text">连接你的知乎收藏夹，开始蒸馏。</p>
        <button class="btn-primary" id="login-btn">连接我的知乎收藏夹</button>
      </div>

      <!-- 底部分页器（浮动） -->
      <nav class="pager" id="pager" hidden aria-label="分页"></nav>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
