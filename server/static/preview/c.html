<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风格 C · 深化蓝白</title>
<style>
  :root {
    --bg: #f7f9fc;
    --card: #ffffff;
    --ink: #16202b;
    --ink-2: #5b6b7c;
    --ink-3: #95a3b3;
    --line: #e6ebf2;
    --blue: #2563eb;
    --gold: #d97706;
    --sky: #0ea5e9;
    --violet: #7c3aed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 300px at 50% -80px, rgba(37,99,235,.07), transparent 70%),
      var(--bg);
    color: var(--ink); line-height: 1.6; padding-bottom: 60px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .topbar {
    max-width: 1060px; margin: 0 auto; padding: 20px 20px 8px;
    display: flex; align-items: center; gap: 8px; font-weight: 700;
  }
  .hero { max-width: 1060px; margin: 0 auto; padding: 28px 20px 12px; }
  .hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -.3px; }
  .hero p { color: var(--ink-2); margin-top: 10px; max-width: 560px; font-size: 15px; }
  /* 提纯分隔线：从灰到蓝的渐变 */
  .purify {
    max-width: 1020px; height: 1px; margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, #c7d2e2 20%, var(--blue) 50%, #c7d2e2 80%, transparent);
    opacity: .5;
  }
  .toolbar {
    max-width: 1060px; margin: 14px auto 0; padding: 0 20px 14px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .toolbar h2 { font-size: 18px; }
  .count { color: var(--blue); font-weight: 700; font-size: 13px; margin-left: 8px; }
  .sort { color: var(--ink-3); font-size: 13px; border: 1px solid var(--line); padding: 5px 10px; border-radius: 8px; background: #fff; }
  .cards {
    max-width: 1060px; margin: 18px auto 0; padding: 0 20px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px 14px;
    box-shadow: 0 1px 2px rgba(22,32,43,.04), 0 10px 28px -12px rgba(37,99,235,.16);
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(22,32,43,.05), 0 16px 36px -12px rgba(37,99,235,.24);
  }
  .card-title { font-size: 16.5px; font-weight: 700; line-height: 1.55; }
  .meta { color: var(--ink-3); font-size: 12.5px; margin: 8px 0 10px; display: flex; gap: 10px; }
  .tag { background: #eef4ff; color: var(--blue); padding: 1px 8px; border-radius: 6px; }
  .summary { color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .main { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .legend .row { display: flex; align-items: center; gap: 7px; }
  .legend b { color: var(--ink); margin-left: auto; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend .bar { flex: 1; height: 5px; background: #eef1f6; border-radius: 99px; overflow: hidden; }
  .legend .bar i { display: block; height: 100%; border-radius: 99px; }
  .radar { width: 92px; flex: 0 0 92px; }
  .stamp { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 8px; color: var(--ink-3); font-size: 11.5px; }
</style>
</head>
<body>
  <div class="topbar"><span>🧪</span><span>知识蒸馏站</span></div>
  <div class="hero">
    <h1>你的收藏夹，<br>不该只是收藏。</h1>
    <p>连接你的知乎收藏夹，这里逐条呈现每篇内容的认可度、信息量、准确性——帮你找出真正值得花时间学的那一篇。</p>
  </div>
  <div class="purify"></div>
  <div class="toolbar">
    <div><h2>我的收藏 <span class="count">49 条</span></h2></div>
    <div class="sort">排序：收藏时间（新→旧）</div>
  </div>
  <div class="cards" id="cards"></div>

<script>
const items = [
  { type: "文章", author: "某研究者", time: "11 天前收藏 · 2026-09-02",
    title: "从贝叶斯视角理解反向传播：为什么深度学习需要概率论",
    summary: "很多人把反向传播当作纯粹的链式法则练习，但如果从贝叶斯的角度看，整个训练过程其实是在做后验推断……",
    s: { approval: 78, richness: 81, credibility: 55 } },
  { type: "回答", author: "费曼手记", time: "16 天前收藏 · 2026-08-28",
    title: "费曼学习法的真正难点：如何暴露自己的知识盲区",
    summary: "讲给别人听只是形式，真正难的是找到自己「以为懂了」的地方。这篇文章给了一个可操作的自检流程……",
    s: { approval: 39, richness: 83, credibility: 65 } },
];
const COLORS = { approval: "#d97706", richness: "#0ea5e9", credibility: "#7c3aed" };
const NAMES = { approval: "认可度", richness: "信息量", credibility: "准确性" };
let uid = 0;

function radar(s) {
  const id = "grad" + (++uid);
  const W = 92, H = 84, cx = 46, cy = 50, R = 40;
  const rad = d => d * Math.PI / 180;
  const pt = (a, r) => [cx + r * Math.cos(rad(a)), cy + r * Math.sin(rad(a))];
  const axes = [[s.approval, -90], [s.richness, 30], [s.credibility, 150]];
  let g = "";
  for (const lv of [1/3, 2/3, 1]) {
    g += `<polygon points="${axes.map(([,a]) => pt(a, R*lv).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#e6ebf2" stroke-width="1" stroke-dasharray="${lv===1 ? "0" : "3 4"}"/>`;
  }
  const spokes = axes.map(([,a]) => { const [x,y]=pt(a,R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e6ebf2"/>`; }).join("");
  const data = axes.map(([v,a]) => pt(a, R*Math.min(100,v)/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  const dots = axes.map(([v,a]) => { const [x,y]=pt(a,R*Math.min(100,v)/100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#fff" stroke="#2563eb" stroke-width="2"/>`; }).join("");
  return `<svg class="radar" viewBox="0 0 ${W} ${H}">
    <defs><radialGradient id="${id}" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity=".28"/>
    </radialGradient></defs>
    ${g}${spokes}
    <polygon points="${data}" fill="url(#${id})" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/>${dots}</svg>`;
}

document.getElementById("cards").innerHTML = items.map(it => `
  <article class="card">
    <div class="card-title">${it.title}</div>
    <div class="meta"><span class="tag">${it.type}</span><span>${it.author}</span><span>${it.time}</span></div>
    <div class="summary">${it.summary}</div>
    <div class="main">
      <div class="legend">
        ${Object.entries(it.s).map(([k,v]) => `
          <div class="row"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}
            <span class="bar"><i style="width:${v}%;background:linear-gradient(90deg, ${COLORS[k]}99, ${COLORS[k]})"></i></span><b>${v}</b></div>`).join("")}
      </div>
      ${radar(it.s)}
    </div>
    <div class="stamp">依据：收藏 463 · 赞同 283 · 评论 21</div>
  </article>`).join("");
</script>
</body>
</html>
