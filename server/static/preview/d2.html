<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向二 · 工程蓝图</title>
<style>
  /* 方向二 · 工程蓝图
     题材依据：把"提取精华"当作精密工程——收藏是原料，学习值是工程指标。
     色板：图纸底 #eef2f7 · 网格 #d9e2ec · 墨 #1e2a36 · 工程蓝 #2b6cb0 · 标注橙 #c05621
     字体：标题无衬线（制图标题栏感），数据与标注等宽
     记忆点：图纸边框 + 卡片底部的「图签栏」（编号 / 指标 / 日期） */
  :root {
    --paper: #eef2f7;
    --card: #f8fafc;
    --grid: #d9e2ec;
    --ink: #1e2a36;
    --ink-2: #52616f;
    --ink-3: #93a1af;
    --blue: #2b6cb0;
    --orange: #c05621;
    --line: #cbd7e3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink); line-height: 1.65; padding-bottom: 64px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  .topbar { max-width: 1060px; margin: 0 auto; padding: 22px 20px 4px; display: flex; align-items: baseline; gap: 10px; }
  .brand-name { font-size: 17px; font-weight: 800; letter-spacing: .5px; }
  .brand-code { color: var(--blue); font-size: 12px; letter-spacing: 2px; }

  .hero { max-width: 1060px; margin: 0 auto; padding: 30px 20px 6px; }
  .hero h1 { font-size: 36px; font-weight: 800; letter-spacing: -.5px; line-height: 1.4; }
  .hero h1 span { color: var(--blue); }
  .hero .rule { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; color: var(--ink-3); font-size: 11.5px; letter-spacing: 1px; }
  .hero .rule::before, .hero .rule::after { content: ""; height: 1px; background: var(--line); flex: 0 0 60px; }
  .hero .rule::after { flex: 1; }
  .hero p { color: var(--ink-2); max-width: 560px; font-size: 15px; }

  .toolbar {
    max-width: 1060px; margin: 22px auto 0; padding: 0 20px 12px;
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink);
  }
  .toolbar h2 { font-size: 18px; letter-spacing: .5px; }
  .count { color: var(--blue); font-size: 12.5px; margin-left: 8px; }
  .sort { color: var(--ink-2); font-size: 12.5px; border: 1px solid var(--line); padding: 4px 10px; background: var(--card); }

  .cards { max-width: 1060px; margin: 22px auto 0; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    background: var(--card); border: 1.5px solid var(--ink); padding: 0; position: relative;
  }
  .card-inner { padding: 18px 20px 14px; }
  .card-title { font-size: 16.5px; font-weight: 750; line-height: 1.55; }
  .meta { color: var(--ink-3); font-size: 12px; margin: 8px 0 10px; display: flex; gap: 10px; }
  .tag { border: 1px solid var(--line); color: var(--blue); padding: 0 7px; }
  .summary { color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .main { display: flex; gap: 18px; align-items: center; margin-top: 14px; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--ink-2); }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .bar { flex: 1; height: 6px; background: #e2e8f0; outline: 1px solid var(--line); }
  .legend .bar i { display: block; height: 100%; }
  .legend .score { color: var(--ink); font-weight: 700; font-size: 12.5px; min-width: 26px; text-align: right; }
  .radar { width: 96px; flex: 0 0 96px; }

  /* 图签栏：图纸式信息栏 */
  .titleblock {
    border-top: 1.5px solid var(--ink); display: flex; font-size: 10.5px; letter-spacing: .5px;
    color: var(--ink-2); background: rgba(43,108,176,.05);
  }
  .titleblock .cell { padding: 6px 10px; border-right: 1px solid var(--line); }
  .titleblock .cell:last-child { border-right: 0; margin-left: auto; color: var(--blue); }
  .titleblock b { color: var(--ink); font-weight: 700; }

  .corner {
    position: absolute; top: 0; right: 0; width: 0; height: 0;
    border-style: solid; border-width: 0 18px 18px 0;
    border-color: transparent var(--orange) transparent transparent;
  }
</style>
</head>
<body>
  <div class="topbar"><span>🧪</span><span class="brand-name">知识蒸馏站</span><span class="brand-code mono">DISTILL-DWG-01</span></div>
  <div class="hero">
    <h1>你的收藏夹，<br>不该<span>只是</span>收藏。</h1>
    <div class="rule mono">SIGNAL EXTRACTION SPEC</div>
    <p>连接你的知乎收藏夹，逐条呈现认可度、信息量、准确性——像一张工程图，标出真正值得花时间学的那一篇。</p>
  </div>
  <div class="toolbar">
    <div><h2>我的收藏 <span class="count mono">49 ITEMS</span></h2></div>
    <div class="sort mono">SORT: FAV-TIME ↓</div>
  </div>
  <div class="cards" id="cards"></div>

<script>
const items = [
  { type: "文章", author: "某研究者", time: "11 天前收藏", no: "A-017",
    title: "从贝叶斯视角理解反向传播：为什么深度学习需要概率论",
    summary: "很多人把反向传播当作纯粹的链式法则练习，但如果从贝叶斯的角度看，整个训练过程其实是在做后验推断……",
    s: { approval: 78, richness: 81, credibility: 55 }, combined: 74 },
  { type: "回答", author: "费曼手记", time: "16 天前收藏", no: "A-021",
    title: "费曼学习法的真正难点：如何暴露自己的知识盲区",
    summary: "讲给别人听只是形式，真正难的是找到自己「以为懂了」的地方。这篇文章给了一个可操作的自检流程……",
    s: { approval: 39, richness: 83, credibility: 65 }, combined: 58 },
];
const COLORS = { approval: "#c05621", richness: "#2b6cb0", credibility: "#2f855a" };
const NAMES = { approval: "认可度", richness: "信息量", credibility: "准确性" };

function radar(s) {
  const W = 96, H = 88, cx = 48, cy = 52, R = 41;
  const rad = d => d * Math.PI / 180;
  const pt = (a, r) => [cx + r * Math.cos(rad(a)), cy + r * Math.sin(rad(a))];
  const axes = [[s.approval, -90], [s.richness, 30], [s.credibility, 150]];
  let g = "";
  for (const lv of [1/3, 2/3, 1]) {
    g += `<polygon points="${axes.map(([,a]) => pt(a, R*lv).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#cbd7e3" stroke-width="1"/>`;
  }
  const spokes = axes.map(([,a]) => { const [x,y]=pt(a,R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#cbd7e3"/>`; }).join("");
  const data = axes.map(([v,a]) => pt(a, R*Math.min(100,v)/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  const dots = axes.map(([v,a]) => { const [x,y]=pt(a,R*Math.min(100,v)/100); return `<rect x="${(x-2.4).toFixed(1)}" y="${(y-2.4).toFixed(1)}" width="4.8" height="4.8" fill="#2b6cb0"/>`; }).join("");
  return `<svg class="radar" viewBox="0 0 ${W} ${H}">${g}${spokes}
    <polygon points="${data}" fill="rgba(43,108,176,.12)" stroke="#2b6cb0" stroke-width="1.8" stroke-linejoin="miter"/>${dots}</svg>`;
}

document.getElementById("cards").innerHTML = items.map(it => `
  <article class="card">
    <div class="corner"></div>
    <div class="card-inner">
      <div class="card-title">${it.title}</div>
      <div class="meta"><span class="tag mono">${it.type}</span><span>${it.author}</span><span>${it.time}</span></div>
      <div class="summary">${it.summary}</div>
      <div class="main">
        <div class="legend">
          ${Object.entries(it.s).map(([k,v]) => `
            <div class="row"><span>${NAMES[k]}</span>
              <span class="bar"><i style="width:${v}%;background:${COLORS[k]}"></i></span>
              <span class="score mono">${v}</span></div>`).join("")}
        </div>
        ${radar(it.s)}
      </div>
    </div>
    <div class="titleblock mono">
      <div class="cell">NO. <b>${it.no}</b></div>
      <div class="cell">VAL <b>${it.combined}</b></div>
      <div class="cell">SRC 收藏463/赞同283</div>
    </div>
  </article>`).join("");
</script>
</body>
</html>
