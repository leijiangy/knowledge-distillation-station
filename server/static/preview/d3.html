<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向三 · 信噪比</title>
<style>
  /* 方向三 · 信噪比
     题材依据：收藏里混着噪声与信号；三指标就是信噪分离的结果。
     色板（刻意避开"近黑+单一亮色"）：石墨蓝底 #151a21 · 卡 #1c222b · 信号青 #4cc9f0
            · 信号紫 #b388ff · 信号绿 #6ee7b7 · 噪声灰 #3d4653
     字体：无衬线 + 等宽数据
     记忆点：每张卡片标题下的「波形」——前半段噪声，后半段信号 */
  :root {
    --bg: #151a21;
    --card: #1c222b;
    --line: #2a323d;
    --ink: #e3eaf3;
    --ink-2: #9fadbd;
    --ink-3: #66757f;
    --cyan: #4cc9f0;
    --violet: #b388ff;
    --green: #6ee7b7;
    --noise: #3d4653;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink); line-height: 1.65; padding-bottom: 64px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  .topbar { max-width: 1060px; margin: 0 auto; padding: 22px 20px 4px; display: flex; align-items: center; gap: 10px; }
  .brand-name { font-size: 17px; font-weight: 800; }
  .brand-code { color: var(--cyan); font-size: 11px; letter-spacing: 2.5px; margin-left: 4px; }

  .hero { max-width: 1060px; margin: 0 auto; padding: 28px 20px 6px; }
  .hero h1 { font-size: 36px; font-weight: 800; letter-spacing: -.5px; line-height: 1.4; }
  .hero h1 b { color: var(--cyan); font-weight: 800; }
  .hero p { color: var(--ink-2); margin-top: 12px; max-width: 560px; font-size: 15px; }

  .toolbar {
    max-width: 1060px; margin: 22px auto 0; padding: 0 20px 12px;
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .toolbar h2 { font-size: 18px; }
  .count { color: var(--cyan); font-size: 12.5px; margin-left: 8px; }
  .sort { color: var(--ink-3); font-size: 12.5px; border: 1px solid var(--line); padding: 4px 10px; border-radius: 6px; }

  .cards { max-width: 1060px; margin: 22px auto 0; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px 14px; position: relative; overflow: hidden;
  }
  .card-title { font-size: 16.5px; font-weight: 750; line-height: 1.55; }
  .wave { display: block; width: 100%; height: 24px; margin: 10px 0 2px; }
  .meta { color: var(--ink-3); font-size: 12px; margin: 6px 0 10px; display: flex; gap: 10px; }
  .tag { border: 1px solid var(--line); color: var(--cyan); padding: 0 7px; border-radius: 4px; }
  .summary { color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .main { display: flex; gap: 18px; align-items: center; margin-top: 14px; }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .bar { flex: 1; height: 5px; background: #232b36; border-radius: 99px; overflow: hidden; }
  .legend .bar i { display: block; height: 100%; border-radius: 99px; }
  .legend .score { color: var(--ink); font-weight: 700; min-width: 26px; text-align: right; }
  .radar { width: 96px; flex: 0 0 96px; }

  .foot { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 8px; color: var(--ink-3); font-size: 11.5px; }
</style>
</head>
<body>
  <div class="topbar"><span>🧪</span><span class="brand-name">知识蒸馏站</span><span class="brand-code mono">SNR / DISTILL</span></div>
  <div class="hero">
    <h1>你的收藏夹，<br>不该<b>只是</b>收藏。</h1>
    <p>收藏里混着噪声与信号。这里逐条分离出认可度、信息量、准确性，让真正值得学的那一篇显形。</p>
  </div>
  <div class="toolbar">
    <div><h2>我的收藏 <span class="count mono">49 条</span></h2></div>
    <div class="sort">排序：收藏时间（新→旧）</div>
  </div>
  <div class="cards" id="cards"></div>

<script>
const items = [
  { type: "文章", author: "某研究者", time: "11 天前收藏", snr: "高信噪",
    title: "从贝叶斯视角理解反向传播：为什么深度学习需要概率论",
    summary: "很多人把反向传播当作纯粹的链式法则练习，但如果从贝叶斯的角度看，整个训练过程其实是在做后验推断……",
    s: { approval: 78, richness: 81, credibility: 55 } },
  { type: "回答", author: "费曼手记", time: "16 天前收藏", snr: "中强信号",
    title: "费曼学习法的真正难点：如何暴露自己的知识盲区",
    summary: "讲给别人听只是形式，真正难的是找到自己「以为懂了」的地方。这篇文章给了一个可操作的自检流程……",
    s: { approval: 39, richness: 83, credibility: 65 } },
];
const COLORS = { approval: "#4cc9f0", richness: "#b388ff", credibility: "#6ee7b7" };
const NAMES = { approval: "认可度", richness: "信息量", credibility: "准确性" };

function waveform() {
  // 前半段噪声（伪随机、无规律），后半段信号（规则正弦）
  const pts = [];
  for (let x = 0; x <= 220; x += 4) {
    let v;
    if (x < 110) {
      const n = Math.sin(x * 12.9898) * 43758.5453;
      v = (n - Math.floor(n) - 0.5) * 14;   // 确定性伪随机噪声
    } else {
      v = Math.sin((x - 110) / 8) * 6;       // 干净正弦信号
    }
    pts.push(`${x},${(13 - v).toFixed(1)}`);
  }
  const mid = `<line x1="110" y1="2" x2="110" y2="24" stroke="#2a323d" stroke-width="1" stroke-dasharray="2 3"/>`;
  return `<svg class="wave" viewBox="0 0 220 26" preserveAspectRatio="none">
    ${mid}
    <polyline points="${pts.join(" ")}" fill="none" stroke="#4cc9f0" stroke-width="1.4" opacity=".9"/>
  </svg>`;
}

function radar(s) {
  const W = 96, H = 88, cx = 48, cy = 52, R = 41;
  const rad = d => d * Math.PI / 180;
  const pt = (a, r) => [cx + r * Math.cos(rad(a)), cy + r * Math.sin(rad(a))];
  const axes = [[s.approval, -90], [s.richness, 30], [s.credibility, 150]];
  let g = "";
  for (const lv of [1/3, 2/3, 1]) {
    g += `<polygon points="${axes.map(([,a]) => pt(a, R*lv).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#2a323d" stroke-width="1"/>`;
  }
  const spokes = axes.map(([,a]) => { const [x,y]=pt(a,R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a323d"/>`; }).join("");
  const data = axes.map(([v,a]) => pt(a, R*Math.min(100,v)/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  const dots = axes.map(([v,a]) => { const [x,y]=pt(a,R*Math.min(100,v)/100); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#151a21" stroke="#4cc9f0" stroke-width="1.8"/>`; }).join("");
  return `<svg class="radar" viewBox="0 0 ${W} ${H}">${g}${spokes}
    <polygon points="${data}" fill="rgba(76,201,240,.12)" stroke="#4cc9f0" stroke-width="1.8" stroke-linejoin="round"/>${dots}</svg>`;
}

document.getElementById("cards").innerHTML = items.map(it => `
  <article class="card">
    <div class="card-title">${it.title}</div>
    ${waveform()}
    <div class="meta"><span class="tag mono">${it.type}</span><span>${it.author}</span><span>${it.time}</span></div>
    <div class="summary">${it.summary}</div>
    <div class="main">
      <div class="legend">
        ${Object.entries(it.s).map(([k,v]) => `
          <div class="row"><span>${NAMES[k]}</span>
            <span class="bar"><i style="width:${v}%;background:${COLORS[k]}"></i></span>
            <span class="score mono">${v}</span></div>`).join("")}
      </div>
      ${radar(it.s)}
    </div>
    <div class="foot mono">SIGNAL · ${it.snr} · 收藏463/赞同283/评论21</div>
  </article>`).join("");
</script>
</body>
</html>
