<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复习视图 · 排版示例（不接后端）</title>
<!-- 复用正式的 style.css：侧边栏 / 工具栏 / 配色 / 纸张都是线上那套 -->
<link rel="stylesheet" href="/style.css">
<style>
  /* ============ 本示例自己的样式（正式实现时可挪进 style.css） ============ */
  /* 分段切换：继续读 / 复习。沿用 .rd-tab.active 的填充绿，不引入新视觉语言 */
  .lv-tabs {
    display: inline-flex; gap: 3px; padding: 3px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(47,122,61,.05);
  }
  .lv-tab {
    border: 0; background: none; cursor: pointer; font: inherit;
    font-size: 13px; color: var(--ink-2); padding: 5px 16px; border-radius: 999px;
    transition: background-color .18s ease, color .18s ease;
  }
  .lv-tab:hover { color: var(--green); }
  .lv-tab.active { background: var(--green); color: #f6fbf3; font-weight: 700; }
  .lv-tab .lv-tab-n { font-size: 11.5px; font-weight: 400; opacity: .8; margin-left: 5px; }

  /* 队列：单列 + 限行长（排版原则：行长 < 80 字符 / 中文约 35-40 字） */
  .lv-list { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
  .lv-row {
    display: flex; align-items: flex-start; gap: 16px;
    border: 1px solid var(--line-card); border-radius: 8px;
    background: rgba(255,255,255,.6); padding: 14px 16px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .lv-row:hover { border-color: #bbcdb3; box-shadow: 0 6px 20px -14px rgba(30,60,28,.2); }
  .lv-row-main { flex: 1 1 auto; min-width: 0; }
  .lv-row-title {
    font-size: 15px; font-weight: 650; line-height: 1.5; color: var(--ink);
    text-decoration: none; display: block; cursor: pointer;
  }
  .lv-row-title:hover { color: var(--green); }
  /* 一行摘要：这一篇"还剩什么没消化"。数字在前、单位在后，用 tabular-nums 对齐 */
  .lv-meta {
    color: var(--ink-3); font-size: 12px; margin-top: 6px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-variant-numeric: tabular-nums;
  }
  .lv-meta b { color: var(--ink-2); font-weight: 700; }
  .lv-meta .lv-done { color: var(--green); font-weight: 700; }
  /* 复习卡里"要看的那两点"预览 */
  .lv-peek { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .lv-peek div {
    font-size: 13px; color: var(--ink-2); line-height: 1.7;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 前缀用真元素而不是 ::before：伪元素会被读屏当成孤立文本念出来（"问 标 标 问 标"） */
  .lv-peek .lv-kind { font-weight: 700; margin-right: 5px; }
  .lv-peek .q .lv-kind { color: var(--gold); }
  .lv-peek .m .lv-kind { color: var(--green); }
  .lv-peek .more { color: var(--ink-3); font-size: 12px; }
  .lv-row-actions { flex: 0 0 auto; display: flex; align-items: center; padding-top: 2px; }

  /* 空状态：一句话 + 一个动作（设计原则：失败/空状态是引导时刻） */
  .lv-empty { text-align: center; padding: 56px 20px 64px; max-width: 520px; margin: 0 auto; }
  .lv-empty h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .lv-empty p { color: var(--ink-2); font-size: 13.5px; margin-bottom: 18px; }

  /* ============ 复习进行中：直接复用精读页的两栏结构 ============ */
  .lv-session-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px; max-width: 900px;
  }
  .lv-session-head h2 { font-size: 17px; font-weight: 650; flex: 1 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lv-body {
    display: grid; grid-template-columns: .85fr 1.15fr; column-gap: 16px;
    background-color: var(--paper); background-image: var(--noise);
    border: 1px solid var(--line-card); border-radius: 8px;
    box-shadow: 0 2px 5px rgba(30,40,28,.035);
    padding: 18px 20px; max-width: 900px;
  }
  .lv-pane-label { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; }
  .lv-text {
    font-size: 16px; line-height: 1.95; color: var(--ink);
    padding: 18px 20px; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(255,255,255,.6);
  }
  /* 标记语言与精读页一致：实线 = 共享解释，虚线 = 我的提问 */
  .mk { cursor: pointer; }
  .mk-shared { border-bottom: 2px solid var(--green); background: rgba(47,122,61,.06); }
  .mk-private { border-bottom: 2px dashed var(--gold); background: rgba(183,134,40,.05); }

  .lv-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .lv-kept {
    border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px;
    background: rgba(47,122,61,.055);
  }
  .lv-kept h4 { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 10px; }
  .lv-kept-q { font-size: 14.5px; font-weight: 700; line-height: 1.7; margin-bottom: 8px; }
  .lv-kept-a { font-size: 13.5px; line-height: 1.8; color: var(--ink-2); }
  .lv-recall {
    border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px;
    background: rgba(255,255,255,.6);
  }
  .lv-input-row { display: flex; gap: 8px; align-items: center; }
  .lv-input-row input {
    flex: 1 1 auto; min-width: 0; font: inherit; font-size: 13.5px;
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; color: var(--ink);
  }
  .lv-input-row input:focus { outline: none; border-color: var(--green); }
  .lv-nav { display: flex; align-items: center; gap: 10px; margin-top: 14px; max-width: 900px; }
  .lv-nav .spacer { flex: 1 1 auto; }

  /* ============ 示例工具条（不属于正式界面） ============ */
  .pv-bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    z-index: 60; display: flex; align-items: center; gap: 10px;
    padding: 7px 9px 7px 15px; border-radius: 999px;
    background: rgba(253,252,248,.96); border: 1px solid var(--line-card);
    box-shadow: 0 6px 24px -14px rgba(30,40,28,.4);
    font-size: 12px; color: var(--ink-3);
  }
  .pv-bar button {
    font: inherit; font-size: 12px; cursor: pointer; padding: 4px 12px;
    border: 1px solid var(--line); border-radius: 999px;
    background: none; color: var(--ink-2);
  }
  .pv-bar button.active { background: var(--green); border-color: var(--green); color: #f6fbf3; font-weight: 700; }
</style>
</head>
<body class="reading">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="page" id="page">
    <!-- 侧边栏：直接照搬线上那份；学习记录 不再是一个下拉，而是一个入口 -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15"><polygon points="12,4.5 19.5,16.5 4.5,16.5" fill="none" stroke="#f6fbf3" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="4.5" r="1.9" fill="#f6fbf3"/><circle cx="19.5" cy="16.5" r="1.9" fill="#f6fbf3"/><circle cx="4.5" cy="16.5" r="1.9" fill="#f6fbf3"/></svg>
          </span>
          知识蒸馏站
        </div>

        <nav class="nav-list">
          <button class="nav-item nav-parent">
            <span class="left">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 11 L12 4.5 L20 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5 V19.5 H18 V10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              首页
            </span>
          </button>
          <button class="nav-item nav-parent">
            <span class="left">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><polygon points="12,5 19,16 5,16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              我的收藏
            </span>
          </button>
          <button class="nav-item nav-parent">
            <span class="left">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.3 7.2 18.9l.9-5.4L4.2 9.7l5.4-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              智能推荐
            </span>
          </button>
          <!-- 原来这里是「学习记录 ▾ + 下拉列表」，现在它指向一个视图 -->
          <button class="nav-item nav-parent current">
            <span class="left">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="12,7.5 12,12 15,13.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              我的学习
            </span>
          </button>
        </nav>

        <div class="user-block">
          <span class="nav-avatar">李</span>
          <div class="user-meta">
            <b>李同学</b>
            <small>已登录知乎</small>
          </div>
        </div>
      </div>
    </aside>

    <main class="content">
      <!-- 工具栏：右侧是「继续读 / 复习」两件事，不再是两个顶级导航 -->
      <div class="toolbar">
        <div class="toolbar-left">
          <h2>我的学习 <span class="count" id="lv-count"></span></h2>
        </div>
        <div class="toolbar-right">
          <div class="lv-tabs" role="tablist">
            <button class="lv-tab active" id="lv-tab-resume" role="tab">继续读</button>
            <button class="lv-tab" id="lv-tab-review" role="tab">复习 <span class="lv-tab-n" id="lv-tab-review-n"></span></button>
          </div>
        </div>
      </div>

      <!-- ========== 面板一：继续读（就是现在的学习记录，只做"恢复位置"一件事） ========== -->
      <div id="lv-resume">
        <div class="lv-list" id="lv-resume-list"></div>
      </div>

      <!-- ========== 面板二：复习（默认有内容：它是从阅读数据派生出来的队列） ========== -->
      <div id="lv-review" hidden>
        <div class="lv-list" id="lv-review-list"></div>
      </div>

      <!-- ========== 面板三：真的开始复习（复用精读页的两栏） ========== -->
      <div id="lv-session" hidden>
        <div class="lv-session-head">
          <button class="rd-btn ghost" id="lv-back" style="padding:5px 14px;font-size:12.5px">← 回队列</button>
          <h2 id="lv-session-title"></h2>
          <span class="lv-meta" style="margin:0"><b id="lv-session-pos"></b></span>
        </div>
        <div class="lv-body">
          <div>
            <div class="lv-pane-label">原文（你标过的地方）</div>
            <div class="lv-text" id="lv-session-text"></div>
          </div>
          <div class="lv-side">
            <div class="lv-kept">
              <h4>你在这里问过</h4>
              <div class="lv-kept-q" id="lv-session-q"></div>
              <div class="lv-kept-a" id="lv-session-a"></div>
            </div>
            <div class="lv-recall">
              <h4>用一句话说说这段讲了什么</h4>
              <div class="lv-input-row">
                <input id="lv-recall" placeholder="自己想，写下来就存在你的记录里" autocomplete="off">
                <button class="rd-btn" id="lv-recall-save">记下来</button>
              </div>
            </div>
          </div>
        </div>
        <div class="lv-nav">
          <span class="lv-meta" id="lv-session-hint">这一篇还有 3 处没回看</span>
          <span class="spacer"></span>
          <button class="rd-btn ghost" id="lv-next">下一处 →</button>
        </div>
      </div>

      <!-- ========== 面板四：空状态（点右下角切换看） ========== -->
      <div id="lv-empty" hidden>
        <div class="lv-empty">
          <h3>还没有可以复习的内容</h3>
          <p>去精读一篇。你划出的每一处、问过的每一个问题，都会留在那里等你回来。</p>
          <button class="btn-primary">去我的收藏挑一篇</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 示例工具条：不属于正式界面，只用来对比两种状态 -->
  <div class="pv-bar">
    <span>排版示例 · 不接后端</span>
    <button id="pv-data" class="active">有数据</button>
    <button id="pv-empty">空状态</button>
  </div>

  <script src="/bg.js"></script>
  <script>
  (() => {
    "use strict";
    const $ = (id) => document.getElementById(id);

    // ---- 假数据：正式实现时这些全部来自 /api/reading/history + reading_nodes 聚合 ----
    // 排序口径：停得越久 + 没消化的东西越多，越靠前
    const articles = [
      {
        title: "深度学习中的注意力机制，到底在\u201c注意\u201d什么",
        seg: 3, total: 9, marks: 4, asks: 2, ago: "两天前",
        peek: [
          { k: "q", t: "为什么这里的权重一定要用 softmax？换成别的归一化会怎样" },
          { k: "m", t: "Query 与每个 Key 做点积得到相似度" },
        ],
      },
      {
        title: "信息论入门：熵、交叉熵与 KL 散度",
        seg: 6, total: 6, marks: 3, asks: 0, ago: "六天前",
        peek: [{ k: "m", t: "交叉熵不是\u201c距离\u201d，它不满足对称性" }],
      },
      {
        title: "从零理解 Transformer：为什么它取代了 RNN",
        seg: 7, total: 12, marks: 2, asks: 1, ago: "今天",
        peek: [{ k: "q", t: "多头注意力里每个头真的学到了不同的东西吗" }],
      },
      {
        title: "为什么梯度消失让 RNN 记不住长句子",
        seg: 1, total: 6, marks: 1, asks: 0, ago: "三小时前",
        peek: [{ k: "m", t: "梯度连乘导致指数级衰减" }],
      },
    ];

    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // 一篇要复习的东西 = 标记数 + 提问数；都是 0 的（读完且没留东西）不进复习队列
    const waiting = (a) => a.marks + a.asks;
    const reviewable = articles.filter((a) => waiting(a) > 0);

    function progressText(a) {
      return a.seg >= a.total ? "已读完" : "第 " + a.seg + "/" + a.total + " 段";
    }
    function waitingText(a) {
      const parts = [];
      if (a.marks) parts.push("<b>" + a.marks + "</b> 处标记");
      if (a.asks) parts.push("<b>" + a.asks + "</b> 个没弄懂的问题");
      if (!parts.length) parts.push("没有待回看的内容");
      return parts.join(" · ");
    }

    // ---- 继续读：一行只干一件事（回到上次的位置） ----
    function renderResume() {
      $("lv-resume-list").innerHTML = articles.map((a, i) =>
        '<div class="lv-row">'
        + '<div class="lv-row-main">'
        +   '<a class="lv-row-title" data-resume="' + i + '">' + esc(a.title) + "</a>"
        +   '<div class="lv-meta">'
        +     '<span class="' + (a.seg >= a.total ? "lv-done" : "") + '">' + progressText(a) + "</span>"
        +     "<span>" + waitingText(a) + "</span>"
        +     "<span>" + esc(a.ago) + "</span>"
        +   "</div>"
        + "</div>"
        + '<div class="lv-row-actions"><button class="btn-ghost btn-small" data-resume="' + i + '">'
        +   (a.seg >= a.total ? "重新看" : "接着读") + " →</button></div>"
        + "</div>"
      ).join("");
      $("lv-count").textContent = articles.length + " 篇";
    }

    // ---- 复习：同样是一行一篇，但说的是"还剩什么没消化" ----
    function renderReview() {
      $("lv-review-list").innerHTML = reviewable.map((a, i) =>
        '<div class="lv-row">'
        + '<div class="lv-row-main">'
        +   '<a class="lv-row-title">' + esc(a.title) + "</a>"
        +   '<div class="lv-meta">'
        +     "<span>" + waitingText(a) + "</span>"
        +     "<span>" + progressText(a) + "</span>"
        +     "<span>" + esc(a.ago) + "停在这</span>"
        +   "</div>"
        +   '<div class="lv-peek">'
        +     a.peek.map((p) =>
              '<div class="' + p.k + '"><span class="lv-kind" aria-hidden="true">'
              + (p.k === "q" ? "问" : "标") + "</span>" + esc(p.t) + "</div>").join("")
        +     (waiting(a) > a.peek.length
              ? '<div class="more">还有 ' + (waiting(a) - a.peek.length) + " 处</div>" : "")
        +   "</div>"
        + "</div>"
        + '<div class="lv-row-actions"><button class="btn-primary btn-small" data-start="' + i + '">开始复习</button></div>'
        + "</div>"
      ).join("");
      $("lv-tab-review-n").textContent = reviewable.length;
    }

    // ---- 复习进行中：左栏原文带标记，右栏是我自己留下的东西 ----
    const sample = {
      title: articles[0].title,
      pos: 3, total: 9, left: 3,
      html: "注意力机制的核心是把 "
        + '<span class="mk mk-shared" title="共享解释：全站可见">Query 与每个 Key 做点积得到相似度</span>'
        + "，再用 softmax 归一化成权重，最后对 Value 加权求和。这样做的直觉是："
        + '<span class="mk mk-private" title="我的提问：只有我能看见">输出是输入的加权组合</span>'
        + "，而权重由当前要查的 Query 决定。这也是它比 RNN 好并行的地方——每个位置都要和所有位置算一遍。",
      q: "为什么这里的权重一定要用 softmax？换成别的归一化会怎样？",
      a: "softmax 在这里的作用是把一组实数压成和为 1 的正权重，同时放大差距（指数项）。换成线性归一化也能满足\u201c和为 1\u201d，但梯度分布会平得多。这一点你当时没接着往下问——可以先自己想一分钟再看原文第 4 段。",
    };

    function startReview(i) {
      const a = reviewable[i] || sample;
      $("lv-session-title").textContent = sample.title;
      $("lv-session-pos").innerHTML = "<b>第 " + sample.pos + "/" + sample.total + " 段</b> · 这是第 1/" + sample.left + " 处";
      $("lv-session-text").innerHTML = sample.html;
      $("lv-session-q").textContent = sample.q;
      $("lv-session-a").textContent = sample.a;
      $("lv-session-hint").textContent = "这一篇还有 " + sample.left + " 处没回看";
      $("lv-resume").hidden = true;
      $("lv-review").hidden = true;
      $("lv-empty").hidden = true;
      $("lv-session").hidden = false;
      $("pv-data").blur();
    }

    function showTab(name) {
      $("lv-session").hidden = true;
      $("lv-empty").hidden = true;
      $("lv-resume").hidden = name !== "resume";
      $("lv-review").hidden = name !== "review";
      $("lv-tab-resume").classList.toggle("active", name === "resume");
      $("lv-tab-review").classList.toggle("active", name === "review");
    }

    $("lv-tab-resume").addEventListener("click", () => showTab("resume"));
    $("lv-tab-review").addEventListener("click", () => showTab("review"));
    $("lv-back").addEventListener("click", () => showTab("review"));
    $("lv-next").addEventListener("click", () => {
      const hint = $("lv-session-hint");
      hint.textContent = "这一处看完了（示例里没有下一处）";
      $("lv-recall").value = "";
    });
    $("lv-recall-save").addEventListener("click", () => {
      const v = $("lv-recall").value.trim();
      const hint = $("lv-session-hint");
      if (!v) { hint.textContent = "先写一句自己的话——这段讲的是什么"; return; }
      hint.textContent = "已记进你的学习记录（示例里不真的保存）";
      $("lv-recall").value = "";
    });
    $("lv-resume-list").addEventListener("click", (e) => {
      if (e.target.closest("[data-resume]")) location.href = "/reading.html";
    });
    $("lv-review-list").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-start]");
      if (btn) startReview(Number(btn.getAttribute("data-start")));
    });

    // 工具条：有数据 / 空状态
    $("pv-data").addEventListener("click", () => {
      $("pv-empty").classList.remove("active");
      $("pv-data").classList.add("active");
      renderResume();
      renderReview();
      showTab("resume");
    });
    $("pv-empty").addEventListener("click", () => {
      $("pv-data").classList.remove("active");
      $("pv-empty").classList.add("active");
      // 空的时候工具栏不该还挂着数字
      $("lv-count").textContent = "";
      $("lv-tab-review-n").textContent = "";
      $("lv-resume").hidden = true;
      $("lv-review").hidden = true;
      $("lv-session").hidden = true;
      $("lv-empty").hidden = false;
    });

    renderResume();
    renderReview();
  })();
  </script>
</body>
</html>
