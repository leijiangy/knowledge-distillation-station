<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>精读 · 知识蒸馏站</title>
  <script src="/bg.js?v=5"></script>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/style.css?v=14">
  <style>
    /* ===== 精读会话（设计见 docs/学习会话设计-定稿.md） ===== */
    body.reading { padding: 20px; }
    .reading .page { max-width: 1240px; }
    .reading .content { display: flex; padding: 16px var(--content-pad); }
    .rd { display: flex; flex-direction: column; width: 100%; }
    #rd-start { flex: 1; justify-content: center; min-height: 300px; }
    #rd-start-error { max-width: 520px; overflow-wrap: anywhere; }
    #rd-start-actions { flex-wrap: wrap; justify-content: center; }
    #rd-start-actions a { text-decoration: none; }
    .rd:has(#rd-start:not([hidden])) > .rd-head,
    .rd:has(#rd-start:not([hidden])) > .rd-author { display: none; }

    /* 顶栏 */
    .rd-head { display: flex; align-items: center; gap: 14px; margin: 0 2px 8px; }
    .rd-head > a { color: var(--green); text-decoration: none; font-size: 13px; white-space: nowrap; }
    .rd-title-link { flex: 1; min-width: 0; text-decoration: none; color: inherit; }
    .rd-head h1 { font-size: 32px; line-height: 1.25; font-weight: 700; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .rd-title-link:hover h1 { color: var(--green); }
    /* 更新文章：右上角（清空旧解析 → 去知乎页面用书签重新保存） */
    .rd-refresh-article {
      flex: 0 0 auto; border: 1px solid var(--line); background: transparent;
      color: var(--ink-3); border-radius: 8px; padding: 6px 12px;
      font-size: 12.5px; font-family: inherit; cursor: pointer; white-space: nowrap;
      transition: color .18s ease, border-color .18s ease, background .18s ease;
    }
    .rd-refresh-article:hover { color: var(--green); border-color: rgba(var(--green-rgb),.4); background: rgba(var(--green-rgb),.05); }
    .rd-refresh-article.confirm { color: #a33; border-color: rgba(170,51,51,.5); font-weight: 700; }
    /* 作者信息（标题下方：头像 + 昵称 + 认证徽章/称号；头像与昵称可点进主页） */
    .rd-author { display: flex; align-items: center; gap: 9px; white-space: nowrap;
      font-size: 19px; color: var(--ink-2); margin: 0 2px 12px; }
    .rd-author-link { display: flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; }
    .rd-author-link:hover #rd-author-name { color: var(--green); }
    .rd-author img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    .rd-author img.rd-author-badge { width: 22px; height: 22px; border-radius: 0; }
    .rd-author .rd-author-title { font-size: 17px; color: var(--gold); font-weight: 700; }
    /* 换段导航（卡片内第 3 行，横跨两栏居中）：← 上一段 | 段落控件（点开为段列表） | 我懂了 → */
    .rd-nav-row { grid-row: 3; grid-column: 1 / -1; display: flex; align-items: center;
      justify-content: center; gap: 14px; margin-top: 10px; }
    .rd-seg-picker { position: relative; }
    .rd-seg-btn {
      border: 1px solid var(--line); background: rgba(255,255,252,.9); color: var(--ink);
      border-radius: 999px; padding: 6px 16px; font-size: 12.5px; font-weight: 700;
      font-family: inherit; cursor: pointer; white-space: nowrap;
    }
    .rd-seg-btn:hover { border-color: var(--green); color: var(--green); }
    .rd-seg-menu {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      background: #fdfcf8; border: 1px solid var(--line-card); border-radius: 12px;
      padding: 10px; box-shadow: 0 12px 30px -14px rgba(30,40,28,.4); z-index: 6;
    }
    .rd-seg-item {
      width: 32px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
      background: transparent; color: var(--ink-2); font-family: inherit; font-size: 12.5px; cursor: pointer;
    }
    .rd-seg-item:hover { border-color: var(--green); color: var(--green); }
    .rd-seg-item.active { background: var(--green); color: #f6fbf3; border-color: var(--green); font-weight: 700; }

    /* 标签栏（层级）：卡片内顶部，横跨两栏 */
    .rd-tabs { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .rd-tab {
      border: 1px solid var(--line); background: rgba(255,255,252,.8); color: var(--ink-2);
      border-radius: 999px; padding: 4px 12px; font-size: 12.5px;
      max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: inherit;
    }
    .rd-tab.active { background: var(--green); color: #f6fbf3; border-color: var(--green); font-weight: 700; }
    .rd-tab-more {
      border: 1px dashed var(--line-card); border-radius: 999px; padding: 4px 10px;
      color: var(--ink-3); font-size: 12.5px; letter-spacing: 3px; line-height: 1.2;
    }

    /* 主体：两栏（左 = 当前层的父文本，右 = 这一层的内容） */
    .rd-body {
      display: grid; grid-template-columns: .85fr 1.15fr; column-gap: 16px;
      background-color: var(--paper); background-image: var(--noise);
      border: 1px solid var(--line-card); border-radius: 8px;
      box-shadow: 0 1px 2px rgba(30,40,28,.07), 0 14px 34px -18px rgba(30,40,28,.28);
      padding: 18px 20px;
      transition: grid-template-columns .32s ease;
    }
    .rd-pane { min-width: 0; min-height: 0; transition: opacity .3s ease; }
    .rd-pane:not(.rd-side) { display: flex; flex-direction: column; }
    .rd-pane-label { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; }
    /* 会话卡片内的栏目标签不显示：层级信息由顶部标签栏承担，避免"本段解释/上一层的文本"重复出现 */
    #rd-body-main .rd-pane-label { display: none; }
    .rd-text {
      font-size: 15px; line-height: 2.05; color: var(--ink); white-space: pre-wrap;
      flex: 1 1 0; min-height: 320px; overflow-y: auto; padding: 4px 6px 10px;
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.6);
      user-select: text; overflow-anchor: none;   /* 关闭滚动锚定：重渲染时滚动位置由代码控制 */
    }
    /* 内联配图：按抓取时记录的位置插回正文（图片不占原文的字符，是零长原子） */
    .kd-img { display: block; margin: 10px 0; }
    .kd-img img {
      display: block; max-width: 100%; height: auto; cursor: pointer;
      border: 1px solid var(--line); border-radius: 8px;
    }
    .kd-img:hover img { border-color: var(--green); }
    .kd-img.active img { border-color: var(--green); box-shadow: 0 0 0 2px rgba(var(--green-rgb),.18); }
    .kd-img.busy img { opacity: .6; }
    /* 配图被包在标记里时，外层下划线会横贯整行（图片是块级）——去掉它，用底色表示标记 */
    .mk-shared:has(.kd-img), .mk-private:has(.kd-img) { border-bottom: 0; }

    /* 位置缺失的配图（早期保存的文章）退回这里 */
    .rd-figs {
      flex: 0 0 auto; margin-top: 10px; padding: 8px 9px 9px;
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.6);
      max-height: 30%; overflow-y: auto;
    }
    .rd-figs-head { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 7px; }
    .rd-figs-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .rd-fig {
      width: 76px; height: 76px; padding: 0; display: block; cursor: pointer;
      border: 1px solid var(--line); border-radius: 6px; background: none; overflow: hidden;
    }
    .rd-fig img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rd-fig:hover { border-color: var(--green); }
    .rd-fig.active { border-color: var(--green); box-shadow: 0 0 0 2px rgba(var(--green-rgb),.18); }
    .rd-fig.busy { opacity: .55; }

    .rd-explain {
      font-size: 14px; line-height: 1.95; color: var(--ink); white-space: pre-wrap;
      border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
      background: rgba(var(--green-rgb),.16); min-height: 120px; overflow-y: auto; overflow-anchor: none;
      display: flex; flex-direction: column; height: 100%;
      flex: 1 1 100%; min-width: 0;
      transition: flex-basis .3s ease, opacity .3s ease, transform .3s ease,
                  padding .3s ease, border-width .3s ease;
    }
    #rd-explain-body { flex: 1 1 auto; min-height: 0; }
    .rd-explain .rd-explain-actions { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; gap: 8px; }
    .rd-explain .rd-explain-actions { flex-wrap: wrap; align-items: center; }
    .rd-advanced-button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12.5px; }
    .rd-advanced-button small { font-size: 10px; opacity: .7; }
    .rd-advanced-status { width: 100%; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .rd-answer-body a { color: var(--green); text-decoration-thickness: 1px; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .rd-advanced-button[aria-busy="true"]::before { content: ""; width: 11px; height: 11px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rd-advanced-spin .8s linear infinite; }
    @keyframes rd-advanced-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .rd-advanced-button[aria-busy="true"]::before { animation: none; } }

    /* 会话卡片：高度跟随视口，解释/回答吃掉剩余空间（对话与提问栏在下方纵向排布） */
    /* 会话卡片：高度跟随视口；第 1 行层级标签、第 3 行换段导航 */
    #rd-body-main { height: calc(100vh - 165px); min-height: 480px;
      grid-template-rows: auto minmax(0, 1fr) auto; }
    #rd-body-main > .rd-pane { grid-row: 2; }
    @media (max-width: 900px) {
      .rd-body { grid-template-columns: minmax(0, 1fr); row-gap: 16px; }
      #rd-body-main { height: auto; grid-template-rows: auto; }
      #rd-body-main > .rd-pane, .rd-nav-row { grid-row: auto; }
      .rd-nav-row { flex-wrap: wrap; gap: 8px; }
      .rd-nav-row .rd-btn { padding-inline: 12px; white-space: nowrap; }
    }
    .rd-main { display: flex; align-items: stretch; min-width: 0; flex: 1 1 auto; min-height: 200px; }
    .rd-pair { flex: 1 1 100%; display: flex; align-items: stretch; min-width: 0; }
    .rd-answer {
      flex: 0 0 0; width: 0; opacity: 0; overflow: hidden;
      display: flex; flex-direction: column;
      border: 1px solid transparent; border-radius: 8px;
      transition: flex-basis .3s ease, width .3s ease, opacity .3s ease, margin .3s ease;
      height: 100%; position: relative; z-index: 1;
    }
    /* 回答出现：本层内容（解释）淡出收拢，回答占满右栏 */
    .rd-side.covered .rd-explain {
      flex: 0 1 0; min-width: 0; max-width: 0; padding: 0; border-width: 0;
      opacity: 0; transform: translateX(-10px); pointer-events: none;
    }
    .rd-side.covered .rd-answer {
      flex: 1 1 100%; width: auto; opacity: 1;
      border-color: var(--line); background: rgba(255,255,255,.6);
    }
    .rd-answer-head { display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px 0; }
    .rd-answer-q { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--ink);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rd-answer-close { border: 0; background: none; color: var(--ink-3); font-size: 18px; line-height: 1;
      cursor: pointer; font-family: inherit; padding: 0 2px; }
    .rd-answer-close:hover { color: var(--ink); }
    .rd-answer-body { flex: 1; overflow-y: auto; padding: 8px 14px 14px;
      font-size: 14px; line-height: 1.95; color: var(--ink); white-space: pre-wrap; }
    /* 本人标记：选区解释=实线，提问锚点=虚线；草稿=浏览器选中色 */
    .mk { cursor: pointer; }
    .mk-shared { border-bottom: 2px solid var(--green); background: rgba(var(--green-rgb),.06); }
    .mk-private { border-bottom: 2px dashed var(--gold); background: rgba(183,134,40,.05); }
    .mk-active { background: rgba(var(--green-rgb),.16); }
    .mk-draft { background: rgba(var(--green-rgb),.22); }

    /* 公式（KaTeX 渲染）：独立成行的公式由 KaTeX 的 .katex-display 居中 */
    .kd-math-block .katex-display { margin: .45em 0; }
    /* 行内公式被标记：下划线贴着公式（行内 .katex 是行内元素） */
    .mk-shared .kd-math:not(.kd-math-block) .katex { border-bottom: 2px solid var(--green); }
    .mk-private .kd-math:not(.kd-math-block) .katex { border-bottom: 2px dashed var(--gold); }
    /* 独立成行的公式被标记：display 模式下 .katex 是块级，下划线会横贯整行，
       所以改成整行浅底纹——读起来是「这一块被标了」而不是一条分隔线 */
    .mk-shared:has(.kd-math-block) { border-bottom: 0; background: rgba(var(--green-rgb),.09); }
    .mk-private:has(.kd-math-block) { border-bottom: 0; background: rgba(183,134,40,.08); }

    /* 右栏：这一层的内容（解释或回答）+ 提问栏 */
    .rd-pane { min-width: 0; }
    .rd-side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .rd-ask-area { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .rd-input-row { display: flex; gap: 8px; align-items: center; }
    .rd-input-row input {
      flex: 1; min-width: 0; padding: 10px 13px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--line); border-radius: 9px; background: #fff;
    }
    .rd-input-row .rd-btn { white-space: nowrap; }
    .rd-input-row .rd-hint { margin: 0; white-space: nowrap; }
    .rd-hint { font-size: 12px; color: var(--ink-3); margin-top: -4px; }
    .rd-nav { display: flex; gap: 10px; align-items: center; }
    .rd-btn {
      background: var(--green); color: #f6fbf3; border: none; cursor: pointer;
      padding: 10px 22px; font-size: 14px; font-weight: 700; border-radius: 9px; font-family: inherit;
    }
    .rd-btn:hover { background: var(--green-dark); }
    .rd-btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
    .rd-btn.ghost:hover { color: var(--green); border-color: #c6d2bf; }
    .rd-btn:disabled { opacity: .45; cursor: default; }
    .rd-error { color: #a33; font-size: 13px; white-space: pre-wrap; }
    .rd-error:empty { display: none; }   /* 无错误时不占位（保证输入框与左栏底边对齐） */
    .rd-done { text-align: center; padding: 40px 20px; }
    .rd-done h2 { font-size: 20px; margin-bottom: 14px; }

    /* ---- 读完后的岔路口：先选去哪儿，而不是逐个阶段进去再跳过 ---- */
    .rd-fork { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
    .rd-fork .rd-btn { text-decoration: none; }

    /* ---- 自测 ---- */
    .rd-quiz { max-width: 720px; margin: 0 auto; }
    .rd-quiz-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .rd-quiz-progress { flex: 1 1 auto; height: 5px; border-radius: 999px; background: rgba(var(--green-rgb),.12); overflow: hidden; }
    .rd-quiz-progress i { display: block; height: 100%; background: var(--green); transition: width .3s ease; }
    .rd-quiz-count { font-size: 12px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .rd-quiz-card {
      background-color: var(--paper); background-image: var(--noise);
      border: 1px solid var(--line-card); border-radius: 8px;
      box-shadow: 0 2px 5px rgba(30,40,28,.035); padding: 22px 24px;
    }
    .rd-quiz-summary {
      font-size: 14.5px; line-height: 1.9; color: var(--ink-2);
      border-left: 2px solid rgba(var(--green-rgb),.35); padding-left: 14px; margin-bottom: 20px;
    }
    .rd-quiz-tags { display: flex; gap: 8px; margin-bottom: 12px; }
    .rd-quiz-tag {
      font-size: 11.5px; color: var(--green); border: 1px solid var(--line);
      border-radius: 5px; padding: 1px 8px; background: rgba(var(--green-rgb),.06);
    }
    .rd-quiz-tag.kind { color: var(--gold); background: rgba(183,134,40,.07); }
    .rd-quiz-stem { font-size: 16.5px; line-height: 1.85; color: var(--ink); margin-bottom: 18px; }
    .rd-quiz-opts { display: flex; flex-direction: column; gap: 9px; }
    .rd-quiz-opt {
      text-align: left; font: inherit; font-size: 14.5px; line-height: 1.7;
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.6);
      color: var(--ink); padding: 12px 15px; cursor: pointer;
      transition: border-color .18s ease, background-color .18s ease;
    }
    .rd-quiz-opt:hover:not(:disabled) { border-color: #c6d2bf; background: rgba(var(--green-rgb),.05); }
    .rd-quiz-opt:disabled { cursor: default; }
    /* 判定结果只用两个字表达，不引入新配色以外的语言 */
    .rd-quiz-opt.right { border-color: rgba(var(--green-rgb),.55); background: rgba(var(--green-rgb),.10); font-weight: 600; }
    .rd-quiz-opt.wrong { border-color: rgba(163,51,51,.5); background: rgba(163,51,51,.07); }
    .rd-quiz-opt .pick { color: var(--ink-3); margin-right: 8px; font-variant-numeric: tabular-nums; }
    .rd-quiz-verdict { margin-top: 16px; font-size: 14px; font-weight: 700; }
    .rd-quiz-verdict.right { color: var(--green); }
    .rd-quiz-verdict.wrong { color: #a33; }
    .rd-quiz-explain {
      margin-top: 10px; font-size: 14px; line-height: 1.9; color: var(--ink);
      background: rgba(var(--green-rgb),.055); border: 1px solid var(--line);
      border-radius: 8px; padding: 14px 16px; white-space: pre-wrap;
    }
    .rd-quiz-foot { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
    .rd-quiz-foot .spacer { flex: 1 1 auto; }
    .rd-quiz-end { text-align: center; padding: 34px 20px; }
    .rd-quiz-end h2 { font-size: 19px; margin-bottom: 12px; }
    .rd-quiz-end .rd-fork { margin-top: 18px; }

    /* ---- 复习：一段概括性文字，没有其他控件 ---- */
    .rd-review { max-width: 720px; margin: 0 auto; }
    .rd-review-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .rd-review-card {
      background-color: var(--paper); background-image: var(--noise);
      border: 1px solid var(--line-card); border-radius: 8px;
      box-shadow: 0 2px 5px rgba(30,40,28,.035); padding: 24px 26px;
    }
    .rd-review-label {
      font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 12px;
    }
    .rd-review-text {
      font-size: 15.5px; line-height: 2; color: var(--ink); white-space: pre-wrap;
    }
    .rd-review-wait { font-size: 14px; color: var(--ink-2); line-height: 1.9; }
    @media (max-width: 900px) {
      #rd-body-main .rd-pane-label { display: block; }
      .rd-pair { display: block; }
      .rd-explain { height: auto; }
      .rd-answer { display: none; width: 100%; height: auto; }
      .rd-side.covered .rd-explain { display: none; }
      .rd-side.covered .rd-answer { display: flex; min-height: 160px; }
      .rd-text { flex: 0 1 auto; min-height: 160px; max-height: 60svh; }
      .rd-figs { max-height: 180px; }
      .rd-seg-menu { max-height: 45svh; overflow-y: auto; }
      .rd-seg-item { width: 44px; height: 44px; }
      .rd-answer-close { min-width: 44px; min-height: 44px; }
      .rd-author { white-space: normal; flex-wrap: wrap; font-size: 14px; }
      .rd-author-link { min-width: 0; max-width: 100%; }
      #rd-author-name { overflow-wrap: anywhere; }
      .rd-author .rd-author-title { font-size: 12px; }
      .rd-text, .rd-explain, .rd-answer-body, .rd-quiz-opt, .rd-quiz-stem, .rd-review-text { overflow-wrap: anywhere; }
      .kd-math-block { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
    }
    @media (max-width: 720px) {
      body.reading { padding: 12px 8px calc(90px + env(safe-area-inset-bottom)); }
      .reading .content { padding: 16px 12px 24px; }
      .rd-head { gap: 10px; align-items: flex-start; margin-bottom: 14px; }
      .rd-head h1 { font-size: 22px; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; }
      .rd-refresh-article { min-height: 44px; padding: 8px; font-size: 12px; }
      .rd-body { padding: 12px; }
      .rd-text { padding: 10px; }
      .rd-explain { padding: 12px; font-size: 15px; }
      .rd-input-row input { font-size: 16px; min-height: 44px; padding-inline: 10px; }
      .rd-btn, .rd-seg-btn, .rd-tab { min-height: 44px; }
