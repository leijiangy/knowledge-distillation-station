  <script src="/tutorial.js?v=2"></script>
  <script>
    (() => {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const state = {
        url: "", article: null, seg: null,
        marks: [],        // 当前展示文本上的本人标记（explain / ask 锚点）
        segNodes: [],     // 本段当前账号可见节点（本人 init/explain/ask）
        tabs: [],         // 层级标签：[{nodeId, label, text, marks, explain, isRoot}]
        rootMarks: [],    // 本段的标记（回到根层时用）
        prefetch: {},     // 预加载：segIndex -> 段数据
        draft: null,      // 自绘划选草稿 {start, end}
        answerNodeId: null,   // 正在回答卡片里展示的提问节点（对话区去重用）
      };


      let readingTutorialStarted = false;
      if (window.KDTutorial) {
        window.KDTutorial.register({
          id: "reading-basics",
          version: 1,
          steps: [
            {
              target: ".rd-head",
              title: "一篇文章会被拆成小段",
              description: "你一次只需要读懂当前这一段。标题可以点回知乎原文，右上角还能在内容抓错时重新保存。",
            },
            {
              target: "#rd-text",
              title: "左边是本段原文",
              description: "先读原文。遇到不理解的句子，可以直接在文字上划选，系统会围绕选中的内容补充解释。",
            },
            {
              target: "#rd-explain",
              title: "右边先补背景和推理",
              description: "这里会补齐文章默认你已经知道的知识，并把作者跳过的推理步骤展开。",
            },
            {
              target: "#rd-question",
              title: "哪里没懂，就继续追问",
              description: "你可以直接输入问题，也可以先划选原文再提问。回答和标记都会保存在这篇文章里。",
            },
            {
              target: ".rd-nav-row",
              title: "读懂后进入下一段",
              description: "点击“我懂了”继续，或点中间的段落进度自由跳转。完成后可以从学习记录随时回来复习。",
            },
          ],
        });
      }
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      async function api(path, options) {
        const resp = await fetch(path, options);
        const data = await resp.json().catch(() => ({}));
        if (!data || data.ok === false) {
          const msg = (data && data.error && data.error.message) || ("请求失败（HTTP " + resp.status + "）");
          const err = new Error(msg); err.code = data && data.error && data.error.code;
          throw err;
        }
        return data;
      }

      // ---------- 选区：容器内字符偏移（原生选择优先，自绘草稿兜底） ----------
      // 偏移一律是「原文串下标」；公式已渲染成 HTML，长度换算交给 KDM.sourceOffset
      function selectionOffsets(container) {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0);
          if (container.contains(range.startContainer) && container.contains(range.endContainer)) {
            const rects = range.getClientRects();
            const startX = rects.length ? rects[0].left : null;
            const endX = rects.length ? rects[rects.length - 1].right : null;
            const start = KDM.sourceOffset(container, range.startContainer, range.startOffset, startX);
            const end = KDM.sourceOffset(container, range.endContainer, range.endOffset, endX);
            if (start != null && end != null && end > start) return { start, end };
          }
        }
        // 兜底：自绘草稿选区（宿主屏蔽原生文本选择时，如 ZCode 内置浏览器面板）
        if (state.draft && state.draft.scope !== "explain"
            && state.draft.start < state.draft.end) {
          return { start: state.draft.start, end: state.draft.end };
        }
        return null;
      }

      // 自绘划选：只依赖鼠标事件（mousedown/mousemove/mouseup），不依赖浏览器原生选择
      let dragging = false;

      function caretOffset(container, x, y) {
        let range = null;
        if (document.caretRangeFromPoint) {
          range = document.caretRangeFromPoint(x, y);
        } else if (document.caretPositionFromPoint) {
          const pos = document.caretPositionFromPoint(x, y);
          if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); range.collapse(true); }
        }
        if (!range) return null;
        // 公式是原子的：光标落在公式内，按左右半段吸附到公式的起点或终点
        return KDM.sourceOffset(container, range.startContainer, range.startOffset, x);
      }

      // 把区间裁剪为「包含锚点、且未被已有标记覆盖」的最大连续区间（避开标记，避免重叠被拒）
      function freeRange(range, marks, pos) {
        let a = range.start;
        let b = range.end;
        for (const m of marks) {
          if (m.end <= pos) a = Math.max(a, m.end);
          else if (m.start >= pos) b = Math.min(b, m.start);
          else return null;               // 锚点落在既有标记内部：不产生选区
        }
        return a < b ? { start: a, end: b } : null;
      }

      // 单击：选中"该位置所在的整句"（宿主拦截按住拖动时的主交互方式）
      function sentenceRangeAt(text, pos) {
        const isBound = (ch) => "。！？；!?;\n".includes(ch);
        let start = Math.max(0, Math.min(pos, Math.max(0, text.length - 1)));
        let end = start;
        while (start > 0 && !isBound(text[start - 1])) start--;
        while (end < text.length && !isBound(text[end])) end++;
        if (end < text.length) end++;     // 含句末标点
        return { start, end };
      }

      let moved = false;

      function setupSelection() {
        const bind = (el, scope) => {
          if (!el) return;
          el.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null) return;
            dragging = true;
            moved = false;
            state.draft = { start: off, end: off, scope };
          });
          el.addEventListener("mousemove", (e) => {
            if (!dragging || !state.draft) return;
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null || off === state.draft.end) return;
            if (Math.abs(off - state.draft.start) <= 2 && !moved) {
              state.draft.end = off;      // 微抖：只记位置，不重建 DOM（保证随后 click 能派发）
              return;
            }
            moved = true;
            state.draft.end = off;
            renderActiveTab();
          });
          el.addEventListener("click", (e) => {
            if (moved) {
              moved = false;
              const d = state.draft;
              if (d && Math.abs(d.end - d.start) > 2) return;          // 真实拖动：保留拖动结果
            }
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null) return;
            const tab = state.tabs[state.tabs.length - 1];
            if (!tab) return;
            // 右栏标记 = 锚在本层内容上的子解释；左栏标记 = 锚在本层文本上的
            const marks = scope === "explain"
              ? childMarks(tab.nodeId ? findNode(tab.nodeId) : null)
              : (tab.marks || []);
            // 通过字符位置判断：落在已有标记的区间内（含多行标记的行间空白）→ 打开该层
            const hit = marks.find((m) => off >= m.start && off < m.end);
            if (hit) { openExplainTab(hit.id); return; }
            if (e.target.closest && e.target.closest(".mk, .kd-img")) return;   // 点在标记/配图上
            const text = scope === "explain" ? (tab.explain || "") : tab.text;
            const r = sentenceRangeAt(text, off);
            const free = freeRange(r, marks, off);
            state.draft = free ? { start: free.start, end: free.end, scope } : null;
            renderActiveTab();
          });
        };
        bind($("rd-text"), "text");
        bind($("rd-explain-body"), "explain");
        document.addEventListener("mouseup", () => {
          if (!dragging) return;
          dragging = false;
          const d = state.draft;
          if (!d) return;
          if (d.start === d.end) { state.draft = null; return; }   // 单击：不重建 DOM（保证 click 能派发）
          const tab = state.tabs[state.tabs.length - 1];
          const marks = d.scope === "explain" ? [] : ((tab && tab.marks) || []);
          const anchor = Math.min(d.start, d.end);
          const free = freeRange({ start: anchor, end: Math.max(d.start, d.end) }, marks, anchor);
          state.draft = free ? { start: free.start, end: free.end, scope: d.scope } : null;
          renderActiveTab();
        });
      }

      // ---------- 标记渲染 ----------
      // 文本 → HTML：公式交给 KDM（识别 + KaTeX 渲染），配图按记录的字符位置内联插入，
      // 标记按原文下标包在片段外层
      function renderText(container, text, marks, images) {
        container.innerHTML = KDM.buildHtml({
          text, marks, images,
          markWrapper: (m, inner) => {
            const cls = m.kind === "explain" ? "mk-shared"
              : (m.kind === "draft" ? "mk-draft" : "mk-private");
            if (m.kind === "draft") return `<span class="mk ${cls}">` + inner + "</span>";
            return `<span class="mk ${cls}" data-node="${esc(m.id)}" data-ask="${m.kind === "ask" ? 1 : 0}">`
              + inner + "</span>";
          },
        });
        container.querySelectorAll(".mk").forEach((el) => {
          el.addEventListener("click", () => {
            const id = el.getAttribute("data-node");
            if (!id) return;
            openExplainTab(id);   // 实线（选区解释）与虚线（提问）统一：点击即进入本人该层
          });
        });
        container.querySelectorAll(".kd-img").forEach((el) => {
          el.addEventListener("click", () => explainFigure(el));
        });
      }

      // ---------- 回答区：两栏模型（左=你在读的文本，右=它的解释或回答） ----------
      function clearAnswer() {
        const side = $("rd-side");
        if (side) side.classList.remove("covered");
        state.answerNodeId = null;
      }

      function linkReadingSources(container) {
        // Keep URL text unchanged so existing selection offsets still work.
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        const texts = [];
        while (walker.nextNode()) {
          if (!walker.currentNode.parentElement.closest("a, .kd-math")) texts.push(walker.currentNode);
        }
        for (const node of texts) {
          const re = /https?:\/\/[^\s<>"\u3000-\u303f\uff00-\uffef]+/g;
          let match, cursor = 0;
          const fragment = document.createDocumentFragment();
          while ((match = re.exec(node.textContent))) {
            const raw = match[0].replace(/[)\].,;]+$/, "");
            let url;
            try { url = new URL(raw); } catch (_) { continue; }
            if (!["http:", "https:"].includes(url.protocol) || url.username || url.password) continue;
            fragment.append(document.createTextNode(node.textContent.slice(cursor, match.index)));
            const link = document.createElement("a");
            link.href = url.href; link.textContent = raw;
            link.target = "_blank"; link.rel = "noopener noreferrer";
            fragment.append(link);
            cursor = match.index + raw.length;
          }
          if (cursor) {
            fragment.append(document.createTextNode(node.textContent.slice(cursor)));
            node.replaceWith(fragment);
          }
        }
      }

      // 回答出现：右栏的本层内容（解释）让位，回答占满
      function showAnswer(question, answer, nodeId) {
        const side = $("rd-side");
        if (!side) return;
        state.answerNodeId = nodeId || null;
        KDM.renderMathInto($("rd-answer-q"), question || "");
        KDM.renderMathInto($("rd-answer-body"), answer || "");
        linkReadingSources($("rd-answer-body"));
        const label = $("rd-right-label");
        if (label) label.textContent = "回答";
        side.classList.remove("covered");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          side.classList.add("covered");
        }));
      }

      // 关闭回答：回答层则收起这一层（回到上一层），否则本层解释恢复
      function hideAnswer() {
        const tab = state.tabs[state.tabs.length - 1];
        if (tab && tab.isAnswerLayer) {
          state.tabs.pop();
          renderActiveTab(true);
        } else {
          const label = $("rd-right-label");
          if (label) label.textContent = tab ? (tab.isRoot ? "本段解释" : "这一层的解释") : "本段解释";
        }
        clearAnswer();
      }

      // ---------- 层级标签（只作层级指示：不提供关闭/跳转，退出靠「收起这一层」逐层进行） ----------
      function renderTabs() {
        const bar = $("rd-tabs");
        const total = state.tabs.length;
        if (total <= 1) { bar.hidden = true; bar.innerHTML = ""; return; }
        bar.hidden = false;
        // 超过五个：左边保留第一个、右侧保留最后两层，中间折叠成一个省略框
        let items;
        if (total > 5) {
          items = [
            { tab: state.tabs[0], active: false },
            { more: true },
            { tab: state.tabs[total - 2], active: false },
            { tab: state.tabs[total - 1], active: true },
          ];
        } else {
          items = state.tabs.map((t, i) => ({ tab: t, active: i === total - 1 }));
        }
        bar.innerHTML = items.map((it) => it.more
          ? '<span class="rd-tab-more">…</span>'
          : `<span class="rd-tab${it.active ? " active" : ""}" title="${esc(it.tab.label)}">`
            + esc(it.tab.label) + "</span>"
        ).join("");
      }

      function trimTabsTo(index) {
        state.tabs = state.tabs.slice(0, index + 1);
        clearAnswer();   // 退层时收起回答
        renderActiveTab(true);
      }

      function closeTopTab() {
        if (state.tabs.length <= 1) return;
        state.tabs.pop();
        clearAnswer();
        renderActiveTab(true);
      }

      // 渲染当前层：始终保持两侧滚动位置不变（不做任何自动跳转；调用点多传的参数一律忽略）
      function renderActiveTab() {
        const tab = state.tabs[state.tabs.length - 1];
        if (!tab) return;
        const textEl = $("rd-text");
        const explainBox = $("rd-explain-body") ? $("rd-explain-body").parentElement : null;
        const keepText = textEl.scrollTop;
        const keepExplain = explainBox ? explainBox.scrollTop : 0;
        renderTabs();
        $("rd-left-label").textContent = tab.isRoot ? "本段原文" : "上一层的文本";
        $("rd-right-label").textContent = tab.isRoot
          ? "本段解释" : (tab.isAnswerLayer ? "回答" : "这一层的解释");
        $("rd-text").innerHTML = "";
        const marksWithDraft = [...(tab.marks || [])];
        if (state.draft && state.draft.scope !== "explain"
            && state.draft.start < state.draft.end) {
          marksWithDraft.push({ id: 0, kind: "draft",
                                start: state.draft.start, end: state.draft.end });
        }
        renderText($("rd-text"), tab.text, marksWithDraft,
                   tab.isRoot ? ((state.seg && state.seg.images) || []) : []);
        const explainText = tab.explain || "（生成中或生成失败）";
        // 右栏标记：锚在本层内容上的子解释 / 子提问
        const curNode = tab.nodeId ? findNode(tab.nodeId) : null;
        const explainMarks = curNode ? childMarks(curNode) : [];
        if (state.draft && state.draft.scope === "explain"
            && state.draft.start < state.draft.end) {
          explainMarks.push({ id: 0, kind: "draft",
                              start: state.draft.start, end: state.draft.end });
        }
        renderText($("rd-explain-body"), explainText, explainMarks);
        // 恢复滚动位置（DOM 重建后；下一帧再校正一次，防止布局抖动影响）
        textEl.scrollTop = keepText;
        if (explainBox) explainBox.scrollTop = keepExplain;
        requestAnimationFrame(() => {
          textEl.scrollTop = keepText;
          if (explainBox) explainBox.scrollTop = keepExplain;
        });
        const del = $("rd-del");
        if (del) {
          del.hidden = Boolean(tab.isRoot) || !tab.nodeId;   // 初始解释走独立重新生成；回答层无独立解释节点
          del.onclick = () => deleteNode(tab.nodeId);
        }
        $("rd-done").textContent = tab.isRoot
          ? (state.seg.index + 1 >= state.article.total ? "读完了 →" : "我懂了 →")
          : "收起这一层 ←";
        $("rd-prev").disabled = !tab.isRoot || state.seg.index <= 0;
        const root = state.tabs[0];
        if (root) state.marks = root.marks;
      }

      // 进入某一层（点击标记 / 生成选区解释后）：
      // 左栏 = 该节点所锚定的文本（锚在原文上就是原文，锚在解释上才是解释），右栏 = 该节点的内容
      function openExplainTab(nodeId) {
        const node = findNode(nodeId);
        if (!node) return;
        clearAnswer();   // 换层时收起回答
        const existing = state.tabs.findIndex((t) => t.nodeId === nodeId);
        if (existing >= 0) { trimTabsTo(existing); return; }   // 已在层栈中：直接回到那一层
        const anchorNodeId = node.parent_id || null;
        const parentNode = anchorNodeId ? findNode(anchorNodeId) : null;
        const rootTab = state.tabs[0];
        // 同层切换：新节点与当前层锚定在同一段文本上（兄弟标记）→ 替换当前层，而不是再叠一层
        const current = state.tabs[state.tabs.length - 1];
        if (current && !current.isRoot && current.anchorNodeId === anchorNodeId) {
          state.tabs.pop();
        }
        state.tabs.push({
          nodeId,
          anchorNodeId,
          label: (node.content || node.question || "").slice(0, 14) || "解释",
          text: parentNode ? (parentNode.content || "") : (rootTab ? rootTab.text : ""),
          marks: parentNode ? childMarks(parentNode) : segMarks(state.segNodes),
          explain: node.kind === "ask"
            ? ("Q：" + (node.question || "") + "\n\n" + (node.content || ""))
            : (node.content || ""),
          isRoot: false,
        });
        renderActiveTab(true);   // 换层：回到顶部
      }

      function childMarks(node) {
        // 子节点偏移统一为「相对父节点内容文本」
        if (!node) return [];
        return state.segNodes
          .filter((n) => n.parent_id === node.id && n.pos_start != null && n.pos_end != null)
          .map((n) => ({ id: n.id, kind: n.kind === "ask" ? "ask" : "explain",
                         start: n.pos_start, end: n.pos_end }));
      }

      function findNode(id) {
        return (state.segNodes || []).find((n) => n.id === id);
      }

      // ---------- 原文配图：内联在正文原位置；位置缺失的（早期保存的文章）退回下方配图栏 ----------
      function renderFigs() {
        const box = $("rd-figs");
        if (!box) return;
        const all = (state.article && state.article.images) || [];
        const rest = all.map((x) => (typeof x === "string" ? { url: x, pos: null } : x))
          .filter((x) => x && x.url && x.pos == null);
        if (!rest.length) { box.hidden = true; box.innerHTML = ""; return; }
        box.hidden = false;
        // referrerpolicy：知乎图床有防盗链，卡片那边也是这么处理的
        box.innerHTML = '<div class="rd-figs-head">未定位配图 ' + rest.length + " 张 · 点击看解释</div>"
          + '<div class="rd-figs-row">' + rest.map((f) =>
            '<button type="button" class="rd-fig" data-fig="' + esc(f.url) + '" title="解释这张图">'
            + '<img src="' + esc(f.url) + '" alt="" loading="lazy" referrerpolicy="no-referrer"></button>'
          ).join("") + "</div>";
      }

      // 说明一张图：上下文由服务端按抓取时记录的位置取（图片就插在上下文两段之间）
      async function explainFigure(el) {
        const image = el.getAttribute("data-fig") || "";
        if (!image || !state.url) return;
        document.querySelectorAll(".kd-img, .rd-fig").forEach((b) => b.classList.toggle("active", b === el));
        showAnswer("这张图说明了什么？", "正在看图……", null);
        el.classList.add("busy");
        try {
          const data = await api("/api/reading/image", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: state.url, image }),
          });
          KDM.renderMathInto($("rd-answer-body"), data.explain || "（没有拿到解释）");
        } catch (err) {
          KDM.renderMathInto($("rd-answer-body"), "解释失败：" + err.message);
        } finally {
          el.classList.remove("busy");
        }
      }

      // ---------- 渲染一段 ----------
      function segMarks(nodes) {
        return (nodes || [])
          .filter((n) => n.pos_start != null && n.pos_end != null && n.kind !== "init"
                         && !n.parent_id)   // 根层只显示顶层标记；子标记属于各自的层
          .map((n) => ({ id: n.id, kind: n.kind === "ask" ? "ask" : "explain",
                         start: n.pos_start, end: n.pos_end }));
      }

      function renderSegment(payload) {
        $("rd-body-main").hidden = false;
        $("rd-ask-area").hidden = false;
        $("rd-right-label").hidden = false;
        $("rd-finish").hidden = true;
        clearAnswer();   // 换段时收起回答
        state.seg = payload;
        state.segNodes = payload.nodes || [];
        state.rootMarks = segMarks(payload.nodes);
        state.tabs = [{ nodeId: payload.explain_id, anchorNodeId: null, label: "本段解释", text: payload.text,
                        marks: state.rootMarks, explain: payload.explain || "（生成中或生成失败）", isRoot: true }];
        state.marks = state.rootMarks;
        renderProgress();
        renderActiveTab();   // 换段：不重置滚动（用户可自行滚动）
        if (!payload.explain_id) generateInitialExplain();
        preloadSegment(payload.index + 1);   // 预加载下一段的解释，消除「我懂了」后的等待
        if (!readingTutorialStarted && window.KDTutorial) {
          readingTutorialStarted = true;
          requestAnimationFrame(() => window.KDTutorial.start("reading-basics"));
        }
      }

      // 预加载：进入本段后，后台静默生成本人下一段初始解释（同账号缓存可复用）
      function preloadSegment(n) {
        if (n < 0 || !state.article || n >= state.article.total) return;
        if (state.prefetch[n]) return;
        const gen = articleGen;   // 换文章后丢弃旧结果
        api("/api/reading/segment?url=" + encodeURIComponent(state.url)
            + "&version=" + encodeURIComponent((state.article && state.article.version) || "")
            + "&seg=" + n)
          .then((data) => {
            if (gen !== articleGen) return;
            // 仅在尚未到达该段时缓存（防止过期数据覆盖当前段）
            if (state.seg && state.seg.index < n) state.prefetch[n] = data.segment;
          })
          .catch(() => { /* 静默：真正进入该段时会重新请求 */ });
      }

      // ---------- 操作 ----------
      // 顶部作者：服务端从收藏夹精确取到的名字优先；头像/徽章只在搜索匹配到同一名字时采用
      async function loadAuthor(url, title, known) {
        const box = $("rd-author");
        if (!box) return;
        box.hidden = true;
        let name = (known && known.name) || "";
        let avatar = "", badge = "", badgeText = "", token = "";
        try {
          const data = await api("/api/article_meta", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: [{ url, title }] }),
          });
          const meta = (data.meta || {})[url];
          if (meta && meta.author_name) {
            const same = !name || meta.author_name === name;
            if (!name) name = meta.author_name;
            if (same) {
              avatar = meta.avatar || "";
              badge = meta.badge || "";
              badgeText = meta.badge_text || "";
              token = meta.author_token || "";
            }
          }
        } catch (err) { /* 静默：拿不到头像/称号不影响阅读 */ }
        if (!name) return;
        $("rd-author-name").textContent = name;
        // 头像/昵称点击进入知乎主页
        const profile = (known && known.url)
          || (known && known.url_token ? "https://www.zhihu.com/people/" + known.url_token : "")
          || (token ? "https://www.zhihu.com/people/" + token : "");
        const link = $("rd-author-link");
        if (profile) { link.href = profile; link.target = "_blank"; } else { link.removeAttribute("href"); }
        const img = $("rd-avatar");
        if (avatar) {
          img.onerror = () => { img.hidden = true; };   // 图拉不到（离线/被拦）时只显示名字
          img.src = avatar;
          img.hidden = false;
        }
        const badgeImg = $("rd-author-badge");
        if (badge) {
          badgeImg.onerror = () => { badgeImg.hidden = true; };
          badgeImg.src = badge;
          badgeImg.hidden = false;
        }
        const badgeLabel = $("rd-author-title");
        if (badgeText) {
          badgeLabel.textContent = badgeText;
          badgeLabel.hidden = false;
        }
        box.hidden = false;
      }

      // 文章代次：切换文章后自增，旧的异步请求返回时直接丢弃（避免覆盖新文章）
      let articleGen = 0;

      async function openArticle(url, startSeg, version, segmentId) {
        const gen = ++articleGen;
        state.prefetch = {};   // 换文章：清空上一批预加载的段落
        $("rd-start").hidden = false;
        $("rd-session").hidden = true;
        $("rd-spinner").hidden = false;
        $("rd-loading").hidden = false;
        $("rd-loading").textContent = "加载中…";
        $("rd-start-error").textContent = "";
        $("rd-start-actions").hidden = true;
        $("rd-open").hidden = false;
        $("rd-open").disabled = true;
        $("rd-open").onclick = () => openArticle(url, startSeg, version, segmentId);
        try {
          const data = await api("/api/reading/open", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, version: version || undefined,
                                   segment_id: segmentId || undefined }),
          });
          if (gen !== articleGen) return;   // 期间又切换了文章：丢弃本次结果
          state.url = url;
          state.article = data.article;
          KDM.renderMathInto($("rd-title"), data.article.title || "精读");
          renderFigs();
          $("rd-title-link").href = url;   // 点标题回知乎原文
          loadAuthor(url, data.article.title || "", data.article.author);
          $("rd-start").hidden = true; $("rd-session").hidden = false;
          renderSegment(data.segment);
          resumePendingOperation();
          loadHistoryList(true);   // 侧边栏学习记录：强制刷新以更新进度与高亮
          // 学习记录恢复：跳到上次读到的段落
          const target = segmentId ? 0 : (Number(startSeg) || 0);
          if (target > 0 && target < (data.article.total || 0)) goSegment(target);
        } catch (err) {
          if (gen !== articleGen) return;   // 期间已切换文章：不显示旧错误
          $("rd-start-error").textContent = err.message
            + (err.code === "NOT_DISTILLED" ? "（先在收藏列表里点「保存全文」）" : "");
          $("rd-start").hidden = false;
          $("rd-session").hidden = true;
          $("rd-spinner").hidden = true;
          $("rd-loading").hidden = true;
          $("rd-start-actions").hidden = false;
          $("rd-open").disabled = false;
        }
      }

      // 换段导航：页数控件文案
      function renderProgress() {
        const btn = $("rd-seg-btn");
        if (btn && state.article && state.seg) {
          btn.textContent = "第 " + (state.seg.index + 1) + " / " + state.article.total + " 段";
        }
      }

      // 段列表：点开可跳任意一段
      function toggleSegMenu(show) {
        const menu = $("rd-seg-menu");
        if (!menu) return;
        const open = show !== undefined ? show : menu.hidden;
        if (open) {
          const total = (state.article && state.article.total) || 0;
          const cur = state.seg ? state.seg.index : 0;
          menu.innerHTML = "";
          for (let i = 0; i < total; i++) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "rd-seg-item" + (i === cur ? " active" : "");
            b.textContent = String(i + 1);
            b.addEventListener("click", () => {
              toggleSegMenu(false);
              if (i !== cur) goSegment(i);
            });
            menu.appendChild(b);
          }
        }
        menu.hidden = !open;
      }

      async function goSegment(n) {
        if (n < 0 || (state.article && n >= state.article.total)) return;
        const gen = articleGen;   // 记录代次：期间若切换文章，本次结果丢弃
        if (state.prefetch[n]) {           // 命中预加载：秒切
          const cached = state.prefetch[n];
          delete state.prefetch[n];
          renderSegment(cached);
          return;
        }
        $("rd-nav-hint").hidden = false;
        $("rd-prev").disabled = $("rd-done").disabled = true;
        try {
          const data = await api("/api/reading/segment?url=" + encodeURIComponent(state.url)
                                 + "&version=" + encodeURIComponent(state.article.version || "")
                                 + "&seg=" + n);
          if (gen !== articleGen) return;   // 已切换文章：丢弃
          renderSegment(data.segment);
        } catch (err) {
          if (gen === articleGen) alert("进入段落失败：" + err.message);
        } finally {
          $("rd-nav-hint").hidden = true;
          $("rd-done").disabled = false;
        }
      }

      function newIdempotencyKey() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
          const r = Math.random() * 16 | 0;
          return (c === "x" ? r : (r & 3 | 8)).toString(16);
        });
      }

      async function waitForOperation(operationId) {
        const failed = new Set(["quote_expired", "waived_not_dispatched",
                                "waived_failure", "waived_unknown"]);
        for (;;) {
          const row = await api("/api/reading/operations/" + encodeURIComponent(operationId));
          if (row.status === "settled" || row.status === "cache_hit") return row;
          if (failed.has(row.status)) {
            const err = new Error(row.error_code || "生成没有完成，冻结额度已退回。");
            err.code = row.error_code || row.status;
            throw err;
          }
          await new Promise((resolve) => setTimeout(resolve, 2000));
        }
      }

      async function runBilledGeneration(action, body) {
        const scope = { url: state.url, version: state.article.version,
                        segment_id: state.seg.segment_id };
        const quote = await api("/api/reading/quote", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.assign({
            action, ...scope,
            idempotency_key: newIdempotencyKey(),
          }, body || {})),
        });
        let operation = quote;
        if (quote.status !== "cache_hit") {
        const endpoint = action === "init" ? "/api/reading/init"
          : action === "advanced" ? "/api/reading/advanced"
          : (action === "explain" ? "/api/reading/selection" : "/api/reading/ask");
        const accepted = await api(endpoint, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ operation_id: quote.operation_id }),
        });
        const operationId = accepted.operation_id || quote.operation_id;
        localStorage.setItem("kd_pending_operation_v1", JSON.stringify({
          operation_id: operationId, ...scope,
        }));
        operation = await waitForOperation(operationId);
        localStorage.removeItem("kd_pending_operation_v1");
        }
        const segment = await api("/api/reading/segment?url=" + encodeURIComponent(scope.url)
          + "&version=" + encodeURIComponent(scope.version || "")
          + "&segment_id=" + encodeURIComponent(scope.segment_id || ""));
        const node = (segment.segment.nodes || []).find((item) =>
          String(item.id) === String(operation.result_node_id));
        return { operation, node: node || null, segment: segment.segment };
      }
      window.KDRunBilledGeneration = runBilledGeneration;

      async function resumePendingOperation() {
        let pending;
        try { pending = JSON.parse(localStorage.getItem("kd_pending_operation_v1") || "null"); }
        catch (_) { localStorage.removeItem("kd_pending_operation_v1"); return; }
        if (!pending || pending.url !== state.url || pending.version !== state.article.version
            || pending.segment_id !== state.seg.segment_id) return;
        try {
          await waitForOperation(pending.operation_id);
          localStorage.removeItem("kd_pending_operation_v1");
          await reloadCurrentSegment();
          $("rd-ask-error").textContent = "上次的生成任务已经完成。";
        } catch (err) {
          localStorage.removeItem("kd_pending_operation_v1");
          $("rd-ask-error").textContent = err.message;
        }
      }

      async function submitAdvanced() {
        const button = $("rd-advanced");
        const status = $("rd-advanced-status");
        if (button.disabled || !state.seg || !state.article) return;
        const tab = state.tabs[state.tabs.length - 1];
        if (!tab || !tab.nodeId) {
          status.hidden = false; status.textContent = "请先生成本段解释，再使用高级解释。";
          return;
        }
        const scope = [state.url, state.article.version, state.seg.segment_id, tab.nodeId];
        const unchanged = () => scope.every((value, index) => value ===
          [state.url, state.article && state.article.version, state.seg && state.seg.segment_id,
           state.tabs[state.tabs.length - 1] && state.tabs[state.tabs.length - 1].nodeId][index]);
        const body = { parent_id: tab.nodeId, question: $("rd-question").value.trim() };
        const leftSelection = selectionOffsets($("rd-text"));
        if (leftSelection) {
          const selected = (tab.text || "").slice(leftSelection.start, leftSelection.end);
          body.question = (body.question || "请深入解释以下原文选区。") + "\n选区：" + selected;
        }
        // A selection inside the explanation is relative to its parent node text.
        const draft = state.draft;
        if (draft && draft.scope === "explain" && draft.start < draft.end) {
          body.pos_start = Array.from((tab.explain || "").slice(0, draft.start)).length;
          body.pos_end = Array.from((tab.explain || "").slice(0, draft.end)).length;
        }
        button.disabled = true; button.setAttribute("aria-busy", "true");
        status.hidden = false; status.textContent = "正在核验会员权限与本次额度…";
        const progress = setTimeout(() => {
          if (unchanged()) status.textContent = "正在查阅引用资料并整理解释，通常需要几十秒…";
        }, 2500);
        try {
          const data = await runBilledGeneration("advanced", body);
          if (!unchanged()) return;
          if (!data.node) throw new Error("高级解释已生成，但暂时无法读取结果，请刷新本段。");
          if (!findNode(data.node.id)) state.segNodes.push(data.node);
          state.draft = null;
          const usage = data.operation.status === "cache_hit" ? "已保存的解释 · 不重复扣费"
            : "本次使用 " + Number(data.operation.usage_tokens || 0).toLocaleString("zh-CN") + " 积分";
          showAnswer("高级解释 · " + usage, data.node.content || "", data.node.id);
          $("rd-right-label").textContent = "高级解释";
          status.textContent = "高级解释已完成，本次使用 "
            + Number(data.operation.usage_tokens || 0).toLocaleString("zh-CN") + " 积分。";
        } catch (err) {
          if (unchanged()) status.textContent = err.code === "USER_CANCELLED"
            ? "已取消，未扣积分。" : err.message;
        } finally {
          clearTimeout(progress);
          button.disabled = false; button.removeAttribute("aria-busy");
          if (!unchanged()) status.hidden = true;
        }
      }
      $("rd-advanced").addEventListener("click", submitAdvanced);

      async function reloadCurrentSegment() {
        const data = await api("/api/reading/segment?url=" + encodeURIComponent(state.url)
          + "&version=" + encodeURIComponent(state.article.version || "")
          + "&segment_id=" + encodeURIComponent(state.seg.segment_id || ""));
        renderSegment(data.segment);
        return data.segment;
      }

      async function generateInitialExplain() {
        if (!state.seg || state.seg.explain_id) return;
        const segmentId = state.seg.segment_id;
        if (state.initializingSegmentId === segmentId) return;
        state.initializingSegmentId = segmentId;
        $("rd-explain-body").textContent = "正在生成本段解释……";
        try {
          await runBilledGeneration("init", {});
          if (state.seg && state.seg.segment_id === segmentId) {
            await reloadCurrentSegment();
          }
        } catch (err) {
          if (state.seg && state.seg.segment_id === segmentId) {
            $("rd-ask-error").textContent = err.message;
            renderActiveTab();
          }
        } finally {
          if (state.initializingSegmentId === segmentId) {
            state.initializingSegmentId = null;
          }
        }
      }

      async function submit() {
        const question = $("rd-question").value.trim();
        const offsets = selectionOffsets($("rd-text"));
        const explainDraft = (state.draft && state.draft.scope === "explain"
                              && state.draft.start < state.draft.end) ? state.draft : null;
        const tab = state.tabs[state.tabs.length - 1];
        if (!question && !offsets && !explainDraft) {
          $("rd-ask-error").textContent = "先划选一段文字，或输入你的问题。";
          return;
        }
        // 选区偏移一律相对「当前层左栏文本」；左栏文本归属其锚点节点（root 层为段落本身）
        const anchorTab = state.tabs.length > 1 ? state.tabs[state.tabs.length - 2] : null;
        const leftAnchorId = anchorTab ? anchorTab.nodeId : null;
        $("rd-ask-error").textContent = "";
        $("rd-ask").disabled = true; $("rd-ask").textContent = "生成中…";
        try {
          if (!question && (offsets || explainDraft)) {
            // 纯选中 = 本人选区解释：左栏文字锚在上一层内容上，右栏解释文字锚在本层内容上
            const sel = offsets || explainDraft;
            const body = { url: state.url, seg: state.seg.index,
                           pos_start: sel.start, pos_end: sel.end };
            const anchorId = offsets ? leftAnchorId : (tab ? tab.nodeId : null);
            if (anchorId != null) body.parent_id = anchorId;
            const data = await runBilledGeneration("explain", body);
            if (!data.node) throw new Error("解释已生成，但暂时无法读取结果。");
            state.draft = null;
            state.segNodes.push(data.node);
            refreshMarks(tab);
            window.getSelection().removeAllRanges();
            openExplainTab(data.node.id);   // 生成后立刻打开该解释层，让用户看到内容
          } else {
            // 有输入 = 私有提问（锚定选区或当前层）；右栏选中但没打字时默认问"这段是什么意思"
            const askText = question || "这段是什么意思？";
            const body = { url: state.url, seg: state.seg.index, question: askText };
            if (offsets) {                                  // 左栏选区提问：锚在左栏文本空间
              body.pos_start = offsets.start; body.pos_end = offsets.end;
              if (leftAnchorId != null) body.parent_id = leftAnchorId;
            } else if (explainDraft) {                      // 右栏解释选区提问：锚在本层内容上
              body.pos_start = explainDraft.start; body.pos_end = explainDraft.end;
              body.anchor_text = ((tab && tab.explain) || "").slice(explainDraft.start, explainDraft.end);
              if (tab && tab.nodeId) body.parent_id = tab.nodeId;
            } else if (tab && !tab.isRoot && tab.nodeId) {  // 无选区：挂在当前层内容节点上
              body.parent_id = tab.nodeId;
            }
            const data = await runBilledGeneration("ask", body);
            if (!data.node) throw new Error("回答已生成，但暂时无法读取结果。");
            state.segNodes.push(data.node);
            state.draft = null;
            if (explainDraft) {
              // 问解释：解释左移成为这一层的父文本（左栏），回答占据右栏
              const curNode = tab.nodeId ? findNode(tab.nodeId) : null;
              state.tabs.push({
                nodeId: data.node.id, anchorNodeId: tab.nodeId, label: "追问",
                text: tab.explain || "", marks: childMarks(curNode),
                explain: data.node.content || "",
                isRoot: false, isAnswerLayer: true,
              });
            }
            renderActiveTab(Boolean(explainDraft));   // 换成回答层（解释左移）时回到顶部；同层提问保持位置
            showAnswer(askText, data.node.content || "", data.node.id);
            $("rd-question").value = "";
            window.getSelection().removeAllRanges();
          }
        } catch (err) {
          $("rd-ask-error").textContent = err.message;
        } finally {
          $("rd-ask").disabled = false; $("rd-ask").textContent = "提问";
        }
      }

      // 标记刷新：左栏文本归属其锚点节点（root / 锚在原文上的节点 → 段内标记；锚在某节点内容上 → 该内容上的子标记）
      function refreshMarks(tab) {
        const root = state.tabs[0];
        if (root) { root.anchorNodeId = null; root.marks = segMarks(state.segNodes); }
        if (tab && !tab.isRoot) {
          const anchor = tab.anchorNodeId ? findNode(tab.anchorNodeId) : null;
          tab.marks = anchor ? childMarks(anchor) : segMarks(state.segNodes);
        }
        renderActiveTab();   // 同层刷新：保持滚动位置
      }

      let pendingDelete = null;

      async function deleteNode(nodeId) {
        if (!nodeId) return;
        // 二次点击确认（原生 confirm 弹窗可能被宿主屏蔽）
        if (pendingDelete !== nodeId) {
          pendingDelete = nodeId;
          const btn = $("rd-del");
          if (btn) btn.textContent = "再点一次确认删除";
          setTimeout(() => {
            if (pendingDelete === nodeId) {
              pendingDelete = null;
              const b = $("rd-del");
              if (b) b.textContent = "删除这条解释";
            }
          }, 4000);
          return;
        }
        pendingDelete = null;
        const btnReset = $("rd-del");
        if (btnReset) btnReset.textContent = "删除这条解释";
        try {
          await api("/api/reading/node/" + nodeId + "?url=" + encodeURIComponent(state.url)
                    + "&version=" + encodeURIComponent(state.article.version || "")
                    + "&segment_id=" + encodeURIComponent(state.seg.segment_id || ""),
                    { method: "DELETE" });
          // 重新载入本段：标记、解释、层栈全部回到一致状态（下划线随之消失）
          const data = await api("/api/reading/segment?url=" + encodeURIComponent(state.url)
                                 + "&version=" + encodeURIComponent(state.article.version || "")
                                 + "&segment_id=" + encodeURIComponent(state.seg.segment_id || ""));
          renderSegment(data.segment);
        } catch (err) {
          $("rd-ask-error").textContent = "删除失败：" + err.message;
        }
      }

      function logEvent(event, segIndex, nodeId) {
        fetch("/api/reading/event", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: state.url, version: state.article && state.article.version,
                                 segment_id: state.seg && state.seg.segment_id, event: event,
                                 seg_index: segIndex, node_id: nodeId }),
        }).catch(() => {});
      }

      // 读完：进岔路口。只记一条 finished 埋点，界面不为它改变任何东西
      function showFinish() {
        logEvent("finished", state.seg.index, null);
        $("rd-session").querySelector(".rd-body").hidden = true;
        $("rd-tabs").hidden = true;
        $("rd-right-label").hidden = true;
        const askArea = $("rd-ask-area");
        if (askArea) askArea.hidden = true;
        $("rd-quiz").hidden = true;
        $("rd-finish").hidden = false;
      }

      async function understood() {
        const tab = state.tabs[state.tabs.length - 1];
        if (!tab.isRoot) { closeTopTab(); return; }     // 层级：收起本层
        logEvent("understood", state.seg.index, null);
        if (state.seg.index + 1 >= state.article.total) { showFinish(); return; }
        await goSegment(state.seg.index + 1);
      }

      // ---------- 自测：一题一屏；判定在后端，答错才带讲解 ----------
      const quiz = { questions: [], index: 0, summary: "", right: 0, wrong: 0, locked: false };

      function quizShow(show) {
        $("rd-quiz").hidden = !show;
        if (show) { $("rd-finish").hidden = true; $("rd-quiz-error").textContent = ""; }
      }

      function quizProgress() {
        const total = quiz.questions.length;
        const done = quiz.right + quiz.wrong;
        $("rd-quiz-count").textContent = total ? (done + " / " + total) : "";
        $("rd-quiz-bar").style.width = total ? Math.round(done / total * 100) + "%" : "0";
      }

      // 复习过的题（服务端记着的）在进度条上也算已答，避免重进时看起来退回原点
      function quizCountSettled() {
        const total = quiz.questions.length;
        const done = quiz.questions.filter((q) => q.done).length;
        $("rd-quiz-count").textContent = total ? (done + " / " + total) : "";
        $("rd-quiz-bar").style.width = total ? Math.round(done / total * 100) + "%" : "0";
      }

      function renderQuizQuestion() {
        const q = quiz.questions[quiz.index];
        if (!q) { renderQuizEnd(); return; }
        quiz.locked = false;
        quizProgress();
        const head = '<div class="rd-quiz-tags">'
          + '<span class="rd-quiz-tag">' + (q.focus === "concept" ? "概念辨析" : "知识记忆") + "</span>"
          + '<span class="rd-quiz-tag kind">' + (q.kind === "choice" ? "选择" : "判断") + "</span>"
          + "</div>";
        const stem = '<div class="rd-quiz-stem">' + KDM.buildHtml({ text: q.stem }) + "</div>";
        let body;
        if (q.kind === "choice") {
          body = '<div class="rd-quiz-opts">' + (q.options || []).map((opt, i) =>
            '<button class="rd-quiz-opt" data-pick="' + i + '">'
            + '<span class="pick">' + "ABCD"[i] + "</span>"
            + KDM.buildHtml({ text: opt }) + "</button>").join("") + "</div>";
        } else {
          body = '<div class="rd-quiz-opts">'
            + '<button class="rd-quiz-opt" data-pick="true"><span class="pick">○</span>对</button>'
            + '<button class="rd-quiz-opt" data-pick="false"><span class="pick">○</span>错</button>'
            + "</div>";
        }
        $("rd-quiz-question").innerHTML = head + stem + body
          + '<div id="rd-quiz-result"></div>'
          + '<div class="rd-quiz-foot"><span class="spacer"></span>'
          + '<button class="rd-btn ghost" id="rd-quiz-skip">先跳过</button></div>';
      }

      async function answerQuiz(pick, btn) {
        if (quiz.locked) return;
        quiz.locked = true;
        const q = quiz.questions[quiz.index];
        const opts = Array.from(document.querySelectorAll("#rd-quiz-question .rd-quiz-opt"));
        opts.forEach((b) => { b.disabled = true; });
        btn.classList.add("picked");
        const result = $("rd-quiz-result");
        result.innerHTML = '<div class="rd-quiz-verdict">判定中…</div>';
        let data;
        try {
          data = await api("/api/reading/quiz/answer", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: state.url, index: quiz.index,
                                   answer: pick }),
          });
        } catch (err) {
          quiz.locked = false;
          opts.forEach((b) => { b.disabled = false; });
          btn.classList.remove("picked");
          result.innerHTML = "";
          $("rd-quiz-error").textContent = "提交失败：" + err.message;
          return;
        }
        $("rd-quiz-error").textContent = "";
        const correct = Boolean(data.correct);
        if (correct) { quiz.right += 1; } else { quiz.wrong += 1; }
        q.done = true; q.correct = correct;
        // 标出对错：正确选项一定点亮；用户选错的那个标红
        opts.forEach((b) => {
          const pickRaw = b.getAttribute("data-pick");
          if (q.kind === "choice") {
            if (Number(pickRaw) === data.right_index) b.classList.add("right");
            else if (b === btn) b.classList.add("wrong");
          } else {
            const isRight = (pickRaw === "true") === Boolean(data.right_bool);
            if (isRight) b.classList.add("right");
            else if (b === btn) b.classList.add("wrong");
          }
        });
        result.innerHTML =
          '<div class="rd-quiz-verdict ' + (correct ? "right" : "wrong") + '">'
          + (correct ? "答对了" : "答错了，正确答案是「" + esc(data.answer) + "」") + "</div>"
          + (data.explain ? '<div class="rd-quiz-explain">' + esc(data.explain) + "</div>" : "");
        // 答完这题才给「下一题」；答对也保留问题，不自动跳，用户自己看解析
        const foot = document.querySelector("#rd-quiz-question .rd-quiz-foot");
        const skip = $("rd-quiz-skip");
        if (skip) skip.remove();
        const next = document.createElement("button");
        next.className = "rd-btn";
        next.id = "rd-quiz-next";
        next.textContent = quiz.index + 1 >= quiz.questions.length ? "看结果 →" : "下一题 →";
        foot.appendChild(next);
        next.addEventListener("click", () => {
          if (quiz.index + 1 >= quiz.questions.length) { renderQuizEnd(); return; }
          quiz.index += 1;
          renderQuizQuestion();
        });
        quizProgress();
      }

      function renderQuizEnd() {
        $("rd-quiz-question").innerHTML = "";
        $("rd-quiz-card").hidden = true;
        $("rd-quiz-end").hidden = false;
        const total = quiz.questions.length;
        const settled = quiz.questions.filter((q) => q.done).length;
        $("rd-quiz-end-title").textContent = settled + " / " + total + " 题已作答";
        // 薄弱点 = 答错的 + 跳过的；有才给复习入口（全对时没什么可复习的）
        const weak = total - quiz.questions.filter((q) => q.done && q.correct).length;
        $("rd-review-after-quiz").hidden = weak === 0;
        if (weak) {
          $("rd-review-after-quiz").textContent = "复习一下";
        }
        const note = quiz.wrong || weak
          ? "答错和跳过的地方上面都给了讲解。复习一下会把这些地方串起来讲一遍。"
          : "这篇你记住了。过几天再来一次，看还记得多少。";
        $("rd-quiz-end-note").textContent = note;
        logEvent("quiz_done", null, null);
      }

      async function startQuiz() {
        quizShow(true);
        $("rd-quiz-card").hidden = false;
        $("rd-quiz-end").hidden = true;
        $("rd-review").hidden = true;
        $("rd-quiz-question").innerHTML =
          '<div class="rd-quiz-stem">正在根据这篇的内容出题……（首次约 10~30 秒）</div>';
        $("rd-quiz-summary").hidden = true;
        quiz.questions = []; quiz.index = 0; quiz.right = 0; quiz.wrong = 0;
        let data;
        try {
          data = await api("/api/reading/quiz?url=" + encodeURIComponent(state.url));
        } catch (err) {
          $("rd-quiz-question").innerHTML = "";
          $("rd-quiz-error").textContent = "出题失败：" + err.message;
          return;
        }
        quiz.questions = data.questions || [];
        quiz.summary = data.summary || "";
        if (!quiz.questions.length) {
          $("rd-quiz-question").innerHTML = "";
          $("rd-quiz-error").textContent = "这篇没能出出题目，稍后再试。";
          return;
        }
        // 概括：从学习记录重新进来时靠它把内容回忆起来
        if (quiz.summary) {
          $("rd-quiz-summary").textContent = quiz.summary;
          $("rd-quiz-summary").hidden = false;
        }
        quizCountSettled();
        renderQuizQuestion();
      }

      // ---------- 复习：一段概括性文字 ----------
      // mode 由进入路径决定，按钮文案一律「复习一下」，用户不感知两种模式
      async function startReview(mode) {
        $("rd-finish").hidden = true;
        $("rd-quiz").hidden = true;
        $("rd-review").hidden = false;
        $("rd-review-error").textContent = "";
        $("rd-review-text").textContent = "";
        $("rd-review-label").textContent = mode === "personal" ? "针对你这次的薄弱点" : "全文概括";
        $("rd-review-wait").textContent = "正在根据这篇内容整理……（约 10~30 秒）";
        let data;
        try {
          data = await api("/api/reading/review", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: state.url, mode: mode }),
          });
        } catch (err) {
          $("rd-review-wait").textContent = "";
          $("rd-review-error").textContent = "生成失败：" + err.message;
          return;
        }
        $("rd-review-wait").textContent = "";
        $("rd-review-text").textContent = data.text || "";
        // 后端可能把 personal 退回了 general（没有薄弱点时），标签跟着实际模式走
        if (data.mode === "general" && mode === "personal") {
          $("rd-review-label").textContent = "全文概括";
        }
        logEvent("reviewed", null, null);
      }

      // ---------- 事件 ----------
      $("rd-ask").addEventListener("click", submit);
      $("rd-question").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      $("rd-done").addEventListener("click", understood);
      $("rd-to-quiz").addEventListener("click", startQuiz);
      // 岔路口进来的复习：基于原贴内容（那时还没有自测反馈）
      $("rd-to-review").addEventListener("click", () => startReview("general"));
      // 自测结束页进来的复习：带上我刚答错和跳过的题
      $("rd-review-after-quiz").addEventListener("click", () => startReview("personal"));
      $("rd-review-back").addEventListener("click", () => {
        $("rd-review").hidden = true;
        $("rd-finish").hidden = false;
      });
      $("rd-quiz-back").addEventListener("click", () => {
        quizShow(false);
        $("rd-finish").hidden = false;
      });
      $("rd-quiz-again").addEventListener("click", startQuiz);
      $("rd-quiz-to-read").addEventListener("click", () => {
        quizShow(false);
        $("rd-session").querySelector(".rd-body").hidden = false;
        $("rd-right-label").hidden = false;
        const askArea = $("rd-ask-area");
        if (askArea) askArea.hidden = false;
        goSegment(0);
      });
      document.addEventListener("click", (e) => {
        const opt = e.target.closest("#rd-quiz-question .rd-quiz-opt");
        if (opt) answerQuiz(opt.getAttribute("data-pick") === "true" ? true
                            : opt.getAttribute("data-pick") === "false" ? false
                            : Number(opt.getAttribute("data-pick")), opt);
      });
      document.addEventListener("click", (e) => {
        if (e.target.closest("#rd-quiz-skip")) {
          if (quiz.index + 1 >= quiz.questions.length) { renderQuizEnd(); return; }
          quiz.index += 1;
          renderQuizQuestion();
        }
      });
      $("rd-prev").addEventListener("click", () => goSegment(state.seg.index - 1));
      // 段落控件：点开段列表，点外部关闭
      $("rd-seg-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleSegMenu(); });
      document.addEventListener("click", (e) => {
        const menu = $("rd-seg-menu");
        if (menu && !menu.hidden && !e.target.closest(".rd-seg-picker")) toggleSegMenu(false);
      });
      $("rd-answer-close").addEventListener("click", hideAnswer);
      setupSelection();   // 划选：按住拖动 + 单击选整句（均不依赖原生文本选择）
      const figsBox = $("rd-figs");
      if (figsBox) {
        figsBox.addEventListener("click", (e) => {
          const fig = e.target.closest(".rd-fig");
          if (fig) explainFigure(fig);
        });
      }

      // 更新文章：打开知乎原文重新采集；服务端创建新版本并保留旧版本与本人解释。
      (function initRefreshArticle() {
        const btn = $("rd-refresh-article");
        if (!btn) return;
        btn.addEventListener("click", () => {
          if (!state.url) return;
          window.open(state.url.split("#")[0] + "#kd=1", "_blank", "noopener");
          btn.textContent = "已打开知乎原文";
          $("rd-ask-error").textContent =
            "请在打开的知乎页面使用新版保存工具。新内容会成为一个版本，旧版本和你的已有解释都会保留。";
          setTimeout(() => { btn.textContent = "更新文章"; }, 5000);
        });
      })();

      // ---------- 学习记录下拉（有缓存即时渲染；打开文章后强制刷新以更新进度/高亮） ----------
      const histNormKey = (u) => {
        const m = String(u || "").match(/\/answer\/(\d+)/);
        return m ? ("answer/" + m[1]) : String(u || "").split("?")[0].split("#")[0];
      };
      let histCache = null;   // 同一次浏览内复用，避免每次展开都等加载
      function renderHistList(items) {
        const sub = $("hist-sub");
        if (!sub) return;
        if (!items.length) {
          sub.innerHTML = '<div class="nav-sub-loading">还没有学习记录</div>';
          return;
        }
        const curKey = histNormKey(state.url);
        sub.innerHTML = items.map((it) => {
          const href = "/reading.html?url=" + encodeURIComponent(it.url)
            + "&version=" + encodeURIComponent(it.version || "")
            + "&segment_id=" + encodeURIComponent(it.segment_id || "")
            + "&seg=" + (it.seg || 0);
          const label = it.total > 1 ? ((it.seg || 0) + 1) + "/" + it.total : "";
          const active = histNormKey(it.url) === curKey ? " active" : "";   // 当前打开的文章高亮
          return '<div class="nav-subrow">'
            + '<a class="nav-subitem' + active + '" href="' + href + '" title="' + esc(it.title || "") + '">'
            + '<span class="nav-subitem-title">' + KDM.buildHtml({ text: it.title || it.url || "" }) + '</span>'
            + (label ? '<span class="sub-count">' + label + '</span>' : "")
            + '</a>'
            + '<button type="button" class="nav-subdel" data-del="' + esc(it.url || "") + '"'
            + ' title="删除这条学习记录" aria-label="删除这条学习记录">×</button>'
            + "</div>";
        }).join("");
      }

      // 删除一条学习记录：二次点击确认（原生 confirm 弹窗可能被宿主屏蔽）
      let pendingHistDel = null;
      function resetHistDel(btn) {
        btn.disabled = false;
        btn.classList.remove("confirm");
        btn.textContent = "×";
      }
      async function deleteHistory(btn) {
        const url = btn.getAttribute("data-del") || "";
        if (!url) return;
        if (pendingHistDel !== url) {
          pendingHistDel = url;
          btn.classList.add("confirm");
          btn.textContent = "确认";
          setTimeout(() => { if (pendingHistDel === url) { pendingHistDel = null; resetHistDel(btn); } }, 4000);
          return;
        }
        pendingHistDel = null;
        btn.disabled = true;
        try {
          await api("/api/reading/history?url=" + encodeURIComponent(url), { method: "DELETE" });
          histCache = (histCache || []).filter((it) => it.url !== url);
          renderHistList(histCache);
        } catch (err) {
          resetHistDel(btn);
          alert("删除失败：" + err.message);
        }
      }
      async function loadHistoryList(force) {
        const sub = $("hist-sub");
        if (!sub) return;
        if (histCache && !force) { renderHistList(histCache); return; }   // 命中缓存：即时显示
        if (!histCache) sub.innerHTML = '<div class="nav-sub-loading">加载中……</div>';
        try {
          const res = await fetch("/api/reading/history");
          const data = await res.json();
          histCache = (data.items || []).slice(0, 12);
          renderHistList(histCache);
        } catch (err) {
          if (!histCache) sub.innerHTML = '<div class="nav-sub-loading">加载失败</div>';
        }
      }

      // ---------- 收藏夹下拉（学习页可直接进入指定收藏夹） ----------
      let favCache = null;
      function renderFavList(items) {
        const sub = $("fav-sub");
        if (!sub) return;
        if (!items.length) {
          sub.innerHTML = '<div class="nav-sub-loading">没有可用的收藏夹</div>';
          return;
        }
        sub.innerHTML = items.map((it) => {
          const token = String(it.UrlToken || "");
          const href = "/?favlist=" + encodeURIComponent(token);
          return '<a class="nav-subitem" href="' + href + '">' + esc(it.Title || "未命名收藏夹") + "</a>";
        }).join("");
      }
      async function loadFavList() {
        const sub = $("fav-sub");
        if (!sub) return;
        if (favCache) { renderFavList(favCache); return; }
        sub.innerHTML = '<div class="nav-sub-loading">加载中……</div>';
        try {
          const data = await api("/api/favlists");
          favCache = data.items || [];
          renderFavList(favCache);
        } catch (err) {
          sub.innerHTML = '<div class="nav-sub-loading">' + esc(err.message || "加载失败") + "</div>";
        }
      }

      // ---------- 侧边栏（与首页一致：折叠 + 导航 + 用户状态） ----------
      (function initSidebar() {
        const page = $("page");
        const toggle = $("sidebar-toggle");
        if (toggle && page) toggle.addEventListener("click", () => page.classList.toggle("sidebar-collapsed"));
        const go = (path) => { location.href = path; };
        const home = $("nav-home"), fav = $("fav-parent"), favGroup = $("fav-group"), reco = $("nav-recommend");
        if (home) home.addEventListener("click", () => go("/"));
        if (fav && favGroup) fav.addEventListener("click", () => {
          const isOpen = favGroup.classList.toggle("open");
          fav.setAttribute("aria-expanded", String(isOpen));
          if (isOpen) loadFavList();
        });
        if (reco) reco.addEventListener("click", () => go("/"));
        // 学习记录：默认展开，点击标题可收起/展开；展开时刷新列表
        const histParent = $("hist-parent"), histGroup = $("hist-group");
        if (histParent) {
          histParent.addEventListener("click", () => {
            if (histGroup.classList.toggle("open")) loadHistoryList();
          });
        }
        // 点击学习记录条目：站内切换，不整页刷新（避免闪一下白页）
        const histSub = $("hist-sub");
        if (histSub) {
          histSub.addEventListener("click", (e) => {
            const del = e.target.closest(".nav-subdel");     // 删除按钮优先：不触发跳转
            if (del) { e.preventDefault(); deleteHistory(del); return; }
            const a = e.target.closest("a.nav-subitem");
            if (!a) return;
            e.preventDefault();
            let targetUrl = "", targetSeg = 0, targetVersion = "", targetSegmentId = "";
            try {
              const pu = new URL(a.href, location.origin);
              targetUrl = pu.searchParams.get("url") || "";
              targetSeg = Number(pu.searchParams.get("seg")) || 0;
              targetVersion = pu.searchParams.get("version") || "";
              targetSegmentId = pu.searchParams.get("segment_id") || "";
            } catch (err) { location.href = a.href; return; }
            history.replaceState(null, "", a.getAttribute("href"));
            if ($("rd-start").hidden && histNormKey(targetUrl) === histNormKey(state.url)) {
              goSegment(targetSeg);                  // 同一篇：直接跳到记录的那一段
            } else {
              openArticle(targetUrl, targetSeg, targetVersion, targetSegmentId); // 换一篇：原地打开
            }
            renderHistList(histCache || []);         // 立即更新高亮
          });
        }
        loadHistoryList();   // 进页面即预加载（缓存），展开时即时显示
        fetch("/api/oauth/status").then((r) => r.json()).then((s) => {
          const name = $("user-name"), sub = $("user-sub"), av = $("user-avatar");
          if (!name || !s) return;
          if (s.authorized) {
            name.textContent = (s.profile && s.profile.name) || "已登录";
            sub.textContent = "知乎账号已连接";
            if (sub && s.profile && s.profile.avatar_url && av) av.innerHTML = '<img src="' + s.profile.avatar_url + '" alt="">';
            api("/api/billing/account").then((data) => {
              const account = data.account || {};
              const tier = account.membership_tier === "premium" ? "高级会员" : "普通用户";
              sub.textContent = tier + " · 本周期剩余 "
                + Number(account.daily_available_tokens || 0).toLocaleString("zh-CN") + " Token";
            }).catch(() => {});
          } else if (s.self_mode) {
            name.textContent = "本人模式";
            sub.textContent = "本地预览 · 未登录";
          }
        }).catch(() => { /* 静默：状态获取失败不影响阅读 */ });
      })();

      const params = new URLSearchParams(location.search);
      const preset = params.get("url");
      const startSeg = parseInt(params.get("seg") || "0", 10) || 0;
      const startVersion = params.get("version") || "";
      const startSegmentId = params.get("segment_id") || "";
      if (preset) {
        openArticle(preset, startSeg, startVersion, startSegmentId);
      } else {
        $("rd-spinner").hidden = true;
        $("rd-loading").textContent = "请从收藏夹或学习记录中选择一篇文章。";
        $("rd-start-actions").hidden = false;
        $("rd-open").hidden = true;
      }
    })();
  </script>
</body>
</html>
