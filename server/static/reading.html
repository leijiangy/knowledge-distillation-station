<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精读 · 知识蒸馏站</title>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/bg.js" defer></script>
  <style>
    /* ===== 精读会话（设计见 docs/学习会话设计-定稿.md） ===== */
    body.reading { padding: 20px; }
    .reading .page { max-width: 1240px; }
    .reading .content { padding: 16px var(--content-pad); }
    .rd { width: 100%; }

    /* 顶栏 */
    .rd-head { display: flex; align-items: center; gap: 14px; margin: 0 2px 8px; }
    .rd-head > a { color: var(--green); text-decoration: none; font-size: 13px; white-space: nowrap; }
    .rd-title-link { flex: 1; min-width: 0; text-decoration: none; color: inherit; }
    .rd-head h1 { font-size: 32px; line-height: 1.25; font-weight: 700; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .rd-title-link:hover h1 { color: var(--green); }
    /* 更新文章：右上角（清空旧解析 → 去知乎页面用书签重新保存） */
    .rd-refresh-article {
      flex: 0 0 auto; border: 1px solid var(--line); background: transparent;
      color: var(--ink-3); border-radius: 8px; padding: 6px 12px;
      font-size: 12.5px; font-family: inherit; cursor: pointer; white-space: nowrap;
      transition: color .18s ease, border-color .18s ease, background .18s ease;
    }
    .rd-refresh-article:hover { color: var(--green); border-color: rgba(47,122,61,.4); background: rgba(47,122,61,.05); }
    .rd-refresh-article.confirm { color: #a33; border-color: rgba(170,51,51,.5); font-weight: 700; }
    /* 作者信息（标题下方：头像 + 昵称 + 认证徽章/称号；头像与昵称可点进主页） */
    .rd-author { display: flex; align-items: center; gap: 9px; white-space: nowrap;
      font-size: 19px; color: var(--ink-2); margin: 0 2px 12px; }
    .rd-author-link { display: flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; }
    .rd-author-link:hover #rd-author-name { color: var(--green); }
    .rd-author img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    .rd-author img.rd-author-badge { width: 22px; height: 22px; border-radius: 0; }
    .rd-author .rd-author-title { font-size: 17px; color: var(--gold); font-weight: 700; }
    /* 换段导航（卡片内第 3 行，横跨两栏居中）：← 上一段 | 段落控件（点开为段列表） | 我懂了 → */
    .rd-nav-row { grid-row: 3; grid-column: 1 / -1; display: flex; align-items: center;
      justify-content: center; gap: 14px; margin-top: 10px; }
    .rd-seg-picker { position: relative; }
    .rd-seg-btn {
      border: 1px solid var(--line); background: rgba(255,255,252,.9); color: var(--ink);
      border-radius: 999px; padding: 6px 16px; font-size: 12.5px; font-weight: 700;
      font-family: inherit; cursor: pointer; white-space: nowrap;
    }
    .rd-seg-btn:hover { border-color: var(--green); color: var(--green); }
    .rd-seg-menu {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
      background: #fdfcf8; border: 1px solid var(--line-card); border-radius: 12px;
      padding: 10px; box-shadow: 0 12px 30px -14px rgba(30,40,28,.4); z-index: 6;
    }
    .rd-seg-item {
      width: 32px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
      background: transparent; color: var(--ink-2); font-family: inherit; font-size: 12.5px; cursor: pointer;
    }
    .rd-seg-item:hover { border-color: var(--green); color: var(--green); }
    .rd-seg-item.active { background: var(--green); color: #f6fbf3; border-color: var(--green); font-weight: 700; }

    /* 标签栏（层级）：卡片内顶部，横跨两栏 */
    .rd-tabs { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .rd-tab {
      border: 1px solid var(--line); background: rgba(255,255,252,.8); color: var(--ink-2);
      border-radius: 999px; padding: 4px 12px; font-size: 12.5px;
      max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: inherit;
    }
    .rd-tab.active { background: var(--green); color: #f6fbf3; border-color: var(--green); font-weight: 700; }
    .rd-tab-more {
      border: 1px dashed var(--line-card); border-radius: 999px; padding: 4px 10px;
      color: var(--ink-3); font-size: 12.5px; letter-spacing: 3px; line-height: 1.2;
    }

    /* 主体：两栏（左 = 当前层的父文本，右 = 这一层的内容） */
    .rd-body {
      display: grid; grid-template-columns: .85fr 1.15fr; column-gap: 16px;
      background-color: var(--paper); background-image: var(--noise);
      border: 1px solid var(--line-card); border-radius: 8px;
      box-shadow: 0 1px 2px rgba(30,40,28,.07), 0 14px 34px -18px rgba(30,40,28,.28);
      padding: 18px 20px;
      transition: grid-template-columns .32s ease;
    }
    .rd-pane { min-width: 0; min-height: 0; transition: opacity .3s ease; }
    .rd-pane:not(.rd-side) { display: flex; flex-direction: column; }
    @media (max-width: 900px) { .rd-body { grid-template-columns: 1fr; } #rd-body-main { height: auto; } }
    .rd-pane-label { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; }
    /* 会话卡片内的栏目标签不显示：层级信息由顶部标签栏承担，避免"本段解释/上一层的文本"重复出现 */
    #rd-body-main .rd-pane-label { display: none; }
    .rd-text {
      font-size: 15px; line-height: 2.05; color: var(--ink); white-space: pre-wrap;
      flex: 1 1 0; min-height: 320px; overflow-y: auto; padding: 4px 6px 10px;
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.6);
      user-select: text; overflow-anchor: none;   /* 关闭滚动锚定：重渲染时滚动位置由代码控制 */
    }
    /* 原文配图：文章级，放在左栏文本下方（原文里图片的字符位置没有记录，所以不做内联） */
    .rd-figs {
      flex: 0 0 auto; margin-top: 10px; padding: 8px 9px 9px;
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.6);
      max-height: 30%; overflow-y: auto;
    }
    .rd-figs-head { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 7px; }
    .rd-figs-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .rd-fig {
      width: 76px; height: 76px; padding: 0; display: block; cursor: pointer;
      border: 1px solid var(--line); border-radius: 6px; background: none; overflow: hidden;
    }
    .rd-fig img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rd-fig:hover { border-color: var(--green); }
    .rd-fig.active { border-color: var(--green); box-shadow: 0 0 0 2px rgba(47,122,61,.18); }
    .rd-fig.busy { opacity: .55; }

    .rd-explain {
      font-size: 14px; line-height: 1.95; color: var(--ink); white-space: pre-wrap;
      border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
      background: rgba(47,122,61,.16); min-height: 120px; overflow-y: auto; overflow-anchor: none;
      display: flex; flex-direction: column; height: 100%;
      flex: 1 1 100%; min-width: 0;
      transition: flex-basis .3s ease, opacity .3s ease, transform .3s ease,
                  padding .3s ease, border-width .3s ease;
    }
    #rd-explain-body { flex: 1 1 auto; min-height: 0; }
    .rd-explain .rd-explain-actions { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; gap: 8px; }

    /* 会话卡片：高度跟随视口，解释/回答吃掉剩余空间（对话与提问栏在下方纵向排布） */
    /* 会话卡片：高度跟随视口；第 1 行层级标签、第 3 行换段导航 */
    #rd-body-main { height: calc(100vh - 165px); min-height: 480px;
      grid-template-rows: auto minmax(0, 1fr) auto; }
    #rd-body-main > .rd-pane { grid-row: 2; }
    .rd-main { display: flex; align-items: stretch; min-width: 0; flex: 1 1 auto; min-height: 200px; }
    .rd-pair { flex: 1 1 100%; display: flex; align-items: stretch; min-width: 0; }
    .rd-answer {
      flex: 0 0 0; width: 0; opacity: 0; overflow: hidden;
      display: flex; flex-direction: column;
      border: 1px solid transparent; border-radius: 8px;
      transition: flex-basis .3s ease, width .3s ease, opacity .3s ease, margin .3s ease;
      height: 100%; position: relative; z-index: 1;
    }
    /* 回答出现：本层内容（解释）淡出收拢，回答占满右栏 */
    .rd-side.covered .rd-explain {
      flex: 0 1 0; min-width: 0; max-width: 0; padding: 0; border-width: 0;
      opacity: 0; transform: translateX(-10px); pointer-events: none;
    }
    .rd-side.covered .rd-answer {
      flex: 1 1 100%; width: auto; opacity: 1;
      border-color: var(--line); background: rgba(255,255,255,.6);
    }
    .rd-answer-head { display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px 0; }
    .rd-answer-q { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: var(--ink);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rd-answer-close { border: 0; background: none; color: var(--ink-3); font-size: 18px; line-height: 1;
      cursor: pointer; font-family: inherit; padding: 0 2px; }
    .rd-answer-close:hover { color: var(--ink); }
    .rd-answer-body { flex: 1; overflow-y: auto; padding: 8px 14px 14px;
      font-size: 14px; line-height: 1.95; color: var(--ink); white-space: pre-wrap; }
    /* 标记：共享=实线，私有=虚线；草稿=浏览器选中色 */
    .mk { cursor: pointer; }
    .mk-shared { border-bottom: 2px solid var(--green); background: rgba(47,122,61,.06); }
    .mk-private { border-bottom: 2px dashed var(--gold); background: rgba(183,134,40,.05); }
    .mk-active { background: rgba(47,122,61,.16); }
    .mk-draft { background: rgba(47, 122, 61, .22); }

    /* 公式（KaTeX 渲染）：独立成行的公式由 KaTeX 的 .katex-display 居中 */
    .kd-math-block .katex-display { margin: .45em 0; }
    /* 行内公式被标记：下划线贴着公式（行内 .katex 是行内元素） */
    .mk-shared .kd-math:not(.kd-math-block) .katex { border-bottom: 2px solid var(--green); }
    .mk-private .kd-math:not(.kd-math-block) .katex { border-bottom: 2px dashed var(--gold); }
    /* 独立成行的公式被标记：display 模式下 .katex 是块级，下划线会横贯整行，
       所以改成整行浅底纹——读起来是「这一块被标了」而不是一条分隔线 */
    .mk-shared:has(.kd-math-block) { border-bottom: 0; background: rgba(47,122,61,.09); }
    .mk-private:has(.kd-math-block) { border-bottom: 0; background: rgba(183,134,40,.08); }

    /* 右栏：这一层的内容（解释或回答）+ 提问栏 */
    .rd-pane { min-width: 0; }
    .rd-side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .rd-ask-area { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .rd-input-row { display: flex; gap: 8px; align-items: center; }
    .rd-input-row input {
      flex: 1; min-width: 0; padding: 10px 13px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--line); border-radius: 9px; background: #fff;
    }
    .rd-input-row .rd-btn { white-space: nowrap; }
    .rd-input-row .rd-hint { margin: 0; white-space: nowrap; }
    .rd-hint { font-size: 12px; color: var(--ink-3); margin-top: -4px; }
    .rd-nav { display: flex; gap: 10px; align-items: center; }
    .rd-btn {
      background: var(--green); color: #f6fbf3; border: none; cursor: pointer;
      padding: 10px 22px; font-size: 14px; font-weight: 700; border-radius: 9px; font-family: inherit;
    }
    .rd-btn:hover { background: var(--green-dark); }
    .rd-btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
    .rd-btn.ghost:hover { color: var(--green); border-color: #c6d2bf; }
    .rd-btn:disabled { opacity: .45; cursor: default; }
    .rd-error { color: #a33; font-size: 13px; white-space: pre-wrap; }
    .rd-error:empty { display: none; }   /* 无错误时不占位（保证输入框与左栏底边对齐） */
    .rd-done { text-align: center; padding: 40px 20px; }
    .rd-done h2 { font-size: 20px; margin-bottom: 14px; }
  </style>
</head>
<body class="reading">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="page" id="page">
    <!-- 侧边栏（与首页一致） -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15"><polygon points="12,4.5 19.5,16.5 4.5,16.5" fill="none" stroke="#f6fbf3" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="4.5" r="1.9" fill="#f6fbf3"/><circle cx="19.5" cy="16.5" r="1.9" fill="#f6fbf3"/><circle cx="4.5" cy="16.5" r="1.9" fill="#f6fbf3"/></svg>
          </span>
          知识蒸馏站
          <button class="sidebar-toggle" id="sidebar-toggle" title="收起侧边栏" aria-label="收起侧边栏">
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><polyline points="13,6 7,12 13,18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <nav class="nav-list">
          <button class="nav-item nav-parent" id="nav-home">
            <span class="left">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 11 L12 4.5 L20 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5 V19.5 H18 V10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              首页
            </span>
          </button>

          <button class="nav-item nav-parent" id="fav-parent">
            <span class="left">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><polygon points="12,5 19,16 5,16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              我的收藏
            </span>
          </button>

          <button class="nav-item nav-parent" id="nav-recommend">
            <span class="left">
              <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 4l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 16.3 7.2 18.9l.9-5.4L4.2 9.7l5.4-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
              智能推荐
            </span>
          </button>

          <div class="nav-group open" id="hist-group">
            <button class="nav-item nav-parent current" id="hist-parent">
              <span class="left">
                <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="12,7.5 12,12 15,13.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                学习记录
              </span>
              <svg class="chevron" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><polyline points="7,10 12,15 17,10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="nav-sub" id="hist-sub">
              <div class="nav-sub-loading">展开后加载……</div>
            </div>
          </div>
        </nav>

        <div class="user-block" id="user-block">
          <span class="nav-avatar" id="user-avatar">·</span>
          <div class="user-meta">
            <b id="user-name">未登录</b>
            <small id="user-sub">点击登录知乎账号</small>
          </div>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="rd">
    <div class="rd-head">
      <a class="rd-title-link" id="rd-title-link" href="#" target="_blank" rel="noopener">
        <h1 id="rd-title">精读</h1>
      </a>
      <button class="rd-refresh-article" id="rd-refresh-article"
              title="内容抓错了？清空后到知乎页面用书签重新保存">更新文章</button>
    </div>
    <div class="rd-author" id="rd-author" hidden>
      <a class="rd-author-link" id="rd-author-link" href="#" target="_blank" rel="noopener">
        <img id="rd-avatar" alt="">
        <span id="rd-author-name"></span>
      </a>
      <img class="rd-author-badge" id="rd-author-badge" alt="" hidden>
      <span class="rd-author-title" id="rd-author-title" hidden></span>
    </div>

    <!-- 开始卡 -->
    <div class="rd-body" id="rd-start" style="display:block">
      <p class="rd-pane-label">粘贴一篇已保存文章的知乎链接，开始逐段精读</p>
      <div class="rd-input-row" style="margin:10px 0">
        <input id="rd-url" placeholder="https://zhuanlan.zhihu.com/p/..." autocomplete="off">
        <button class="rd-btn" id="rd-open">开始</button>
      </div>
      <div class="rd-hint">首次打开会现场划分段落并生成第一段解释（约 10~30 秒），之后缓存复用。</div>
      <div class="rd-error" id="rd-start-error" style="margin-top:8px"></div>
    </div>

    <!-- 会话 -->
    <div id="rd-session" hidden>
      <div class="rd-body" id="rd-body-main">
        <div class="rd-tabs" id="rd-tabs" hidden></div>
        <div class="rd-pane">
          <div class="rd-pane-label" id="rd-left-label">本段原文</div>
          <div class="rd-text" id="rd-text"></div>
          <div class="rd-figs" id="rd-figs" hidden></div>
        </div>
        <div class="rd-pane rd-side" id="rd-side">
          <div class="rd-pane-label" id="rd-right-label">本段解释</div>
          <div class="rd-main">
            <div class="rd-pair" id="rd-pair">
              <div class="rd-explain" id="rd-explain">
                <div id="rd-explain-body"></div>
                <div class="rd-explain-actions">
                  <button class="rd-btn ghost" id="rd-del" style="padding:5px 14px;font-size:12.5px">删除这条解释</button>
                </div>
              </div>
              <!-- 回答：出现时替换本层解释的位置（层内提问则解释左移） -->
              <div class="rd-answer" id="rd-answer">
                <div class="rd-answer-head">
                  <span class="rd-answer-q" id="rd-answer-q"></span>
                  <button class="rd-answer-close" id="rd-answer-close" aria-label="关闭回答">×</button>
                </div>
                <div class="rd-answer-body" id="rd-answer-body"></div>
              </div>
            </div>
          </div>
          <!-- 提问栏：贴右栏下侧 -->
          <div class="rd-ask-area" id="rd-ask-area">
            <div class="rd-input-row">
              <input id="rd-question" placeholder="划选文字生成共享解释；或直接打字提问" autocomplete="off">
              <button class="rd-btn" id="rd-ask">提问</button>
            </div>
            <div class="rd-error" id="rd-ask-error"></div>
          </div>
        </div>

        <!-- 换段导航：横跨卡片底部居中 -->
        <div class="rd-nav-row">
          <button class="rd-btn ghost" id="rd-prev">← 上一段</button>
          <div class="rd-seg-picker">
            <button class="rd-seg-btn" id="rd-seg-btn" title="点击切换段落">第 1 / 1 段</button>
            <div class="rd-seg-menu" id="rd-seg-menu" hidden></div>
          </div>
          <span class="rd-hint" id="rd-nav-hint" hidden>生成中…</span>
          <button class="rd-btn" id="rd-done">我懂了 →</button>
        </div>
      </div>

      <div class="rd-done" id="rd-finish" hidden>
        <h2>🎉 这篇读完了</h2>
        <p class="rd-hint" style="margin-bottom:16px">你留在这里的提问和解释都保存着，随时可以回来。</p>
        <a class="rd-btn" href="/" style="text-decoration:none">返回收藏夹</a>
      </div>
    </div>
      </div>
    </main>
  </div>

  <!-- 公式渲染：KaTeX 本地化（server/static/vendor/katex）+ 识别与偏移映射（math.js） -->
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="/math.js"></script>
  <script>
    (() => {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const state = {
        url: "", article: null, seg: null,
        marks: [],        // 当前展示文本上的标记（共享 explain / 私有 ask 锚点）
        segNodes: [],     // 本段可见节点（共享 init/explain + 自己的 ask）
        tabs: [],         // 层级标签：[{nodeId, label, text, marks, explain, isRoot}]
        rootMarks: [],    // 本段的标记（回到根层时用）
        prefetch: {},     // 预加载：segIndex -> 段数据
        draft: null,      // 自绘划选草稿 {start, end}
        answerNodeId: null,   // 正在回答卡片里展示的提问节点（对话区去重用）
      };

      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      async function api(path, options) {
        const resp = await fetch(path, options);
        const data = await resp.json().catch(() => ({}));
        if (!data || data.ok === false) {
          const msg = (data && data.error && data.error.message) || ("请求失败（HTTP " + resp.status + "）");
          const err = new Error(msg); err.code = data && data.error && data.error.code;
          throw err;
        }
        return data;
      }

      // ---------- 选区：容器内字符偏移（原生选择优先，自绘草稿兜底） ----------
      // 偏移一律是「原文串下标」；公式已渲染成 HTML，长度换算交给 KDM.sourceOffset
      function selectionOffsets(container) {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0);
          if (container.contains(range.startContainer) && container.contains(range.endContainer)) {
            const rects = range.getClientRects();
            const startX = rects.length ? rects[0].left : null;
            const endX = rects.length ? rects[rects.length - 1].right : null;
            const start = KDM.sourceOffset(container, range.startContainer, range.startOffset, startX);
            const end = KDM.sourceOffset(container, range.endContainer, range.endOffset, endX);
            if (start != null && end != null && end > start) return { start, end };
          }
        }
        // 兜底：自绘草稿选区（宿主屏蔽原生文本选择时，如 ZCode 内置浏览器面板）
        if (state.draft && state.draft.scope !== "explain"
            && state.draft.start < state.draft.end) {
          return { start: state.draft.start, end: state.draft.end };
        }
        return null;
      }

      // 自绘划选：只依赖鼠标事件（mousedown/mousemove/mouseup），不依赖浏览器原生选择
      let dragging = false;

      function caretOffset(container, x, y) {
        let range = null;
        if (document.caretRangeFromPoint) {
          range = document.caretRangeFromPoint(x, y);
        } else if (document.caretPositionFromPoint) {
          const pos = document.caretPositionFromPoint(x, y);
          if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); range.collapse(true); }
        }
        if (!range) return null;
        // 公式是原子的：光标落在公式内，按左右半段吸附到公式的起点或终点
        return KDM.sourceOffset(container, range.startContainer, range.startOffset, x);
      }

      // 把区间裁剪为「包含锚点、且未被已有标记覆盖」的最大连续区间（避开标记，避免重叠被拒）
      function freeRange(range, marks, pos) {
        let a = range.start;
        let b = range.end;
        for (const m of marks) {
          if (m.end <= pos) a = Math.max(a, m.end);
          else if (m.start >= pos) b = Math.min(b, m.start);
          else return null;               // 锚点落在既有标记内部：不产生选区
        }
        return a < b ? { start: a, end: b } : null;
      }

      // 单击：选中"该位置所在的整句"（宿主拦截按住拖动时的主交互方式）
      function sentenceRangeAt(text, pos) {
        const isBound = (ch) => "。！？；!?;\n".includes(ch);
        let start = Math.max(0, Math.min(pos, Math.max(0, text.length - 1)));
        let end = start;
        while (start > 0 && !isBound(text[start - 1])) start--;
        while (end < text.length && !isBound(text[end])) end++;
        if (end < text.length) end++;     // 含句末标点
        return { start, end };
      }

      let moved = false;

      function setupSelection() {
        const bind = (el, scope) => {
          if (!el) return;
          el.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null) return;
            dragging = true;
            moved = false;
            state.draft = { start: off, end: off, scope };
          });
          el.addEventListener("mousemove", (e) => {
            if (!dragging || !state.draft) return;
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null || off === state.draft.end) return;
            if (Math.abs(off - state.draft.start) <= 2 && !moved) {
              state.draft.end = off;      // 微抖：只记位置，不重建 DOM（保证随后 click 能派发）
              return;
            }
            moved = true;
            state.draft.end = off;
            renderActiveTab();
          });
          el.addEventListener("click", (e) => {
            if (moved) {
              moved = false;
              const d = state.draft;
              if (d && Math.abs(d.end - d.start) > 2) return;          // 真实拖动：保留拖动结果
            }
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null) return;
            const tab = state.tabs[state.tabs.length - 1];
            if (!tab) return;
            // 右栏标记 = 锚在本层内容上的子解释；左栏标记 = 锚在本层文本上的
            const marks = scope === "explain"
              ? childMarks(tab.nodeId ? findNode(tab.nodeId) : null)
              : (tab.marks || []);
            // 通过字符位置判断：落在已有标记的区间内（含多行标记的行间空白）→ 打开该层
            const hit = marks.find((m) => off >= m.start && off < m.end);
            if (hit) { openExplainTab(hit.id); return; }
            if (e.target.closest && e.target.closest(".mk")) return;   // 点在标记元素边缘
            const text = scope === "explain" ? (tab.explain || "") : tab.text;
            const r = sentenceRangeAt(text, off);
            const free = freeRange(r, marks, off);
            state.draft = free ? { start: free.start, end: free.end, scope } : null;
            renderActiveTab();
          });
        };
        bind($("rd-text"), "text");
        bind($("rd-explain-body"), "explain");
        document.addEventListener("mouseup", () => {
          if (!dragging) return;
          dragging = false;
          const d = state.draft;
          if (!d) return;
          if (d.start === d.end) { state.draft = null; return; }   // 单击：不重建 DOM（保证 click 能派发）
          const tab = state.tabs[state.tabs.length - 1];
          const marks = d.scope === "explain" ? [] : ((tab && tab.marks) || []);
          const anchor = Math.min(d.start, d.end);
          const free = freeRange({ start: anchor, end: Math.max(d.start, d.end) }, marks, anchor);
          state.draft = free ? { start: free.start, end: free.end, scope: d.scope } : null;
          renderActiveTab();
        });
      }

      // ---------- 标记渲染 ----------
      // 文本 → HTML：公式交给 KDM（识别 + KaTeX 渲染），标记按原文下标包在片段外层
      function renderText(container, text, marks) {
        container.innerHTML = KDM.buildHtml({
          text, marks,
          markWrapper: (m, inner) => {
            const cls = m.kind === "explain" ? "mk-shared"
              : (m.kind === "draft" ? "mk-draft" : "mk-private");
            if (m.kind === "draft") return `<span class="mk ${cls}">` + inner + "</span>";
            return `<span class="mk ${cls}" data-node="${esc(m.id)}" data-ask="${m.kind === "ask" ? 1 : 0}">`
              + inner + "</span>";
          },
        });
        container.querySelectorAll(".mk").forEach((el) => {
          el.addEventListener("click", () => {
            const id = Number(el.getAttribute("data-node"));
            if (!id) return;
            openExplainTab(id);   // 实线（共享解释）与虚线（私有提问）统一：点击即进入该层
          });
        });
      }

      // ---------- 回答区：两栏模型（左=你在读的文本，右=它的解释或回答） ----------
      function clearAnswer() {
        const side = $("rd-side");
        if (side) side.classList.remove("covered");
        state.answerNodeId = null;
      }

      // 回答出现：右栏的本层内容（解释）让位，回答占满
      function showAnswer(question, answer, nodeId) {
        const side = $("rd-side");
        if (!side) return;
        state.answerNodeId = nodeId || null;
        KDM.renderMathInto($("rd-answer-q"), question || "");
        KDM.renderMathInto($("rd-answer-body"), answer || "");
        const label = $("rd-right-label");
        if (label) label.textContent = "回答";
        side.classList.remove("covered");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          side.classList.add("covered");
        }));
      }

      // 关闭回答：回答层则收起这一层（回到上一层），否则本层解释恢复
      function hideAnswer() {
        const tab = state.tabs[state.tabs.length - 1];
        if (tab && tab.isAnswerLayer) {
          state.tabs.pop();
          renderActiveTab(true);
        } else {
          const label = $("rd-right-label");
          if (label) label.textContent = tab ? (tab.isRoot ? "本段解释" : "这一层的解释") : "本段解释";
        }
        clearAnswer();
      }

      // ---------- 层级标签（只作层级指示：不提供关闭/跳转，退出靠「收起这一层」逐层进行） ----------
      function renderTabs() {
        const bar = $("rd-tabs");
        const total = state.tabs.length;
        if (total <= 1) { bar.hidden = true; bar.innerHTML = ""; return; }
        bar.hidden = false;
        // 超过五个：左边保留第一个、右侧保留最后两层，中间折叠成一个省略框
        let items;
        if (total > 5) {
          items = [
            { tab: state.tabs[0], active: false },
            { more: true },
            { tab: state.tabs[total - 2], active: false },
            { tab: state.tabs[total - 1], active: true },
          ];
        } else {
          items = state.tabs.map((t, i) => ({ tab: t, active: i === total - 1 }));
        }
        bar.innerHTML = items.map((it) => it.more
          ? '<span class="rd-tab-more">…</span>'
          : `<span class="rd-tab${it.active ? " active" : ""}" title="${esc(it.tab.label)}">`
            + esc(it.tab.label) + "</span>"
        ).join("");
      }

      function trimTabsTo(index) {
        state.tabs = state.tabs.slice(0, index + 1);
        clearAnswer();   // 退层时收起回答
        renderActiveTab(true);
      }

      function closeTopTab() {
        if (state.tabs.length <= 1) return;
        state.tabs.pop();
        clearAnswer();
        renderActiveTab(true);
      }

      // 渲染当前层：始终保持两侧滚动位置不变（不做任何自动跳转；调用点多传的参数一律忽略）
      function renderActiveTab() {
        const tab = state.tabs[state.tabs.length - 1];
        if (!tab) return;
        const textEl = $("rd-text");
        const explainBox = $("rd-explain-body") ? $("rd-explain-body").parentElement : null;
        const keepText = textEl.scrollTop;
        const keepExplain = explainBox ? explainBox.scrollTop : 0;
        renderTabs();
        $("rd-left-label").textContent = tab.isRoot ? "本段原文" : "上一层的文本";
        $("rd-right-label").textContent = tab.isRoot
          ? "本段解释" : (tab.isAnswerLayer ? "回答" : "这一层的解释");
        $("rd-text").innerHTML = "";
        const marksWithDraft = [...(tab.marks || [])];
        if (state.draft && state.draft.scope !== "explain"
            && state.draft.start < state.draft.end) {
          marksWithDraft.push({ id: 0, kind: "draft",
                                start: state.draft.start, end: state.draft.end });
        }
        renderText($("rd-text"), tab.text, marksWithDraft);
        const explainText = tab.explain || "（生成中或生成失败）";
        // 右栏标记：锚在本层内容上的子解释 / 子提问
        const curNode = tab.nodeId ? findNode(tab.nodeId) : null;
        const explainMarks = curNode ? childMarks(curNode) : [];
        if (state.draft && state.draft.scope === "explain"
            && state.draft.start < state.draft.end) {
          explainMarks.push({ id: 0, kind: "draft",
                              start: state.draft.start, end: state.draft.end });
        }
        renderText($("rd-explain-body"), explainText, explainMarks);
        // 恢复滚动位置（DOM 重建后；下一帧再校正一次，防止布局抖动影响）
        textEl.scrollTop = keepText;
        if (explainBox) explainBox.scrollTop = keepExplain;
        requestAnimationFrame(() => {
          textEl.scrollTop = keepText;
          if (explainBox) explainBox.scrollTop = keepExplain;
        });
        const del = $("rd-del");
        if (del) {
          del.hidden = Boolean(tab.isRoot) || !tab.nodeId;   // 初始解释固定不变；回答层无独立解释节点
          del.onclick = () => deleteNode(tab.nodeId);
        }
        $("rd-done").textContent = tab.isRoot
          ? (state.seg.index + 1 >= state.article.total ? "读完了 →" : "我懂了 →")
          : "收起这一层 ←";
        $("rd-prev").disabled = !tab.isRoot || state.seg.index <= 0;
        const root = state.tabs[0];
        if (root) state.marks = root.marks;
      }

      // 进入某一层（点击标记 / 生成选区解释后）：
      // 左栏 = 该节点所锚定的文本（锚在原文上就是原文，锚在解释上才是解释），右栏 = 该节点的内容
      function openExplainTab(nodeId) {
        const node = findNode(nodeId);
        if (!node) return;
        clearAnswer();   // 换层时收起回答
        const existing = state.tabs.findIndex((t) => t.nodeId === nodeId);
        if (existing >= 0) { trimTabsTo(existing); return; }   // 已在层栈中：直接回到那一层
        const anchorNodeId = node.parent_id || null;
        const parentNode = anchorNodeId ? findNode(anchorNodeId) : null;
        const rootTab = state.tabs[0];
        // 同层切换：新节点与当前层锚定在同一段文本上（兄弟标记）→ 替换当前层，而不是再叠一层
        const current = state.tabs[state.tabs.length - 1];
        if (current && !current.isRoot && current.anchorNodeId === anchorNodeId) {
          state.tabs.pop();
        }
        state.tabs.push({
          nodeId,
          anchorNodeId,
          label: (node.content || node.question || "").slice(0, 14) || "解释",
          text: parentNode ? (parentNode.content || "") : (rootTab ? rootTab.text : ""),
          marks: parentNode ? childMarks(parentNode) : segMarks(state.segNodes),
          explain: node.kind === "ask"
            ? ("Q：" + (node.question || "") + "\n\n" + (node.content || ""))
            : (node.content || ""),
          isRoot: false,
        });
        renderActiveTab(true);   // 换层：回到顶部
      }

      function childMarks(node) {
        // 子节点偏移统一为「相对父节点内容文本」
        if (!node) return [];
        return state.segNodes
          .filter((n) => n.parent_id === node.id && n.pos_start != null && n.pos_end != null)
          .map((n) => ({ id: n.id, kind: n.kind === "ask" ? "ask" : "explain",
                         start: n.pos_start, end: n.pos_end }));
      }

      function findNode(id) {
        return (state.segNodes || []).find((n) => n.id === id);
      }

      // ---------- 原文配图（文章级）：点一张 → 右栏给这张图的解释 ----------
      function renderFigs() {
        const box = $("rd-figs");
        if (!box) return;
        const imgs = (state.article && state.article.images) || [];
        if (!imgs.length) { box.hidden = true; box.innerHTML = ""; return; }
        box.hidden = false;
        // referrerpolicy：知乎图床有防盗链，卡片那边也是这么处理的
        box.innerHTML = '<div class="rd-figs-head">原文配图 ' + imgs.length + " 张 · 点击看解释</div>"
          + '<div class="rd-figs-row">' + imgs.map((u) =>
            '<button type="button" class="rd-fig" data-fig="' + esc(u) + '" title="解释这张图">'
            + '<img src="' + esc(u) + '" alt="" loading="lazy" referrerpolicy="no-referrer"></button>'
          ).join("") + "</div>";
      }

      async function explainFigure(btn) {
        const image = btn.getAttribute("data-fig") || "";
        if (!image || !state.url) return;
        const box = $("rd-figs");
        if (box) box.querySelectorAll(".rd-fig").forEach((b) => b.classList.toggle("active", b === btn));
        showAnswer("这张图说明了什么？", "正在看图……", null);
        btn.classList.add("busy");
        try {
          const data = await api("/api/reading/image", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: state.url, image,
                                   context: (state.seg && state.seg.text) || "" }),
          });
          KDM.renderMathInto($("rd-answer-body"), data.explain || "（没有拿到解释）");
        } catch (err) {
          KDM.renderMathInto($("rd-answer-body"), "解释失败：" + err.message);
        } finally {
          btn.classList.remove("busy");
        }
      }

      // ---------- 渲染一段 ----------
      function segMarks(nodes) {
        return (nodes || [])
          .filter((n) => n.pos_start != null && n.pos_end != null && n.kind !== "init"
                         && !n.parent_id)   // 根层只显示顶层标记；子标记属于各自的层
          .map((n) => ({ id: n.id, kind: n.kind === "ask" ? "ask" : "explain",
                         start: n.pos_start, end: n.pos_end }));
      }

      function renderSegment(payload) {
        clearAnswer();   // 换段时收起回答
        state.seg = payload;
        state.segNodes = payload.nodes || [];
        state.rootMarks = segMarks(payload.nodes);
        state.tabs = [{ nodeId: payload.explain_id, anchorNodeId: null, label: "本段解释", text: payload.text,
                        marks: state.rootMarks, explain: payload.explain || "（生成中或生成失败）", isRoot: true }];
        state.marks = state.rootMarks;
        renderProgress();
        renderActiveTab();   // 换段：不重置滚动（用户可自行滚动）
        preloadSegment(payload.index + 1);   // 预加载下一段的解释，消除「我懂了」后的等待
      }

      // 预加载：进入本段后，后台静默生成下一段的初始解释（服务端按段懒生成 + 缓存）
      function preloadSegment(n) {
        if (n < 0 || !state.article || n >= state.article.total) return;
        if (state.prefetch[n]) return;
        const gen = articleGen;   // 换文章后丢弃旧结果
        api("/api/reading/segment?url=" + encodeURIComponent(state.url) + "&seg=" + n)
          .then((data) => {
            if (gen !== articleGen) return;
            // 仅在尚未到达该段时缓存（防止过期数据覆盖当前段）
            if (state.seg && state.seg.index < n) state.prefetch[n] = data.segment;
          })
          .catch(() => { /* 静默：真正进入该段时会重新请求 */ });
      }

      // ---------- 操作 ----------
      // 顶部作者：服务端从收藏夹精确取到的名字优先；头像/徽章只在搜索匹配到同一名字时采用
      async function loadAuthor(url, title, known) {
        const box = $("rd-author");
        if (!box) return;
        box.hidden = true;
        let name = (known && known.name) || "";
        let avatar = "", badge = "", badgeText = "", token = "";
        try {
          const data = await api("/api/article_meta", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: [{ url, title }] }),
          });
          const meta = (data.meta || {})[url];
          if (meta && meta.author_name) {
            const same = !name || meta.author_name === name;
            if (!name) name = meta.author_name;
            if (same) {
              avatar = meta.avatar || "";
              badge = meta.badge || "";
              badgeText = meta.badge_text || "";
              token = meta.author_token || "";
            }
          }
        } catch (err) { /* 静默：拿不到头像/称号不影响阅读 */ }
        if (!name) return;
        $("rd-author-name").textContent = name;
        // 头像/昵称点击进入知乎主页
        const profile = (known && known.url)
          || (known && known.url_token ? "https://www.zhihu.com/people/" + known.url_token : "")
          || (token ? "https://www.zhihu.com/people/" + token : "");
        const link = $("rd-author-link");
        if (profile) { link.href = profile; link.target = "_blank"; } else { link.removeAttribute("href"); }
        const img = $("rd-avatar");
        if (avatar) {
          img.onerror = () => { img.hidden = true; };   // 图拉不到（离线/被拦）时只显示名字
          img.src = avatar;
          img.hidden = false;
        }
        const badgeImg = $("rd-author-badge");
        if (badge) {
          badgeImg.onerror = () => { badgeImg.hidden = true; };
          badgeImg.src = badge;
          badgeImg.hidden = false;
        }
        const badgeLabel = $("rd-author-title");
        if (badgeText) {
          badgeLabel.textContent = badgeText;
          badgeLabel.hidden = false;
        }
        box.hidden = false;
      }

      // 文章代次：切换文章后自增，旧的异步请求返回时直接丢弃（避免覆盖新文章）
      let articleGen = 0;

      async function openArticle(url, startSeg) {
        const gen = ++articleGen;
        state.prefetch = {};   // 换文章：清空上一批预加载的段落
        $("rd-start-error").textContent = "";
        $("rd-open").disabled = true;
        $("rd-url").disabled = true;
        try {
          const data = await api("/api/reading/open", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          if (gen !== articleGen) return;   // 期间又切换了文章：丢弃本次结果
          state.url = url;
          state.article = data.article;
          KDM.renderMathInto($("rd-title"), data.article.title || "精读");
          renderFigs();
          $("rd-title-link").href = url;   // 点标题回知乎原文
          loadAuthor(url, data.article.title || "", data.article.author);
          $("rd-start").hidden = true; $("rd-session").hidden = false;
          renderSegment(data.segment);
          loadHistoryList(true);   // 侧边栏学习记录：强制刷新以更新进度与高亮
          // 学习记录恢复：跳到上次读到的段落
          const target = Number(startSeg) || 0;
          if (target > 0 && target < (data.article.total || 0)) goSegment(target);
        } catch (err) {
          if (gen !== articleGen) return;   // 期间已切换文章：不显示旧错误
          $("rd-start-error").textContent = err.message
            + (err.code === "NOT_DISTILLED" ? "（先在收藏列表里点「去保存全文」）" : "");
          $("rd-open").disabled = false;
          $("rd-url").disabled = false;
        }
      }

      // 换段导航：页数控件文案
      function renderProgress() {
        const btn = $("rd-seg-btn");
        if (btn && state.article && state.seg) {
          btn.textContent = "第 " + (state.seg.index + 1) + " / " + state.article.total + " 段";
        }
      }

      // 段列表：点开可跳任意一段
      function toggleSegMenu(show) {
        const menu = $("rd-seg-menu");
        if (!menu) return;
        const open = show !== undefined ? show : menu.hidden;
        if (open) {
          const total = (state.article && state.article.total) || 0;
          const cur = state.seg ? state.seg.index : 0;
          menu.innerHTML = "";
          for (let i = 0; i < total; i++) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "rd-seg-item" + (i === cur ? " active" : "");
            b.textContent = String(i + 1);
            b.addEventListener("click", () => {
              toggleSegMenu(false);
              if (i !== cur) goSegment(i);
            });
            menu.appendChild(b);
          }
        }
        menu.hidden = !open;
      }

      async function goSegment(n) {
        if (n < 0 || (state.article && n >= state.article.total)) return;
        const gen = articleGen;   // 记录代次：期间若切换文章，本次结果丢弃
        if (state.prefetch[n]) {           // 命中预加载：秒切
          const cached = state.prefetch[n];
          delete state.prefetch[n];
          renderSegment(cached);
          return;
        }
        $("rd-nav-hint").hidden = false;
        $("rd-prev").disabled = $("rd-done").disabled = true;
        try {
          const data = await api("/api/reading/segment?url=" + encodeURIComponent(state.url) + "&seg=" + n);
          if (gen !== articleGen) return;   // 已切换文章：丢弃
          renderSegment(data.segment);
        } catch (err) {
          if (gen === articleGen) alert("进入段落失败：" + err.message);
        } finally {
          $("rd-nav-hint").hidden = true;
          $("rd-done").disabled = false;
        }
      }

      async function submit() {
        const question = $("rd-question").value.trim();
        const offsets = selectionOffsets($("rd-text"));
        const explainDraft = (state.draft && state.draft.scope === "explain"
                              && state.draft.start < state.draft.end) ? state.draft : null;
        const tab = state.tabs[state.tabs.length - 1];
        if (!question && !offsets && !explainDraft) {
          $("rd-ask-error").textContent = "先划选一段文字，或输入你的问题。";
          return;
        }
        // 选区偏移一律相对「当前层左栏文本」；左栏文本归属其锚点节点（root 层为段落本身）
        const anchorTab = state.tabs.length > 1 ? state.tabs[state.tabs.length - 2] : null;
        const leftAnchorId = anchorTab ? anchorTab.nodeId : null;
        $("rd-ask-error").textContent = "";
        $("rd-ask").disabled = true; $("rd-ask").textContent = "生成中…";
        try {
          if (!question && (offsets || explainDraft)) {
            // 纯选中 = 共享选区解释：左栏文字锚在上一层内容上，右栏解释文字锚在本层内容上
            const sel = offsets || explainDraft;
            const body = { url: state.url, seg: state.seg.index,
                           pos_start: sel.start, pos_end: sel.end };
            const anchorId = offsets ? leftAnchorId : (tab ? tab.nodeId : null);
            if (anchorId != null) body.parent_id = anchorId;
            const data = await api("/api/reading/selection", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            state.draft = null;
            state.segNodes.push(data.node);
            refreshMarks(tab);
            window.getSelection().removeAllRanges();
            openExplainTab(data.node.id);   // 生成后立刻打开该解释层，让用户看到内容
          } else {
            // 有输入 = 私有提问（锚定选区或当前层）；右栏选中但没打字时默认问"这段是什么意思"
            const askText = question || "这段是什么意思？";
            const body = { url: state.url, seg: state.seg.index, question: askText };
            if (offsets) {                                  // 左栏选区提问：锚在左栏文本空间
              body.pos_start = offsets.start; body.pos_end = offsets.end;
              if (leftAnchorId != null) body.parent_id = leftAnchorId;
            } else if (explainDraft) {                      // 右栏解释选区提问：锚在本层内容上
              body.pos_start = explainDraft.start; body.pos_end = explainDraft.end;
              body.anchor_text = ((tab && tab.explain) || "").slice(explainDraft.start, explainDraft.end);
              if (tab && tab.nodeId) body.parent_id = tab.nodeId;
            } else if (tab && !tab.isRoot && tab.nodeId) {  // 无选区：挂在当前层内容节点上
              body.parent_id = tab.nodeId;
            }
            const data = await api("/api/reading/ask", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            state.segNodes.push(data.node);
            state.draft = null;
            if (explainDraft) {
              // 问解释：解释左移成为这一层的父文本（左栏），回答占据右栏
              const curNode = tab.nodeId ? findNode(tab.nodeId) : null;
              state.tabs.push({
                nodeId: data.node.id, anchorNodeId: tab.nodeId, label: "追问",
                text: tab.explain || "", marks: childMarks(curNode),
                explain: data.node.content || "",
                isRoot: false, isAnswerLayer: true,
              });
            }
            renderActiveTab(Boolean(explainDraft));   // 换成回答层（解释左移）时回到顶部；同层提问保持位置
            showAnswer(askText, data.node.content || "", data.node.id);
            $("rd-question").value = "";
            window.getSelection().removeAllRanges();
          }
        } catch (err) {
          $("rd-ask-error").textContent = err.message;
        } finally {
          $("rd-ask").disabled = false; $("rd-ask").textContent = "提问";
        }
      }

      // 标记刷新：左栏文本归属其锚点节点（root / 锚在原文上的节点 → 段内标记；锚在某节点内容上 → 该内容上的子标记）
      function refreshMarks(tab) {
        const root = state.tabs[0];
        if (root) { root.anchorNodeId = null; root.marks = segMarks(state.segNodes); }
        if (tab && !tab.isRoot) {
          const anchor = tab.anchorNodeId ? findNode(tab.anchorNodeId) : null;
          tab.marks = anchor ? childMarks(anchor) : segMarks(state.segNodes);
        }
        renderActiveTab();   // 同层刷新：保持滚动位置
      }

      let pendingDelete = null;

      async function deleteNode(nodeId) {
        if (!nodeId) return;
        // 二次点击确认（原生 confirm 弹窗可能被宿主屏蔽）
        if (pendingDelete !== nodeId) {
          pendingDelete = nodeId;
          const btn = $("rd-del");
          if (btn) btn.textContent = "再点一次确认删除";
          setTimeout(() => {
            if (pendingDelete === nodeId) {
              pendingDelete = null;
              const b = $("rd-del");
              if (b) b.textContent = "删除这条解释";
            }
          }, 4000);
          return;
        }
        pendingDelete = null;
        const btnReset = $("rd-del");
        if (btnReset) btnReset.textContent = "删除这条解释";
        try {
          await api("/api/reading/node/" + nodeId + "?url=" + encodeURIComponent(state.url),
                    { method: "DELETE" });
          // 重新载入本段：标记、解释、层栈全部回到一致状态（下划线随之消失）
          const data = await api("/api/reading/segment?url=" + encodeURIComponent(state.url)
                                 + "&seg=" + state.seg.index);
          renderSegment(data.segment);
        } catch (err) {
          $("rd-ask-error").textContent = "删除失败：" + err.message;
        }
      }

      async function understood() {
        const tab = state.tabs[state.tabs.length - 1];
        if (!tab.isRoot) { closeTopTab(); return; }     // 层级：收起本层
        if (state.seg.index + 1 >= state.article.total) {   // 最后一段：读完
          fetch("/api/reading/event", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: state.url, event: "understood", seg_index: state.seg.index }),
          }).catch(() => {});
          $("rd-session").querySelector(".rd-body").hidden = true;
          $("rd-tabs").hidden = true;
          $("rd-right-label").hidden = true;
          const askArea = $("rd-ask-area");
          if (askArea) askArea.hidden = true;
          $("rd-finish").hidden = false;
          return;
        }
        fetch("/api/reading/event", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: state.url, event: "understood", seg_index: state.seg.index }),
        }).catch(() => {});
        await goSegment(state.seg.index + 1);
      }

      // ---------- 事件 ----------
      $("rd-open").addEventListener("click", () => {
        const url = $("rd-url").value.trim();
        if (!url) { $("rd-start-error").textContent = "请先粘贴知乎链接。"; return; }
        openArticle(url);
      });
      $("rd-url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("rd-open").click(); });
      $("rd-ask").addEventListener("click", submit);
      $("rd-question").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      $("rd-done").addEventListener("click", understood);
      $("rd-prev").addEventListener("click", () => goSegment(state.seg.index - 1));
      // 段落控件：点开段列表，点外部关闭
      $("rd-seg-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleSegMenu(); });
      document.addEventListener("click", (e) => {
        const menu = $("rd-seg-menu");
        if (menu && !menu.hidden && !e.target.closest(".rd-seg-picker")) toggleSegMenu(false);
      });
      $("rd-answer-close").addEventListener("click", hideAnswer);
      setupSelection();   // 划选：按住拖动 + 单击选整句（均不依赖原生文本选择）
      const figsBox = $("rd-figs");
      if (figsBox) {
        figsBox.addEventListener("click", (e) => {
          const fig = e.target.closest(".rd-fig");
          if (fig) explainFigure(fig);
        });
      }

      // 更新文章：清空旧解析与笔记 → 打开知乎原文，点书签重新保存（保存后自动跳回并开读）
      (function initRefreshArticle() {
        const btn = $("rd-refresh-article");
        if (!btn) return;
        let pending = false, timer = null;
        const reset = () => {
          pending = false;
          btn.classList.remove("confirm");
          btn.disabled = false;
          btn.textContent = "更新文章";
        };
        btn.addEventListener("click", async () => {
          if (!state.url) return;
          if (!pending) {   // 第一次点击进入确认态（原生 confirm 可能被宿主屏蔽，沿用两次点击确认）
            pending = true;
            btn.classList.add("confirm");
            btn.textContent = "再点一次确认更新";
            timer = setTimeout(reset, 4000);
            return;
          }
          clearTimeout(timer);
          btn.classList.remove("confirm");
          pending = false;
          btn.disabled = true;
          btn.textContent = "清空中…";
          try {
            const res = await fetch("/api/distilled?url=" + encodeURIComponent(state.url), { method: "DELETE" });
            const data = await res.json();
            if (!data.ok) throw new Error((data.error && data.error.message) || "清空失败");
            window.open(state.url.split("#")[0] + "#kd=1", "_blank");
            btn.textContent = "已清空 · 去知乎点书签";
            $("rd-ask-error").textContent =
              "已清空本篇的解析与笔记。请在打开的知乎页面点一下书签「🧪 保存这篇文章」，保存后会跳回来并重新开读。";
            setTimeout(reset, 6000);
          } catch (err) {
            reset();
            $("rd-ask-error").textContent = "更新失败：" + (err.message || "未知错误");
          }
        });
      })();

      // ---------- 学习记录下拉（有缓存即时渲染；打开文章后强制刷新以更新进度/高亮） ----------
      const histNormKey = (u) => {
        const m = String(u || "").match(/\/answer\/(\d+)/);
        return m ? ("answer/" + m[1]) : String(u || "").split("?")[0].split("#")[0];
      };
      let histCache = null;   // 同一次浏览内复用，避免每次展开都等加载
      function renderHistList(items) {
        const sub = $("hist-sub");
        if (!sub) return;
        if (!items.length) {
          sub.innerHTML = '<div class="nav-sub-loading">还没有学习记录</div>';
          return;
        }
        const curKey = histNormKey(state.url);
        sub.innerHTML = items.map((it) => {
          const href = "/reading.html?url=" + encodeURIComponent(it.url) + "&seg=" + (it.seg || 0);
          const label = it.total > 1 ? ((it.seg || 0) + 1) + "/" + it.total : "";
          const active = histNormKey(it.url) === curKey ? " active" : "";   // 当前打开的文章高亮
          return '<div class="nav-subrow">'
            + '<a class="nav-subitem' + active + '" href="' + href + '" title="' + esc(it.title || "") + '">'
            + '<span class="nav-subitem-title">' + KDM.buildHtml({ text: it.title || it.url || "" }) + '</span>'
            + (label ? '<span class="sub-count">' + label + '</span>' : "")
            + '</a>'
            + '<button type="button" class="nav-subdel" data-del="' + esc(it.url || "") + '"'
            + ' title="删除这条学习记录，并把这篇重置为未保存全文" aria-label="删除这条学习记录">×</button>'
            + "</div>";
        }).join("");
      }

      // 删除一条学习记录：二次点击确认（原生 confirm 弹窗可能被宿主屏蔽）
      let pendingHistDel = null;
      function resetHistDel(btn) {
        btn.disabled = false;
        btn.classList.remove("confirm");
        btn.textContent = "×";
      }
      async function deleteHistory(btn) {
        const url = btn.getAttribute("data-del") || "";
        if (!url) return;
        if (pendingHistDel !== url) {
          pendingHistDel = url;
          btn.classList.add("confirm");
          btn.textContent = "确认";
          setTimeout(() => { if (pendingHistDel === url) { pendingHistDel = null; resetHistDel(btn); } }, 4000);
          return;
        }
        pendingHistDel = null;
        btn.disabled = true;
        try {
          await api("/api/reading/history?url=" + encodeURIComponent(url), { method: "DELETE" });
          // 删的正是手上这篇：全文已被重置，这个会话没法继续，回起始页重新选一篇
          if (histNormKey(url) === histNormKey(state.url)) { location.href = "/reading.html"; return; }
          histCache = (histCache || []).filter((it) => it.url !== url);
          renderHistList(histCache);
        } catch (err) {
          resetHistDel(btn);
          alert("删除失败：" + err.message);
        }
      }
      async function loadHistoryList(force) {
        const sub = $("hist-sub");
        if (!sub) return;
        if (histCache && !force) { renderHistList(histCache); return; }   // 命中缓存：即时显示
        if (!histCache) sub.innerHTML = '<div class="nav-sub-loading">加载中……</div>';
        try {
          const res = await fetch("/api/reading/history");
          const data = await res.json();
          histCache = (data.items || []).slice(0, 12);
          renderHistList(histCache);
        } catch (err) {
          if (!histCache) sub.innerHTML = '<div class="nav-sub-loading">加载失败</div>';
        }
      }

      // ---------- 侧边栏（与首页一致：折叠 + 导航 + 用户状态） ----------
      (function initSidebar() {
        const page = $("page");
        const toggle = $("sidebar-toggle");
        if (toggle && page) toggle.addEventListener("click", () => page.classList.toggle("sidebar-collapsed"));
        const go = (path) => { location.href = path; };
        const home = $("nav-home"), fav = $("fav-parent"), reco = $("nav-recommend");
        if (home) home.addEventListener("click", () => go("/"));
        if (fav) fav.addEventListener("click", () => go("/"));
        if (reco) reco.addEventListener("click", () => go("/"));
        // 学习记录：默认展开，点击标题可收起/展开；展开时刷新列表
        const histParent = $("hist-parent"), histGroup = $("hist-group");
        if (histParent) {
          histParent.addEventListener("click", () => {
            if (histGroup.classList.toggle("open")) loadHistoryList();
          });
        }
        // 点击学习记录条目：站内切换，不整页刷新（避免闪一下白页）
        const histSub = $("hist-sub");
        if (histSub) {
          histSub.addEventListener("click", (e) => {
            const del = e.target.closest(".nav-subdel");     // 删除按钮优先：不触发跳转
            if (del) { e.preventDefault(); deleteHistory(del); return; }
            const a = e.target.closest("a.nav-subitem");
            if (!a) return;
            e.preventDefault();
            let targetUrl = "", targetSeg = 0;
            try {
              const pu = new URL(a.href, location.origin);
              targetUrl = pu.searchParams.get("url") || "";
              targetSeg = Number(pu.searchParams.get("seg")) || 0;
            } catch (err) { location.href = a.href; return; }
            history.replaceState(null, "", a.getAttribute("href"));
            if (histNormKey(targetUrl) === histNormKey(state.url)) {
              goSegment(targetSeg);                  // 同一篇：直接跳到记录的那一段
            } else {
              openArticle(targetUrl, targetSeg);     // 换一篇：原地打开
            }
            renderHistList(histCache || []);         // 立即更新高亮
          });
        }
        loadHistoryList();   // 进页面即预加载（缓存），展开时即时显示
        fetch("/api/oauth/status").then((r) => r.json()).then((s) => {
          const name = $("user-name"), sub = $("user-sub"), av = $("user-avatar");
          if (!name || !s) return;
          if (s.authorized) {
            name.textContent = (s.profile && s.profile.name) || "已登录";
            sub.textContent = "知乎账号已连接";
            if (sub && s.profile && s.profile.avatar_url && av) av.innerHTML = '<img src="' + s.profile.avatar_url + '" alt="">';
          } else if (s.self_mode) {
            name.textContent = "本人模式";
            sub.textContent = "本地预览 · 未登录";
          }
        }).catch(() => { /* 静默：状态获取失败不影响阅读 */ });
      })();

      const params = new URLSearchParams(location.search);
      const preset = params.get("url");
      const startSeg = parseInt(params.get("seg") || "0", 10) || 0;
      if (preset) { $("rd-url").value = preset; openArticle(preset, startSeg); }
    })();
  </script>
</body>
</html>
