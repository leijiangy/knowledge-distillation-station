<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精读 · 知识蒸馏站</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ===== 精读会话（设计见 docs/学习会话设计-定稿.md） ===== */
    body.reading { padding: 20px 16px 24px; }
    .rd { width: 100%; max-width: 1240px; margin: 0 auto; }

    /* 顶栏 */
    .rd-head { display: flex; align-items: baseline; gap: 14px; margin: 0 2px 12px; }
    .rd-head a { color: var(--green); text-decoration: none; font-size: 13px; white-space: nowrap; }
    .rd-head h1 { font-size: 16px; font-weight: 700; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rd-head .rd-progress { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }

    /* 主旨条 */
    .rd-summary { color: var(--ink-2); font-size: 13px; line-height: 1.7;
      border-left: 3px solid var(--green); background: rgba(47,122,61,.04);
      padding: 8px 12px; border-radius: 0 6px 6px 0; margin-bottom: 12px; }

    /* 标签栏（层级） */
    .rd-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .rd-tab {
      border: 1px solid var(--line); background: rgba(255,255,252,.8); color: var(--ink-2);
      border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer;
      max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: inherit;
    }
    .rd-tab.active { background: var(--green); color: #f6fbf3; border-color: var(--green); font-weight: 700; }
    .rd-tab .x { opacity: .7; margin-left: 6px; }

    /* 主体：左原文 / 右解释 */
    .rd-body {
      display: grid; grid-template-columns: 1.12fr .88fr; gap: 16px;
      background-color: var(--paper); background-image: var(--noise);
      border: 1px solid var(--line-card); border-radius: 8px;
      box-shadow: 0 1px 2px rgba(30,40,28,.07), 0 14px 34px -18px rgba(30,40,28,.28);
      padding: 18px 20px;
    }
    @media (max-width: 900px) { .rd-body { grid-template-columns: 1fr; } }
    .rd-pane-label { font-size: 12px; color: var(--ink-3); font-weight: 700; margin-bottom: 8px; }
    .rd-text {
      font-size: 15px; line-height: 2.05; color: var(--ink); white-space: pre-wrap;
      max-height: 58vh; overflow-y: auto; padding: 4px 6px 10px;
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.6);
      user-select: text;
    }
    .rd-explain {
      font-size: 14px; line-height: 1.95; color: var(--ink); white-space: pre-wrap;
      border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
      background: rgba(47,122,61,.05); min-height: 120px; max-height: 58vh; overflow-y: auto;
    }
    .rd-explain .rd-explain-actions { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); display: flex; gap: 8px; }
    /* 标记：共享=实线，私有=虚线；草稿=浏览器选中色 */
    .mk { cursor: pointer; }
    .mk-shared { border-bottom: 2px solid var(--green); background: rgba(47,122,61,.06); }
    .mk-private { border-bottom: 2px dashed var(--gold); background: rgba(183,134,40,.05); }
    .mk-active { background: rgba(47,122,61,.16); }
    .mk-draft { background: rgba(47, 122, 61, .22); }

    /* 底部对话 + 导航（常驻：滚动时钉在视口底部） */
    .rd-bottom {
      margin-top: 14px; display: flex; flex-direction: column; gap: 10px;
      position: sticky; bottom: 8px; z-index: 20;
      background: rgba(253, 252, 248, .95);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 -6px 24px -18px rgba(30, 40, 28, .35);
    }
    .rd-qa { display: flex; flex-direction: column; gap: 8px; max-height: 26vh; overflow-y: auto; }
    .rd-qa .q { font-size: 13.5px; font-weight: 700; }
    .rd-qa .a { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap;
      border-left: 3px solid var(--line-card); padding-left: 10px; }
    .rd-qa .a .del { margin-left: 8px; font-size: 12px; color: var(--ink-3); cursor: pointer; border: 0; background: none; font-family: inherit; }
    .rd-input-row { display: flex; gap: 8px; }
    .rd-input-row input {
      flex: 1; padding: 10px 13px; font-size: 14px; font-family: inherit;
      border: 1px solid var(--line); border-radius: 9px; background: #fff;
    }
    .rd-hint { font-size: 12px; color: var(--ink-3); margin-top: -4px; }
    .rd-nav { display: flex; gap: 10px; align-items: center; }
    .rd-btn {
      background: var(--green); color: #f6fbf3; border: none; cursor: pointer;
      padding: 10px 22px; font-size: 14px; font-weight: 700; border-radius: 9px; font-family: inherit;
    }
    .rd-btn:hover { background: var(--green-dark); }
    .rd-btn.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--line); }
    .rd-btn.ghost:hover { color: var(--green); border-color: #c6d2bf; }
    .rd-btn:disabled { opacity: .45; cursor: default; }
    .rd-error { color: #a33; font-size: 13px; white-space: pre-wrap; }
    .rd-done { text-align: center; padding: 40px 20px; }
    .rd-done h2 { font-size: 20px; margin-bottom: 14px; }
  </style>
</head>
<body class="reading">
  <div class="rd">
    <div class="rd-head">
      <a href="/">← 收藏夹</a>
      <h1 id="rd-title">精读</h1>
      <span class="rd-progress" id="rd-progress"></span>
    </div>

    <!-- 开始卡 -->
    <div class="rd-body" id="rd-start" style="display:block">
      <p class="rd-pane-label">粘贴一篇已蒸馏文章的知乎链接，开始逐段精读</p>
      <div class="rd-input-row" style="margin:10px 0">
        <input id="rd-url" placeholder="https://zhuanlan.zhihu.com/p/..." autocomplete="off">
        <button class="rd-btn" id="rd-open">开始</button>
      </div>
      <div class="rd-hint">首次打开会现场划分段落并生成第一段解释（约 10~30 秒），之后缓存复用。</div>
      <div class="rd-error" id="rd-start-error" style="margin-top:8px"></div>
    </div>

    <!-- 会话 -->
    <div id="rd-session" hidden>
      <div class="rd-summary" id="rd-summary"></div>
      <div class="rd-tabs" id="rd-tabs" hidden></div>

      <div class="rd-body">
        <div>
          <div class="rd-pane-label" id="rd-left-label">本段原文</div>
          <div class="rd-text" id="rd-text"></div>
        </div>
        <div>
          <div class="rd-pane-label" id="rd-right-label">本段解释</div>
          <div class="rd-explain" id="rd-explain">
            <div id="rd-explain-body"></div>
            <div class="rd-explain-actions">
              <button class="rd-btn ghost" id="rd-del" style="padding:5px 14px;font-size:12.5px">删除这条解释</button>
            </div>
          </div>
        </div>
      </div>

      <div class="rd-bottom">
        <div class="rd-qa" id="rd-qa"></div>
        <div class="rd-input-row">
          <input id="rd-question" placeholder="划选一段文字生成共享解释；或直接打字提问（只有自己可见）" autocomplete="off">
          <button class="rd-btn" id="rd-ask">提问</button>
        </div>
        <div class="rd-error" id="rd-ask-error"></div>
        <div class="rd-nav">
          <button class="rd-btn ghost" id="rd-prev">← 上一段</button>
          <button class="rd-btn" id="rd-done">我懂了 →</button>
          <span class="rd-hint" id="rd-nav-hint" hidden style="margin:0">生成中…</span>
        </div>
      </div>

      <div class="rd-done" id="rd-finish" hidden>
        <h2>🎉 这篇读完了</h2>
        <p class="rd-hint" style="margin-bottom:16px">你留在这里的提问和解释都保存着，随时可以回来。</p>
        <a class="rd-btn" href="/" style="text-decoration:none">返回收藏夹</a>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const state = {
        url: "", article: null, seg: null,
        marks: [],        // 当前展示文本上的标记（共享 explain / 私有 ask 锚点）
        segNodes: [],     // 本段可见节点（共享 init/explain + 自己的 ask）
        tabs: [],         // 层级标签：[{nodeId, label, text, marks, explain, isRoot}]
        rootMarks: [],    // 本段的标记（回到根层时用）
        prefetch: {},     // 预加载：segIndex -> 段数据
        draft: null,      // 自绘划选草稿 {start, end}
      };

      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      async function api(path, options) {
        const resp = await fetch(path, options);
        const data = await resp.json().catch(() => ({}));
        if (!data || data.ok === false) {
          const msg = (data && data.error && data.error.message) || ("请求失败（HTTP " + resp.status + "）");
          const err = new Error(msg); err.code = data && data.error && data.error.code;
          throw err;
        }
        return data;
      }

      // ---------- 选区：容器内字符偏移（原生选择优先，自绘草稿兜底） ----------
      function selectionOffsets(container) {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed && sel.rangeCount > 0) {
          const range = sel.getRangeAt(0);
          if (container.contains(range.startContainer) && container.contains(range.endContainer)) {
            const pre = document.createRange();
            pre.selectNodeContents(container);
            pre.setEnd(range.startContainer, range.startOffset);
            const start = pre.toString().length;
            const length = range.toString().length;
            if (length > 0) return { start, end: start + length };
          }
        }
        // 兜底：自绘草稿选区（宿主屏蔽原生文本选择时，如 ZCode 内置浏览器面板）
        if (state.draft && state.draft.scope !== "explain"
            && state.draft.start < state.draft.end) {
          return { start: state.draft.start, end: state.draft.end };
        }
        return null;
      }

      // 自绘划选：只依赖鼠标事件（mousedown/mousemove/mouseup），不依赖浏览器原生选择
      let dragging = false;

      function caretOffset(container, x, y) {
        let range = null;
        if (document.caretRangeFromPoint) {
          range = document.caretRangeFromPoint(x, y);
        } else if (document.caretPositionFromPoint) {
          const pos = document.caretPositionFromPoint(x, y);
          if (pos) { range = document.createRange(); range.setStart(pos.offsetNode, pos.offset); range.collapse(true); }
        }
        if (!range || !container.contains(range.startContainer)) return null;
        const pre = document.createRange();
        pre.selectNodeContents(container);
        pre.setEnd(range.startContainer, range.startOffset);
        return pre.toString().length;
      }

      // 把区间裁剪为「包含锚点、且未被已有标记覆盖」的最大连续区间（避开标记，避免重叠被拒）
      function freeRange(range, marks, pos) {
        let a = range.start;
        let b = range.end;
        for (const m of marks) {
          if (m.end <= pos) a = Math.max(a, m.end);
          else if (m.start >= pos) b = Math.min(b, m.start);
          else return null;               // 锚点落在既有标记内部：不产生选区
        }
        return a < b ? { start: a, end: b } : null;
      }

      // 单击：选中"该位置所在的整句"（宿主拦截按住拖动时的主交互方式）
      function sentenceRangeAt(text, pos) {
        const isBound = (ch) => "。！？；!?;\n".includes(ch);
        let start = Math.max(0, Math.min(pos, Math.max(0, text.length - 1)));
        let end = start;
        while (start > 0 && !isBound(text[start - 1])) start--;
        while (end < text.length && !isBound(text[end])) end++;
        if (end < text.length) end++;     // 含句末标点
        return { start, end };
      }

      let moved = false;

      function setupSelection() {
        const bind = (el, scope) => {
          if (!el) return;
          el.addEventListener("mousedown", (e) => {
            if (e.button !== 0) return;
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null) return;
            dragging = true;
            moved = false;
            state.draft = { start: off, end: off, scope };
          });
          el.addEventListener("mousemove", (e) => {
            if (!dragging || !state.draft) return;
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null || off === state.draft.end) return;
            if (Math.abs(off - state.draft.start) <= 2 && !moved) {
              state.draft.end = off;      // 微抖：只记位置，不重建 DOM（保证随后 click 能派发）
              return;
            }
            moved = true;
            state.draft.end = off;
            renderActiveTab();
          });
          el.addEventListener("click", (e) => {
            if (moved) {
              moved = false;
              const d = state.draft;
              if (d && Math.abs(d.end - d.start) > 2) return;          // 真实拖动：保留拖动结果
            }
            const off = caretOffset(el, e.clientX, e.clientY);
            if (off == null) return;
            const tab = state.tabs[state.tabs.length - 1];
            if (!tab) return;
            const marks = scope === "explain" ? [] : (tab.marks || []);
            // 通过字符位置判断：落在已有标记的区间内（含多行标记的行间空白）→ 打开该层
            const hit = marks.find((m) => off >= m.start && off < m.end);
            if (hit) { openExplainTab(hit.id); return; }
            if (e.target.closest && e.target.closest(".mk")) return;   // 点在标记元素边缘
            const text = scope === "explain" ? (tab.explain || "") : tab.text;
            const r = sentenceRangeAt(text, off);
            const free = freeRange(r, marks, off);
            state.draft = free ? { start: free.start, end: free.end, scope } : null;
            renderActiveTab();
          });
        };
        bind($("rd-text"), "text");
        bind($("rd-explain-body"), "explain");
        document.addEventListener("mouseup", () => {
          if (!dragging) return;
          dragging = false;
          const d = state.draft;
          if (!d) return;
          if (d.start === d.end) { state.draft = null; return; }   // 单击：不重建 DOM（保证 click 能派发）
          const tab = state.tabs[state.tabs.length - 1];
          const marks = d.scope === "explain" ? [] : ((tab && tab.marks) || []);
          const anchor = Math.min(d.start, d.end);
          const free = freeRange({ start: anchor, end: Math.max(d.start, d.end) }, marks, anchor);
          state.draft = free ? { start: free.start, end: free.end, scope: d.scope } : null;
          renderActiveTab();
        });
      }

      // ---------- 标记渲染 ----------
      function renderText(container, text, marks) {
        const list = [...(marks || [])].sort((a, b) => a.start - b.start);
        let html = "";
        let pos = 0;
        for (const m of list) {
          if (m.start < pos) continue;              // 防御：忽略异常重叠
          if (m.start > pos) html += esc(text.slice(pos, m.start));
          const cls = m.kind === "explain" ? "mk-shared"
            : (m.kind === "draft" ? "mk-draft" : "mk-private");
          if (m.kind === "draft") {
            html += `<span class="mk ${cls}">` + esc(text.slice(m.start, m.end)) + "</span>";
          } else {
            html += `<span class="mk ${cls}" data-node="${m.id}" data-ask="${m.kind === "ask" ? 1 : 0}">`
              + esc(text.slice(m.start, m.end)) + "</span>";
          }
          pos = m.end;
        }
        html += esc(text.slice(pos));
        container.innerHTML = html;
        container.querySelectorAll(".mk").forEach((el) => {
          el.addEventListener("click", () => {
            const id = Number(el.getAttribute("data-node"));
            if (!id) return;
            openExplainTab(id);   // 实线（共享解释）与虚线（私有提问）统一：点击即进入该层
          });
        });
      }

      function scrollToAsk(id) {
        const box = document.querySelector('#rd-qa [data-qa="' + id + '"]');
        if (box) box.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      // ---------- 层级标签 ----------
      function renderTabs() {
        const bar = $("rd-tabs");
        if (!state.tabs.length) { bar.hidden = true; bar.innerHTML = ""; return; }
        bar.hidden = false;
        bar.innerHTML = state.tabs.map((t, i) =>
          `<button class="rd-tab${i === state.tabs.length - 1 ? " active" : ""}" data-tab="${i}">`
          + esc(t.label)
          + (t.isRoot ? "" : '<span class="x">×</span>')
          + "</button>").join("");
        bar.querySelectorAll("[data-tab]").forEach((el) => {
          el.addEventListener("click", (ev) => {
            const i = Number(el.getAttribute("data-tab"));
            if (i === state.tabs.length - 1 && ev.target.classList.contains("x")) { closeTopTab(); return; }
            trimTabsTo(i);
          });
        });
      }

      function trimTabsTo(index) {
        state.tabs = state.tabs.slice(0, index + 1);
        renderActiveTab();
      }

      function closeTopTab() {
        if (state.tabs.length <= 1) return;
        state.tabs.pop();
        renderActiveTab();
      }

      function renderActiveTab() {
        const tab = state.tabs[state.tabs.length - 1];
        if (!tab) return;
        renderTabs();
        $("rd-left-label").textContent = tab.isRoot ? "本段原文" : "上一层的文本";
        $("rd-right-label").textContent = tab.isRoot ? "本段解释" : "这一层的解释";
        $("rd-text").innerHTML = "";
        const marksWithDraft = [...(tab.marks || [])];
        if (state.draft && state.draft.start < state.draft.end) {
          marksWithDraft.push({ id: 0, kind: "draft",
                                start: state.draft.start, end: state.draft.end });
        }
        renderText($("rd-text"), tab.text, marksWithDraft);
        const explainText = tab.explain || "（生成中或生成失败）";
        const explainMarks = [];
        if (state.draft && state.draft.scope === "explain"
            && state.draft.start < state.draft.end) {
          explainMarks.push({ id: 0, kind: "draft",
                              start: state.draft.start, end: state.draft.end });
        }
        renderText($("rd-explain-body"), explainText, explainMarks);
        const del = $("rd-del");
        if (del) {
          del.hidden = Boolean(tab.isRoot);   // 初始解释固定不变，不提供删除
          del.onclick = () => deleteNode(tab.nodeId);
        }
        $("rd-done").textContent = tab.isRoot
          ? (state.seg.index + 1 >= state.article.total ? "读完了 →" : "我懂了 →")
          : "收起这一层 ←";
        $("rd-prev").disabled = !tab.isRoot || state.seg.index <= 0;
        const root = state.tabs[0];
        if (root) state.marks = root.marks;
      }

      function openExplainTab(nodeId) {
        const node = findNode(nodeId);
        if (!node) return;
        const existing = state.tabs.findIndex((t) => t.nodeId === nodeId);
        if (existing >= 0) { trimTabsTo(existing); return; }   // 已在层栈中：直接回到那一层
        const parentTab = state.tabs[state.tabs.length - 1];
        const children = childMarks(node);
        state.tabs.push({
          nodeId,
          label: (node.content || node.question || "").slice(0, 14) || "解释",
          text: parentTab.text.slice(node.pos_start || 0, node.pos_end || 0) || parentTab.text,
          marks: children,
          explain: node.kind === "ask"
            ? ("Q：" + (node.question || "") + "\n\n" + (node.content || ""))
            : (node.content || ""),
          isRoot: false,
        });
        renderActiveTab();
      }

      function childMarks(node) {
        return state.segNodes
          .filter((n) => n.parent_id === node.id && n.pos_start != null && n.pos_end != null)
          .map((n) => ({ id: n.id, kind: n.kind === "ask" ? "ask" : "explain",
                         start: n.pos_start, end: n.pos_end }));
      }

      function findNode(id) {
        return (state.segNodes || []).find((n) => n.id === id);
      }

      // ---------- 渲染一段 ----------
      function segMarks(nodes) {
        return (nodes || [])
          .filter((n) => n.pos_start != null && n.pos_end != null && n.kind !== "init")
          .map((n) => ({ id: n.id, kind: n.kind === "ask" ? "ask" : "explain",
                         start: n.pos_start, end: n.pos_end }));
      }

      function renderQa(nodes) {
        const box = $("rd-qa");
        box.innerHTML = "";
        (nodes || []).filter((n) => n.kind === "ask" && !n.parent_id).forEach((n) => {
          const q = document.createElement("div");
          q.className = "q"; q.setAttribute("data-qa", n.id); q.textContent = "Q：" + (n.question || "");
          const a = document.createElement("div");
          a.className = "a"; a.textContent = n.content || "";
          const del = document.createElement("button");
          del.className = "del"; del.textContent = "删除";
          del.addEventListener("click", () => deleteNode(n.id));
          a.appendChild(del);
          box.appendChild(q); box.appendChild(a);
        });
      }

      function renderSegment(payload) {
        state.seg = payload;
        state.segNodes = payload.nodes || [];
        state.rootMarks = segMarks(payload.nodes);
        state.tabs = [{ nodeId: payload.explain_id, label: "本段解释", text: payload.text,
                        marks: state.rootMarks, explain: payload.explain || "（生成中或生成失败）", isRoot: true }];
        state.marks = state.rootMarks;
        $("rd-progress").textContent = "第 " + (payload.index + 1) + " / " + payload.total + " 段";
        renderQa(payload.nodes);
        renderActiveTab();
        $("rd-text").scrollTop = 0;
        preloadSegment(payload.index + 1);   // 预加载下一段的解释，消除「我懂了」后的等待
      }

      // 预加载：进入本段后，后台静默生成下一段的初始解释（服务端按段懒生成 + 缓存）
      function preloadSegment(n) {
        if (n < 0 || !state.article || n >= state.article.total) return;
        if (state.prefetch[n]) return;
        api("/api/reading/segment?url=" + encodeURIComponent(state.url) + "&seg=" + n)
          .then((data) => {
            // 仅在尚未到达该段时缓存（防止过期数据覆盖当前段）
            if (state.seg && state.seg.index < n) state.prefetch[n] = data.segment;
          })
          .catch(() => { /* 静默：真正进入该段时会重新请求 */ });
      }

      // ---------- 操作 ----------
      async function openArticle(url) {
        $("rd-start-error").textContent = "";
        $("rd-open").disabled = true;
        $("rd-url").disabled = true;
        try {
          const data = await api("/api/reading/open", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          state.url = url;
          state.article = data.article;
          $("rd-title").textContent = data.article.title || "精读";
          $("rd-summary").textContent = data.article.summary ? "主旨：" + data.article.summary : "";
          $("rd-summary").hidden = !data.article.summary;
          $("rd-start").hidden = true; $("rd-session").hidden = false;
          renderSegment(data.segment);
        } catch (err) {
          $("rd-start-error").textContent = err.message
            + (err.code === "NOT_DISTILLED" ? "（先在收藏列表里点「去蒸馏全文」）" : "");
          $("rd-open").disabled = false;
          $("rd-url").disabled = false;
        }
      }

      async function goSegment(n) {
        if (n < 0 || (state.article && n >= state.article.total)) return;
        if (state.prefetch[n]) {           // 命中预加载：秒切
          const cached = state.prefetch[n];
          delete state.prefetch[n];
          renderSegment(cached);
          return;
        }
        $("rd-nav-hint").hidden = false;
        $("rd-prev").disabled = $("rd-done").disabled = true;
        try {
          const data = await api("/api/reading/segment?url=" + encodeURIComponent(state.url) + "&seg=" + n);
          renderSegment(data.segment);
        } catch (err) {
          alert("进入段落失败：" + err.message);
        } finally {
          $("rd-nav-hint").hidden = true;
          $("rd-done").disabled = false;
        }
      }

      async function submit() {
        const question = $("rd-question").value.trim();
        const offsets = selectionOffsets($("rd-text"));
        const explainDraft = (state.draft && state.draft.scope === "explain"
                              && state.draft.start < state.draft.end) ? state.draft : null;
        const tab = state.tabs[state.tabs.length - 1];
        if (!question && !offsets) {
          $("rd-ask-error").textContent = explainDraft
            ? "已选中解释中的内容——请连同你的问题一起提问。"
            : "先划选一段文字，或输入你的问题。";
          return;
        }
        // 层内选区：把「层内偏移」换算回「段内偏移」（嵌套节点锚定在原文上）
        let posStart = null, posEnd = null;
        if (offsets) {
          let base = 0;
          if (tab && !tab.isRoot && tab.nodeId) {
            const parent = findNode(tab.nodeId);
            if (parent && parent.pos_start != null) base = parent.pos_start;
          }
          posStart = base + offsets.start;
          posEnd = base + offsets.end;
        }
        $("rd-ask-error").textContent = "";
        $("rd-ask").disabled = true; $("rd-ask").textContent = "生成中…";
        try {
          if (posStart != null && !question) {
            // 纯选中 = 共享解释（层内选中时锚定为该层的子节点）
            const body = { url: state.url, seg: state.seg.index,
                           pos_start: posStart, pos_end: posEnd };
            if (tab && !tab.isRoot && tab.nodeId) body.parent_id = tab.nodeId;
            const data = await api("/api/reading/selection", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            state.draft = null;
            state.segNodes.push(data.node);
            refreshMarks(tab);
            window.getSelection().removeAllRanges();
            openExplainTab(data.node.id);   // 生成后立刻打开该解释层，让用户看到内容
          } else {
            // 有输入 = 私有提问（锚定选区或当前层）
            const body = { url: state.url, seg: state.seg.index, question };
            if (posStart != null) { body.pos_start = posStart; body.pos_end = posEnd; }
            else if (explainDraft) {
              const t = (tab && tab.explain) || "";
              body.anchor_text = t.slice(explainDraft.start, explainDraft.end);
            }
            else if (tab && !tab.isRoot && tab.nodeId) { body.parent_id = tab.nodeId; }
            const data = await api("/api/reading/ask", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            state.segNodes.push(data.node);
            if (tab.isRoot) { renderQa(state.segNodes); }
            if (posStart != null) { state.draft = null; refreshMarks(tab); }
            $("rd-question").value = "";
            window.getSelection().removeAllRanges();
          }
        } catch (err) {
          $("rd-ask-error").textContent = err.message;
        } finally {
          $("rd-ask").disabled = false; $("rd-ask").textContent = "提问";
        }
      }

      // 标记刷新：根层用段内标记；层内用该节点的子标记（子节点偏移是段内的，需相对父节点换算）
      function refreshMarks(tab) {
        const root = state.tabs[0];
        if (root) root.marks = segMarks(state.segNodes);
        if (tab && !tab.isRoot && tab.nodeId) {
          const parent = findNode(tab.nodeId);
          if (parent) {
            tab.marks = childMarks(parent).map((m) => ({
              id: m.id, kind: m.kind,
              start: m.start - (parent.pos_start || 0),
              end: m.end - (parent.pos_start || 0),
            }));
          }
        }
        renderActiveTab();
      }

      let pendingDelete = null;

      async function deleteNode(nodeId) {
        if (!nodeId) return;
        // 二次点击确认（原生 confirm 弹窗可能被宿主屏蔽）
        if (pendingDelete !== nodeId) {
          pendingDelete = nodeId;
          const btn = $("rd-del");
          if (btn) btn.textContent = "再点一次确认删除";
          setTimeout(() => {
            if (pendingDelete === nodeId) {
              pendingDelete = null;
              const b = $("rd-del");
              if (b) b.textContent = "删除这条解释";
            }
          }, 4000);
          return;
        }
        pendingDelete = null;
        const btnReset = $("rd-del");
        if (btnReset) btnReset.textContent = "删除这条解释";
        try {
          await api("/api/reading/node/" + nodeId + "?url=" + encodeURIComponent(state.url),
                    { method: "DELETE" });
          // 重新载入本段：标记、解释、层栈全部回到一致状态（下划线随之消失）
          const data = await api("/api/reading/segment?url=" + encodeURIComponent(state.url)
                                 + "&seg=" + state.seg.index);
          renderSegment(data.segment);
        } catch (err) {
          $("rd-ask-error").textContent = "删除失败：" + err.message;
        }
      }

      async function understood() {
        const tab = state.tabs[state.tabs.length - 1];
        if (!tab.isRoot) { closeTopTab(); return; }     // 层级：收起本层
        if (state.seg.index + 1 >= state.article.total) {   // 最后一段：读完
          fetch("/api/reading/event", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: state.url, event: "understood", seg_index: state.seg.index }),
          }).catch(() => {});
          $("rd-session").querySelector(".rd-body").hidden = true;
          $("rd-tabs").hidden = true;
          $("rd-right-label").hidden = true;
          document.querySelector(".rd-bottom").hidden = true;
          $("rd-finish").hidden = false;
          return;
        }
        fetch("/api/reading/event", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: state.url, event: "understood", seg_index: state.seg.index }),
        }).catch(() => {});
        await goSegment(state.seg.index + 1);
      }

      // ---------- 事件 ----------
      $("rd-open").addEventListener("click", () => {
        const url = $("rd-url").value.trim();
        if (!url) { $("rd-start-error").textContent = "请先粘贴知乎链接。"; return; }
        openArticle(url);
      });
      $("rd-url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("rd-open").click(); });
      $("rd-ask").addEventListener("click", submit);
      $("rd-question").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
      $("rd-done").addEventListener("click", understood);
      $("rd-prev").addEventListener("click", () => goSegment(state.seg.index - 1));
      setupSelection();   // 划选：按住拖动 + 单击选整句（均不依赖原生文本选择）

      const params = new URLSearchParams(location.search);
      const preset = params.get("url");
      if (preset) { $("rd-url").value = preset; openArticle(preset); }
    })();
  </script>
</body>
</html>
